# Every push and pull request: the lints, the coding standard, PHPStan at level max, and the whole test suite with
# 100 % line coverage. Offline: the tests use a scripted model, no API key is needed.
name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: pdo_sqlite, intl
                  coverage: pcov
                  tools: composer:v2

            - name: Cache Composer packages
              uses: actions/cache@v4
              with:
                  path: ~/.composer/cache/files
                  key: composer-${{ hashFiles('composer.lock') }}

            - run: composer install --no-interaction --no-progress --prefer-dist

            - run: composer validate --strict

            - run: composer lint

            - run: composer cs

            - run: composer stan

            - run: composer coverage
