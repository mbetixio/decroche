# Décroche in one container, over plain HTTP on one port (put your own HTTPS reverse proxy in front for a public
# domain). Your settings, starting with the model's key, go in .env.docker (copy .env.docker.dist), never in the
# repository:
#   cp .env.docker.dist .env.docker      then put your key in it
#   docker compose up -d --build         then open http://localhost:7077
services:
  decroche:
    build: .
    image: decroche:latest
    restart: unless-stopped
    # Reachable from this machine only by default: until the first manager signs up, whoever opens the instance first
    # becomes its manager. Once that account exists, open it to your proxy: DECROCHE_BIND=0.0.0.0 docker compose up -d
    # (DECROCHE_PORT for another port).
    ports:
      - "${DECROCHE_BIND:-127.0.0.1}:${DECROCHE_PORT:-7077}:80"
    # Every setting of the app comes from this file, as is (see .env.docker.dist): nothing is read from the repository's
    # own .env, which is the development defaults.
    env_file:
      - path: .env.docker
        required: true
    volumes:
      - decroche:/var/decroche
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/login') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  decroche:
