# Sparring en production : un seul service, en HTTP sur un port. Le domaine et le HTTPS sont gérés devant
# (Nginx Proxy Manager : un Proxy Host vers http://<ip du serveur>:7077, websockets inutiles).
#   docker compose up -d --build
# La configuration est dans .env.prod (dont SPARRING_DOMAIN, le domaine public).
services:
  sparring:
    build: .
    image: sparring:latest
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "${SPARRING_PORT:-7077}:80"
    volumes:
      # La base SQLite, les sessions, les voix déjà générées.
      - sparring:/var/sparring
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  sparring:
