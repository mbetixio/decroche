mcp:
    servers:
        sparring:
            name: 'Sparring'
            version: '1.0.0'
            description: "The sales team's practice ground, tailored to their company's offer: tough calls against an AI persona with a hidden brief, then a graded debrief."
            instructions: |
                Sparring trains sellers for hard sales calls. The other party (the "persona") is played by this server: they
                have a hidden brief (real budget, real pain, who decides, objections, what would get a yes) that neither you
                nor the seller can read before the debrief. That wall is the exercise: never pretend to know more.
                To start, new_call draws a call situation from the company's catalogue (a price request, a cold call, an
                unhappy client, a renewal…) and returns its briefing with a call link: give the seller the link, it opens the
                phone screen in their browser, already signed in, to take the call out loud. With mode "chat" the call is
                played here instead: show the briefing and the persona's first line, then relay the seller's words with reply,
                word for word, without improving them, and show the persona's answer as is. Never invent a persona line and
                do not coach during the call unless the seller explicitly asks. When they hang up: hang_up, then the debrief
                app shows the graded debrief. prepare_call rehearses a real meeting from a prospect sheet. situations, library
                and call_link give access to the catalogue and the managers' scenarios. my_progress gives the seller's
                figures and missions; managers also have team, member_progress, give_mission and invite.
                Answer in the seller's language.
            transports:
                stdio: false
                http: true
            request_state:
                key: '%env(MCP_STATE_KEY)%'
            registry: 'App\Mcp\'
            http:
                path: /mcp
                allowed_hosts: '%env(csv:MCP_ALLOWED_HOSTS)%'
