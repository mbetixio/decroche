security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        sellers:
            entity: { class: App\Entity\Seller, property: email }
        mcp_keys:
            entity: { class: App\Entity\Seller, property: mcpKeyHash }

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # Claude, ChatGPT ou tout client MCP s'entraîne au nom d'un commercial : sa clé personnelle, dans l'adresse
        # (/mcp?key=…) ou en « Authorization: Bearer … ».
        mcp:
            pattern: ^/mcp
            stateless: true
            provider: mcp_keys
            custom_authenticators: [App\Mcp\SellerKeyAuthenticator]
            entry_point: App\Mcp\SellerKeyAuthenticator
        main:
            lazy: true
            provider: sellers
            form_login:
                login_path: login
                check_path: login
                default_target_path: home
                enable_csrf: true
            logout:
                path: logout
                target: login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                name: SPARRING_REMEMBERME

    access_control:
        - { path: ^/(connexion|inscription)$, roles: PUBLIC_ACCESS }
        - { path: ^/rejoindre/, roles: PUBLIC_ACCESS }
        - { path: ^/mcp, roles: ROLE_USER }
        - { path: ^/equipe, roles: ROLE_MANAGER }
        - { path: ^/espace, roles: ROLE_MANAGER }
        - { path: ^/, roles: ROLE_USER }

    role_hierarchy:
        ROLE_MANAGER: ROLE_USER

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
