security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        members:
            entity: { class: App\Entity\Member, property: email }

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # Claude, ChatGPT or any MCP client practises on behalf of a member: their personal key, in the address
        # (/mcp?key=…, the simplest way to add a connector) or as "Authorization: Bearer …".
        mcp:
            pattern: ^/mcp
            stateless: true
            provider: members
            custom_authenticators: [App\Security\McpKeyAuthenticator]
            entry_point: App\Security\McpKeyAuthenticator
        main:
            lazy: true
            provider: members
            form_login:
                login_path: login
                check_path: login
                default_target_path: home
                enable_csrf: true
            # The call links handed out over MCP sign the member in: signed (a changed email or password voids them),
            # short-lived, usable a few times.
            login_link:
                check_route: login_link_check
                signature_properties: [id, email, password]
                lifetime: !php/const App\Mcp\CallLinks::LIFETIME
                max_uses: !php/const App\Mcp\CallLinks::MAX_USES
                used_link_cache: cache.app
            logout:
                path: logout
                target: login
                # The sign-out links carry a token: another site cannot sign a member out.
                enable_csrf: true
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                name: PRACTICALL_REMEMBERME

    access_control:
        - { path: ^/(login|welcome|join)(/|$), roles: PUBLIC_ACCESS }
        - { path: ^/mcp, roles: ROLE_USER }
        - { path: ^/(team|settings)(/|$), roles: ROLE_MANAGER }
        - { path: ^/, roles: ROLE_USER }

    role_hierarchy:
        ROLE_MANAGER: ROLE_USER

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
