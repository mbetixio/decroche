# yaml-language-server: $schema=../vendor/dependency-injection/Loader/schema/services.schema.json
parameters:
    # edge-tts, which synthesizes Edge's neural voices (EDGE_TTS for another path).
    edge_tts_default: '%kernel.project_dir%/var/edge-tts/bin/edge-tts'
    # Lines already said, kept as MP3 (VOICES_DIR for another directory, a Docker volume for instance).
    voices_dir: '%kernel.project_dir%/var/voices'
    # Sessions in production (SESSION_SAVE_PATH for another directory).
    sessions_dir: '%kernel.project_dir%/var/sessions/%kernel.environment%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/Model/'
            - '../src/Kernel.php'


when@test:
    services:
        # Tests never reach the network: a scripted language model, and no voice synthesis.
        ai.platform.generic.decroche:
            class: Symfony\AI\Platform\Platform
            factory: ['App\Tests\Fake\ScriptedModel', 'platform']
            # The dispatcher carries Symfony AI's structured output subscriber, as on the real platform.
            arguments: ['@event_dispatcher']
        App\Voice\SpeechSynthesizer:
            class: App\Tests\Fake\SilentSynthesizer

# SQLite leaves foreign keys unchecked unless asked: the mapping's ON DELETE CASCADE / SET NULL then apply. Not in tests,
# where it slows every request about tenfold (the schema is rebuilt for each test).
when@dev:
    services:
        Doctrine\DBAL\Driver\AbstractSQLiteDriver\Middleware\EnableForeignKeys:
            tags: [doctrine.middleware]

when@prod:
    services:
        Doctrine\DBAL\Driver\AbstractSQLiteDriver\Middleware\EnableForeignKeys:
            tags: [doctrine.middleware]
