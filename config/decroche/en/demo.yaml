# The example company (Etixio, an offshore software and AI company): its offer sheet, typical clients and call
# situations. The onboarding can load it to try Décroche without analysing a website.
name: Etixio
website: 'https://etixio.com'
about: "Etixio develops software and integrates AI for its clients, with French-speaking offshore teams in Madagascar, Mauritius and Vietnam."
offer: |-
  Etixio (site etixio.com, addresses in @etixio.com): a French company (headquartered in the Paris region, in Meudon) for
  software development and AI integration, offshore. About 170 developers across three countries, supervised by
  technical leads and a CTO: around a hundred in Madagascar (Antananarivo, UTC+3: +2 h from Paris in winter, +1 h in summer;
  French-speaking), about forty in Mauritius (UTC+4: +3 h in winter, +2 h in summer; fluent French and English,
  useful for bilingual projects, Belgium, Switzerland, Canada) and about thirty in Vietnam (office in
  Ho Chi Minh City, UTC+7: +6 h in winter, +5 h in summer; part of the sales team also works there). A
  single team can be spread across several sites. Founders: Julien Goumet (CEO) and Mathieu Bernard (CTO), who
  previously grew Bocasay to more than 170 people; 15 years of outsourcing, more than 50 teams built.
  Sales director: Marc Giraud Sauveur (France and Canada).

  The offers:
  - Dedicated team (staff augmentation, technical assistance): developers who join the client's team remotely, on an
    ongoing basis; the client sees the profiles, runs the interviews and approves each arrival; a monthly cost per person;
    team adjustable according to the phases. Typical teams of 5 to 11 people, stable.
  - Project on a time-and-materials basis: an objective, an initial scope, an Etixio lead (project manager or technical lead),
    billed by time spent; for projects of more than three months whose scope evolves.
  - Fixed price: short and stable scope, firm price, milestones and acceptance criteria, from a few weeks to about three
    months; any change goes through an impact analysis. A scoping or prototype fixed-price engagement can precede a
    time-and-materials project.
  - Offshore IT staffing: targeted reinforcement (developer, technical lead, QA, DevOps, Product Owner, Scrum Master,
    UX/UI) for a defined duration.
  - Application maintenance and support (TMA), on a time-and-materials basis or as a maintenance fixed price.
  - Technical audit: flash, full, or audit and implementation; from a few days to a few weeks; mapping,
    reasoned diagnosis, prioritized remediation plan (this is not a penetration test or a load test).
  - CTO as a Service (part-time CTO): 1 to 4 days per week, in full or half days (a few days per
    month for a team that is already autonomous); 6-12 month technical roadmap, architecture decisions, technical debt reduction plan,
    standards and tests; useful during a recruitment, a takeover, a fundraising or a due diligence.
  - AI: business assistants and agents, document search (RAG), document extraction, AI features in a
    product, integration with ERP, CRM or Microsoft 365; taking an AI POC to production
    (authentication, permissions, monitoring, costs); model evaluation and cost tracking; free AI diagnostic.
  - Taking over existing applications, including those built with "vibe coding" using Lovable or Bolt.
  Technologies: PHP/Symfony/Laravel, Java/Spring Boot, .NET/C#, Python, Node.js/NestJS, React/Next.js, Angular,
  Vue.js, Flutter, React Native, Odoo, PostgreSQL, MySQL, Docker, Kubernetes; OpenAI, Claude, Gemini, Mistral,
  LangChain.

  The framework: typically starting in 4 to 8 weeks; no public pricing (the price depends on the seniority of the profiles, the
  technologies, the format and the duration; the offshore order of magnitude: about €200 a day per developer, that is
  €4,000 to €5,000 a month depending on the profile, well below a French IT services firm or freelancer; a price catalogue is sent within 24 business hours on request, followed by a
  call); first step: a 30-minute video call with the CTO, free and with no commitment, followed by a written
  summary with a ballpark figure. The code, repositories, access and documentation belong to the client, who can
  take back control at any time; NDA possible; GDPR governed by contract (standard contractual clauses for
  transfers outside the EU), named access by role, separate environments, data anonymized as much as possible;
  systematic code review, automated tests, continuous integration, living documentation; visible work
  (regular demos, written alerts on schedule risks); continuity ensured (redundant cloud, connections and
  workstations, backup power, relay between sites); if a developer leaves:
  documentation, supervised handover, organized replacement. Working language: French (English from Mauritius and Vietnam).
  References: 7 sectors (healthcare, finance, industry, training, telecoms, real estate, services), for example Gorilla
  eSIM (web, mobile and affiliate platform, team of five), an AI agent for summarizing patient records for an
  anesthesia team, a large Malagasy bank, a SaaS compliance vendor, an e-learning platform in Symfony.

  What Etixio does not offer, or what nothing guarantees: no nearshore (Morocco, Tunisia…), no developers in
  France, no start within a few days, no free trial period or guaranteed free replacement, no
  public day rate, no quantified SLA or announced ISO 27001 certification, no penetration testing in
  the audit.

  The classic objections to offshore: "the quality isn't there", "we've already been burned by India
  or low-cost offshore", "communication and the time difference", "developer turnover",
  "security and GDPR outside the EU", "ownership of the code", "juniors billed as seniors",
  "I want to be able to talk to them directly", "my internal teams will see it as a threat", "a freelancer
  or nearshore in Morocco costs less or is closer", "the stability of the country (Madagascar)",
  "I can't wait 4 to 8 weeks".
sectors:
  - 'logistics and transport'
  - e-commerce
  - insurance
  - 'banking and fintech'
  - 'healthcare and e-health'
  - industry
  - 'SaaS software vendor'
  - real estate
  - energy
  - 'food and beverage'
  - 'tourism and travel'
  - 'training and edtech'
  - 'local government'
  - retail
  - media
  - 'human resources and payroll'
  - construction
  - automotive
  - luxury
  - 'nonprofits and mutual insurers'
situations:
  job_ad_spotted:
    label: 'Job posting spotted'
    emoji: 📰
    family: prospecting
    direction: outgoing
    material: "The job posting"
    pitch: "The salesperson has spotted a job posting (senior developer, lead dev, DevOps, data…) published for weeks by a company, and cold-calls them to offer offshore reinforcement (staffing or a dedicated team in Madagascar or Mauritius). The material is the text of the posting. The persona picks up without expecting the call: recruiter, CTO, or a switchboard that blocks the way. They want a permanent in-house hire, are wary of offshore, but the position is impossible to fill and a project is falling behind."
    objectives:
      - 'Reach the person who owns the need'
      - "Surface the need behind the posting"
      - "Get the 30-minute video call with Etixio's CTO"
  price_request:
    label: 'Pricing request on the website'
    emoji: 💬
    family: prospecting
    direction: outgoing
    material: 'The message received via the form'
    pitch: "A prospect requested the price catalogue on Etixio's website (often in a few lines: \"how much for two React developers?\"). The catalogue was emailed to them, and the salesperson calls as planned. The persona is comparing several providers (a French IT services firm, freelancers, nearshore), wants a number and a timeline, and their real need is different from what they wrote."
    objectives:
      - 'Qualify the need before talking price'
      - 'Identify the budget, the decision-maker and the timeline'
      - 'Get the 30-minute video call with the CTO'
  vibe_coded_app:
    label: 'A "vibe-coded" app that is cracking'
    emoji: 🧩
    family: prospecting
    direction: incoming
    material: 'The message left via the website'
    pitch: "The founder of a young company built their product themselves with Lovable or Bolt (or a coding assistant). They have customers, but the app crashes, security worries them, and they don't know how to evolve it. They call Etixio after reading the page on taking over \"vibe-coded\" applications. They have little budget and their ego is on the line."
    objectives:
      - "Understand the real state of the app and the risks"
      - "Qualify the urgency and the resources"
      - 'Propose a first step (flash audit or takeover) and schedule it'
  ai_poc_stuck:
    label: 'An AI POC stuck before production'
    emoji: 🤖
    family: prospecting
    direction: outgoing
    material: "The sign-up form for the AI diagnostic"
    pitch: "A company requested Etixio's free AI diagnostic: they have a prototype (a RAG assistant on their documents, an agent, document extraction) that works in a demo but that they don't dare put into production (access rights, model costs, answer quality, sensitive data). The salesperson calls back to prepare the diagnostic."
    objectives:
      - "Surface the business challenge behind the POC"
      - 'Identify the blockers (data, security, costs, governance)'
      - 'Schedule the diagnostic with the right people'
  funding_round:
    label: 'A start-up has just raised funds'
    emoji: 🚀
    family: prospecting
    direction: outgoing
    material: "The press article"
    pitch: "The salesperson read that a start-up has just raised funds and needs to double its product team. They cold-call its founder or CTO to offer a dedicated offshore team, or even a CTO as a Service. The persona has been approached by twenty providers since the announcement and has preconceptions about offshore."
    objectives:
      - "Stand out in less than a minute"
      - 'Surface a recruitment or speed challenge'
      - 'Get the 30-minute video call with the CTO'
  new_cio:
    label: "A new CIO has just arrived"
    emoji: 🆕
    family: prospecting
    direction: outgoing
    material: "The appointment announcement"
    pitch: "A CIO or CTO has just been appointed (LinkedIn announcement). The salesperson calls them. The persona is taking stock, has inherited poorly maintained applications and technical debt, wants to show results quickly without having a provider forced on them. A technical audit or a dedicated team could help."
    objectives:
      - 'Understand their first 100 days'
      - 'Identify a priority initiative'
      - 'Get a meeting'
  gatekeeper:
    label: 'The switchboard blocks the way'
    emoji: 🚧
    family: prospecting
    direction: outgoing
    material: 'The profile of the target prospect'
    pitch: "The salesperson calls to reach the CIO, CTO or executive of a target company (a signal spotted: recruitment, growth, announced project). They get the front desk or the executive assistant, whose job is to filter out sales calls: they are friendly but firm, know the calendar and current topics, and won't put anyone through without a real reason. Trying to trick or lie to them backfires; respecting them and making them an ally opens the door. The persona is this person at the switchboard, not the decision-maker."
    objectives:
      - 'Turn the person at the switchboard into an ally'
      - 'Get the decision-maker, or a specific slot to call back'
      - 'Leave with useful information (project, timing, direct email)'
  referral:
    label: 'Call on a referral'
    emoji: 🤝
    family: prospecting
    direction: outgoing
    material: 'The message from the client who made the referral'
    pitch: "A satisfied Etixio client (they have a dedicated team in Madagascar) referred the salesperson to an acquaintance, an executive or CTO of another company. The salesperson calls them. The persona is friendly but has no immediate need, or believes they don't, and has never worked with offshore."
    objectives:
      - 'Use the referral without abusing it'
      - 'Surface a need'
      - 'Get a concrete next step'
  trade_show_follow_up:
    label: "Follow-up on a trade show contact"
    emoji: 🎪
    family: prospecting
    direction: outgoing
    material: 'The business card and the note taken at the trade show'
    pitch: "The salesperson chatted for two minutes with this contact at a trade show (VivaTech, an AI show, an e-commerce show…) and took a note. They call them back. The persona vaguely remembers them."
    objectives:
      - 'Reignite the contact'
      - 'Qualify the need mentioned at the trade show'
      - 'Get the 30-minute video call with the CTO'
  quebec:
    label: 'A Quebec SME short on developers'
    emoji: 🍁
    family: prospecting
    direction: outgoing
    material: 'The prospect profile'
    pitch: "A company in Quebec (or Belgium, Switzerland) is struggling to recruit developers. The salesperson calls them to offer a French-speaking, bilingual team from Mauritius. The time difference is greater than with France, the persona is worried about it, as well as about billing and applicable law."
    objectives:
      - 'Surface the cost of the shortage'
      - 'Address the time difference question'
      - 'Get a meeting'
  maintenance_contract:
    label: 'A business application with no maintainer'
    emoji: 🛠️
    family: prospecting
    direction: incoming
    material: 'The email received'
    pitch: "A company calls Etixio: their business application (Symfony, .NET, Odoo…) no longer has a maintainer (the provider closed, the freelancer left), and fixes are piling up. The obvious need is application maintenance; the persona first wants a fixed price to \"just fix the bugs\"."
    objectives:
      - "Understand the state of the application and the risks"
      - 'Explain the choice between a maintenance fixed price and time-and-materials'
      - "Get agreement for a flash audit or a proposal"
  cto_leaving:
    label: 'SME without technical leadership'
    emoji: 🧭
    family: prospecting
    direction: incoming
    material: 'The message left at the switchboard'
    pitch: "The executive of an SME calls Etixio back: their CTO or only developer has just left, or their agency no longer responds, and they have no one technical left. They are worried and not very technical. The relevant offer is a CTO as a Service (1 to 4 days per week, or a few days per month), possibly followed by a team."
    objectives:
      - "Reassure and understand the urgency"
      - "Qualify the resources and the challenge"
      - 'Propose a concrete first engagement'
  due_diligence:
    label: 'A fund requests a technical audit'
    emoji: 🔍
    family: prospecting
    direction: incoming
    material: "The email from the investment fund"
    pitch: "A partner at an investment fund contacts Etixio: they want a technical audit of the company they are about to acquire, with a tight timeline. They want a price and a date; the real issues (what they fear, confidentiality, the post-acquisition period where a CTO as a Service would help) are to be discovered. The Etixio audit does not include penetration testing."
    objectives:
      - 'Frame the scope and the timeline'
      - 'Understand what the fund fears'
      - "Get agreement for a proposal"
  burnt_by_offshore:
    label: "A prospect burned by offshore"
    emoji: 🔥
    family: negotiation
    direction: outgoing
    material: 'The notes from the first conversation'
    pitch: "During a first contact, the prospect said they had already tried offshore (in India, or a low-cost platform) and that it had been a disaster: quality, communication, turnover, juniors billed as seniors. The salesperson calls back as agreed. Part of the failure came from their own framing."
    objectives:
      - 'Get them to tell what failed'
      - "Answer the fears with Etixio's real commitments"
      - 'Get the 30-minute video call with the CTO'
  nearshore_competitor:
    label: 'The prospect is comparing with cheaper or closer'
    emoji: ⚖️
    family: negotiation
    direction: outgoing
    material: 'The notes from the last conversation'
    pitch: "After a first meeting, the prospect announces they have a cheaper or closer offer: freelancers, nearshore in Morocco or Tunisia, or a French IT services firm with developers on site. The salesperson calls back. The prospect has doubts about the other offer that they are not voicing."
    objectives:
      - 'Understand the selection criteria'
      - "Surface the risks of the other offer without badmouthing it"
      - 'Stay in the running with a next step'
  fixed_price_or_time:
    label: 'They want a firm price for a vague project'
    emoji: 📐
    family: negotiation
    direction: outgoing
    material: 'The specifications received'
    pitch: 'The prospect sent vague specifications for a platform that will take a year, and demands a firm fixed price. The right setup at Etixio is a scoping or prototype fixed price, then a time-and-materials project. The persona is afraid of signing a blank check.'
    objectives:
      - 'Surface what is vague in the need'
      - 'Get them to accept scoping before pricing'
      - "Get agreement on the next step"
  developers_by_monday:
    label: 'They need developers next week'
    emoji: ⏱️
    family: negotiation
    direction: incoming
    material: 'The message received'
    pitch: "A prospect calls in a panic: they need three developers \"by Monday\" to meet a deadline. Etixio typically starts in 4 to 8 weeks (the client sees and approves the profiles). The salesperson must be honest about the timeline without losing the deal, and find what can be done right away."
    objectives:
      - "Understand the real deadline and what depends on it"
      - 'Be honest about the start timeline'
      - 'Find a next step that serves the prospect'
  unhappy_client:
    label: 'Unhappy client'
    emoji: 😤
    family: client
    direction: incoming
    material: "The client's email and the state of the project"
    pitch: "An Etixio client (a dedicated team has been working for them in Madagascar or Mauritius for months) calls, angry: delivery delay, production bug, developer leaving, slow responses because of the time difference, disputed invoice… The material is their email and a note on the state of the project. Part of the problem may come from their side."
    objectives:
      - 'Defuse the anger without making excuses'
      - 'Understand the real problem'
      - "Get agreement on a concrete action plan"
  key_developer_leaving:
    label: "The team's key developer is leaving"
    emoji: 👋
    family: client
    direction: incoming
    material: "The client's email"
    pitch: "A client learns that the most involved developer in their dedicated Etixio team is leaving the company. They call, worried about continuity and annoyed (\"this is exactly what we feared with offshore\"). Etixio responds with documentation, a supervised handover and an organized replacement, with no guaranteed free replacement."
    objectives:
      - 'Reassure with a concrete handover plan'
      - 'Understand what is really worrying the client'
      - 'Keep their trust and set up the next step'
  project_check_in:
    label: 'Project follow-up call'
    emoji: 📋
    family: client
    direction: outgoing
    material: 'The project sheet'
    pitch: "The salesperson calls a client for a follow-up check-in: \"is everything going well?\". The client first answers that everything is fine, but there is an unspoken irritant (communication, time difference, quality, a developer, speed, billing) that could make them leave."
    objectives:
      - 'Surface the unspoken irritants'
      - 'Measure real satisfaction'
      - "Agree on a corrective action"
  new_needs_check_in:
    label: 'Account follow-up: any new needs?'
    emoji: 🌱
    family: client
    direction: outgoing
    material: 'The client sheet'
    pitch: 'The salesperson calls a satisfied client (dedicated team, application maintenance or completed fixed-price project) to check in and detect new needs. The client does not think of Etixio for their other topics (an AI agent, a POC to industrialize, an audit, a CTO leaving, another product team…), but an opportunity exists if the right questions are asked.'
    objectives:
      - 'Detect a new need'
      - 'Identify who owns that need'
      - 'Get a meeting on that topic'
  client_wants_to_stop:
    label: 'The client wants to reduce or stop'
    emoji: 🚪
    family: client
    direction: incoming
    material: "The client's announcement email"
    pitch: "A client announces they want to reduce their dedicated team or stop (budget, internalization, change of strategy, AI that would \"replace developers\"). The real reason is sometimes different, and an acceptable alternative exists for both sides (reduced team, application maintenance, CTO as a Service)."
    objectives:
      - 'Understand the real reason'
      - 'Propose an alternative'
      - 'Keep the relationship and a door open'
  quote_follow_up:
    label: "Follow-up on an unanswered proposal"
    emoji: ⏳
    family: negotiation
    direction: outgoing
    material: 'The proposal sent'
    pitch: "A proposal (dedicated team, time-and-materials project, CTO as a Service) was sent three weeks ago after the video call with the CTO, with no news since. The salesperson follows up. The silence has a hidden reason: a competitor, a frozen budget, a decision-maker who has changed, an unexpressed fear about offshore."
    objectives:
      - 'Understand the reason for the silence'
      - "Address the real objection"
      - 'Get a decision date'
  renewal_discount:
    label: 'Renewal with a discount request'
    emoji: 🔁
    family: negotiation
    direction: incoming
    material: 'The current contract'
    pitch: "A client's dedicated team is reaching the end of its term. Procurement or finance calls: they want a significant discount, otherwise they will look elsewhere (nearshore, another offshore provider). They have real room to negotiate and reasons to stay (the team knows the product)."
    objectives:
      - 'Defend the value before talking price'
      - "Grant no concession without something in return"
      - 'Secure the renewal'
