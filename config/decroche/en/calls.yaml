      -
        speaker: persona
        text: "Well, it's really François, our CTO, who has the final word — Isabelle from finance just gives it a quick sanity check on the numbers. For François it's all about the technical fit and whether he trusts the team. So what would help is a clear picture of who exactly would be working with us, and honestly a reference in our world — industrial, manufacturing — would go a long way with him."
        second: 129
