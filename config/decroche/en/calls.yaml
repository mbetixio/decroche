    lines:
      -
        speaker: seller
        text: 'Hi Micheline, this is Alex Morgan from Etixio. I saw your request for two senior React developers and wanted to understand your project better to ensure we match the right talent.'
        second: 3
        voice_ms: 12523
      -
        speaker: persona
        text: "Right, thanks for calling back so quickly. I did ask for your catalogue — I'm comparing a few providers at the moment, so rates and timelines are what I'm after first."
        second: 3
      -
        speaker: seller
        text: 'Absolutely, Micheline—could you share a bit about the portal’s core features, expected launch date, and who will be involved in the technical decisions so we can align the right senior React talent for you?'
        second: 29
        voice_ms: 13677
      -
        speaker: persona
        text: "The portal is customer-facing, that's really all I'll say for now — what matters to me is how fast you can put people in place and what it costs. And I'll be honest, I've been burned before with offshore teams, so I'm cautious."
        second: 29
      -
        speaker: seller
        text: 'I understand the hesitation, Micheline—may I ask what timeline you’re targeting for the portal launch and what budget range you’ve allocated for senior React resources? Then we can schedule a quick 30‑minute video with our CTO next Tuesday at 10 am CET to discuss a tailored solution.'
        second: 60
        voice_ms: 18292
      -
        speaker: persona
        text: "Look, I have somewhere between ninety and a hundred and twenty thousand euros for a six-month engagement. That's a hard ceiling. And it's not just two React devs I need, honestly — the real problem is my backend team can't keep up with the UI work, so I'm thinking a small team."
        second: 60
      -
        speaker: seller
        text: 'Got it, Micheline—so besides two senior React devs, would you need a backend lead, QA, or DevOps to balance the team, and can we lock in Tuesday at 10 am CET for a quick CTO video?'
        second: 98
        voice_ms: 14062
      -
        speaker: persona
        text: "Now you're asking the right question. Two React, one backend, and someone on QA — that would actually finish the MVP and let me hand it over clean. Tuesday, let me check my calendar."
        second: 98
      -
        speaker: seller
        text: 'Great, Micheline—does 10 am CET next Tuesday work for you, or would 2 pm be better? I’ll send a calendar invite and a brief agenda so we can dive straight into your team needs.'
        second: 126
        voice_ms: 12908
      -
        speaker: persona
        text: "Give me a second, I'm looking at Tuesday. Tuesday at ten doesn't work, I've got the budget review with Finance then. Two in the afternoon is fine though — that slot's free."
        second: 126
      -
        speaker: seller
        text: 'Perfect, Micheline—let’s lock in Tuesday at 2 pm CET. I’ll email you a calendar invite with a brief agenda and the CTO’s link. Looking forward to tailoring the right team for you.'
        second: 152
        voice_ms: 12138
      -
        speaker: persona
        text: "Good. Before I go though — one thing nags me. Madagascar, is that where your people would be? Because the time gap is my worry, and I want to be straight with you, I've had bad experiences with low-cost teams before."
        second: 152
      -
        speaker: seller
        text: 'Absolutely, Micheline—our developers are based in Madagascar and Mauritius, operating only one to three hours ahead of Paris, with dedicated tech leads ensuring seamless communication and quality, so you’ll have full control.'
        second: 181
        voice_ms: 12908
      -
        speaker: persona
        text: "Fair enough — one to three hours is workable, I'll give you that. The quality and the turnover, that's what I'll want proof of. My CFO signs the cheque, so I need something solid to put in front of him."
        second: 181
      -
        speaker: seller
        text: "Great, Micheline—I'll send the calendar invite for Tuesday at 2 pm CET, plus a short packet with case studies, client references, and our NDA so your CFO can review before our call."
        second: 210
        voice_ms: 12138
      -
        speaker: persona
        text: 'Alright, Tuesday at two it is. Let me put it in.'
        second: 210
      -
        speaker: seller
        text: 'Thanks, Micheline. I’ve just sent the invite and materials—please let me know if you need anything else before Tuesday. Have a great day, and I look forward to speaking soon.'
        second: 228
        voice_ms: 12138
      -
        speaker: persona
        text: "One more thing before you go — the decision needs to land within three weeks, we're aiming for a go-live in early March. So whatever you bring Tuesday, bring numbers, not slides. Right, I'll let you get on."
        second: 228
