    lines:
      -
        speaker: seller
        text: "Hi, it's Alex from Etixio, we build dedicated development teams. Did you have a minute?"
        second: 0
        voice_ms: 5915
      -
        speaker: persona
        text: 'Look, the checkout module is still down, orders are failing, one of your senior devs is quitting tomorrow, and we’ve been waiting three days for a response to the bug ticket. On top of that, the latest invoice shows overtime charges we never approved. What concrete plan do you have to fix this right now?'
        second: 1
      -
        speaker: seller
        text: 'We have very good developers in Madagascar and Mauritius, and we are cheaper than agencies in Paris.'
        second: 1
        voice_ms: 6500
      -
        speaker: persona
        text: 'We’ve set aside €150 000 for the dedicated team over the next three months, and I’m demanding a €10 000 reduction on the disputed invoice, plus no future overtime charges. Can you commit to putting a senior replacement on the project by tomorrow and assigning a French‑speaking project manager who will give us daily updates?'
        second: 5
      -
        speaker: seller
        text: 'What is your current situation with your developers?'
        second: 5
        voice_ms: 4340
      -
        speaker: persona
        text: 'Right now we have a six‑person team in Antananarivo – four seniors and two juniors – working on the checkout overhaul. Since last week a critical bug is crashing orders, and we’ve been waiting three days for any response. To make matters worse, one of the senior developers announced he’s leaving tomorrow, so we’re losing a key piece of expertise right when we need it most. The time‑zone lag is slowing everything down, and with the holiday collection launch on December 1 we can’t afford any more delays. Can you put a senior replacement in place by tomorrow and give us a French‑speaking project manager who will provide daily status updates?'
        second: 7
      -
        speaker: seller
        text: 'OK. I can send you our brochure and a price list by email.'
        second: 7
        voice_ms: 4610
      -
        speaker: persona
        text: 'A brochure and a price list won’t help us right now – we need a concrete action plan. When can you have a new senior developer onboarded, and who will be the French‑speaking project manager responsible for daily updates? Keep in mind our CFO, Sophie Lambert, will make a final decision by the 24th of November, so we need this resolved immediately.'
        second: 8
    ended_by: seller
    seconds: 8
    revealed:
      - budget
      - pain
      - decision
    score: 13
    debrief:
      criteria:
        discovery:
          label: 'Needs discovery'
          score: 2
          comment: 'The client volunteered the whole situation (bug, departure, three-day silence, disputed invoice, €150k, decision by 24 Nov) and the seller''s only open question, "What is your current situation with your developers?", came after the client had already laid it all out.'
        questions:
          label: 'Open questions'
          score: 2
          comment: 'Two questions in the whole call, one open and one late; nothing on the root cause of the bug, the ticket process, the invoicing discrepancy, or who decides.'
        listening:
          label: 'Listening and rephrasing'
          score: 1
          comment: 'The client asked the same question three times (senior replacement by tomorrow, French-speaking PM with daily updates) and never got an answer; the seller replied with a brochure instead of rephrasing what he had just heard.'
        objections:
          label: 'Handling objections'
          score: 1
          comment: 'The three objections (lost confidence in offshore quality, unpredictable communication due to the time zone, unapproved invoice charges) were neither acknowledged nor dug into; the answer was "we are cheaper than agencies in Paris", which is the exact opposite of what a burned client needs to hear.'
        value:
          label: 'Value proposition'
          score: 1
          comment: 'No use of the real offer: no mention of the supervised handover and organized replacement, no French-speaking lead (Madagascar is French-speaking), no visible-work/demo/written-alert mechanism, no CTO call; instead a brochure and a price list, which the offer only sends on request.'
        closing:
          label: 'Closing / next step'
          score: 0
          comment: 'No next step proposed, no date, no booking; the seller ended the call himself while the client was still asking when the replacement would be onboarded.'
      summary: 'A one-minute escalation call in which the client handed over the entire brief — bug, departing senior dev, three-day ticket silence, disputed overtime, €150k budget, CFO decision on 24 November — and the seller answered with a company pitch, a price comparison and a brochure. Nothing was acknowledged, nothing was committed, no next step was set: the client is now more likely to test the Portugal alternative than to stay.'
      next_step: false
      outcome: 'The deal is at high risk: the client still wants a solution but has received no plan, no date and no owner, and the 24 November decision deadline is now the only clock running.'
      result: 'Escalation call wasted: complaint heard, no plan given, no next step booked'
      objectives:
        -
          objective: 'Defuse the anger without making excuses, acknowledging the impact on their business.'
          status: missed
          evidence: 'The client opened with "nous avons un gros problème" and the seller answered with "Hi, it''s Alex from Etixio, we build dedicated development teams. Did you have a minute?" — no acknowledgement of the failing orders or the December 1 launch.'
        -
          objective: 'Understand the real problem, including technical, communication, and billing issues.'
          status: partial
          evidence: 'The seller asked "What is your current situation with your developers?" and the client listed the bug, the departure, the time-zone lag and the launch date — but the seller never explored the invoicing dispute or the three-day ticket silence.'
        -
          objective: 'Get agreement on a concrete action plan (developer replacement, dedicated project manager, invoice correction) and schedule a follow‑up meeting with the CTO.'
          status: missed
          evidence: 'The client asked three times for a senior replacement and a French-speaking PM with daily updates; the seller answered "OK. I can send you our brochure and a price list by email." No plan, no CTO call, no date.'
      goal: partial
      missed:
        -
          section: secret
          what: 'Maison Élégance is already evaluating a near-shore partner in Portugal, cheaper and closer, under cost-cutting pressure from leadership.'
          how: '"Beyond this incident, what would make you reconsider the whole setup — is anyone internally pushing for a different sourcing model?"'
        -
          section: 'yes'
          what: 'The four conditions that would make Alexandre say yes: immediate senior replacement, French-speaking PM, 10% off the disputed invoice, revised milestone plan guaranteeing the 30 November checkout launch.'
          how: '"If we get this right, what exactly would you need to see in the next two weeks to keep us on the project?"'
        -
          section: objections
          what: 'The depth of the confidence loss on offshore quality and the exact nature of the unapproved overtime charges.'
          how: '"On the invoice, which lines exactly are disputed — the hours, the rate, or the approval process?"'
      best:
        -
          quote: 'What is your current situation with your developers?'
          why: 'The only open question of the call: it let the client lay out the team composition, the bug, the departure and the launch constraint in his own words.'
      worst:
        -
          quote: 'We have very good developers in Madagascar and Mauritius, and we are cheaper than agencies in Paris.'
          why: "On an escalation call, answering a confidence crisis with a price argument confirms the client's fear that he bought low-cost offshore; it also ignores the bug, the departure and the invoice."
          better: "\"I hear you — orders failing and a senior leaving three weeks before your launch is not acceptable. Let me take the three points one by one: the bug, the replacement, the invoice. On the replacement, our commitment is documentation, a supervised handover and an organized replacement — I'll come back to you with named profiles and a date, not 'tomorrow' that I can't guarantee.\""
        -
          quote: 'OK. I can send you our brochure and a price list by email.'
          why: 'Catalogue push on a client who has already bought and is asking for a remediation plan; the offer sends a price catalogue only on request, and it answers none of the three questions asked.'
          better: '"No brochure — you don''t need one. Here is what I propose: I open a remediation plan today with a French-speaking lead as your single point of contact and daily written updates, I get the invoice lines verified internally and come back with a position, and I book a 30-minute call with our CTO this week so you have a written summary and a revised milestone plan before your 24 November decision."'
      tips:
        - 'Open every escalation call with an excuse-free acknowledgement of the impact before any company pitch: name the failing orders, the December 1 launch and the three-day silence, then ask "what has this cost you so far?" — the client gave you the pain, the budget and the decision in one minute, you only had to take them.'
        - 'Answer the client''s question before asking yours: on the replacement, commit only to what the offer allows (documentation, supervised handover, organized replacement, named profiles with a date), and on the French-speaking PM say yes — Madagascar is French-speaking and a T&M lead is in the offer; never promise "by tomorrow", which the offer explicitly excludes.'
        - "Never leave an escalation call without a dated next step: book the free 30-minute CTO video call before hanging up, with a written summary and a revised milestone plan, and take the invoice dispute internally (no discount promised on the spot) with a named owner and a date — the client's CFO decides on 24 November, so the calendar is your closing tool."
