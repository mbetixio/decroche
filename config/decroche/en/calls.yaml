      goal: missed
      missed:
        -
          section: pain
          what: 'The engineering team is drowning in manual fault-log analysis, causing longer downtimes, and there is no roadmap to turn sensor data into predictive insights.'
          how: "'You mentioned the IoT sensors on the CNCs — what's happening today with the fault logs, and where does it hurt most?'"
        -
          section: budget
          what: '€80k earmarked for a six-month AI POC plus €30k for a short technical audit, total under €100k for the fiscal year.'
          how: "'If we scoped a six-month AI POC, what envelope have you set aside for this fiscal year?'"
        -
          section: decision
          what: 'Pierre Léger (CEO) gives final approval, Claire drives the specs, decision in four weeks to start before the March 2027 production cycle.'
          how: "'Who signs off on a project like this, and what timeline are you working with before the next production cycle?'"
        -
          section: secret
          what: 'A €200k end-to-end predictive-maintenance RFP is coming, and Etixio could win the whole thing by positioning on AI plus interim CTO-as-a-Service.'
          how: "'Beyond the POC, is this part of a broader predictive-maintenance programme we should be positioning for?'"
      best:
        -
          quote: 'Hello, I am calling from Etixio about our offshore teams.'
          why: 'It at least identifies the caller and the company, which is the minimum for a cold opening line.'
      worst:
        -
          quote: 'We are the best on the market, really, and we are cheap.'
          why: "Unsubstantiated superlative plus price-led positioning, and it lands exactly on the client's stated fear about offshore quality — it makes the objection worse instead of answering it."
          better: 'On quality: every delivery goes through systematic code review, automated tests and continuous integration, the code and repositories belong to you, and you can take back control at any time. On cost, the price depends on the seniority and format — I can send you a catalogue within 24 business hours.'
        -
          quote: 'So, do you want a quote?'
          why: "The only question of the call, closed, asked before any discovery, and it ignores the client's quality question and her request for a free AI diagnostic."
          better: "Before any quote — you mentioned the IoT sensors on the CNCs and the CTO transition. Can you tell me what's happening with the fault logs today, and what you'd want to have in place before the next production cycle?"
      tips:
        - "Open every follow-up by naming the existing relationship (dedicated team since March 2024, TMA renewed July 2025) and ask one open question about what has changed — here, 'what's happening with the IoT sensors on the CNCs?' would have opened the whole call."
        - "When the client raises quality, GDPR or ramp-up, answer with Etixio's documented facts before anything else: code review, automated tests, CI, client-owned code and repos, GDPR governed by contract with SCCs, named role access, separate environments, start in 4 to 8 weeks — never 'we are cheap'."
        - 'Close every call with a dated next step you propose yourself: the free AI diagnostic plus the 30-minute video call with the CTO, free and no commitment, followed by a written summary with a ballpark figure — and lock the slot before hanging up.'
