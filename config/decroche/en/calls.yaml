        text: 'We were actually referred by Julien Goumet – he mentioned you’d done some solid work on a banking platform and thought you might be a good fit for us. We’re in the middle of rolling out a new e‑learning platform for the autumn semester and need to accelerate the backend, especially an AI‑driven assessment scoring module that our two‑person team can’t get ready in time. How do you typically structure a team to handle a focused, time‑critical backend piece?'
        second: 13
