    lines:
      -
        speaker: seller
        text: "Hi, it's Alex from Etixio, we build dedicated development teams. Did you have a minute?"
        second: 0
        voice_ms: 5915
      -
        speaker: persona
        text: 'Sure, Alex, I’ve got a few minutes between sprint planning and getting my crew ready for the weekend sail – what’s on your mind?'
        second: 1
      -
        speaker: seller
        text: 'We have very good developers in Madagascar and Mauritius, and we are cheaper than agencies in Paris.'
        second: 1
        voice_ms: 6500
      -
        speaker: persona
        text: 'I appreciate the cost angle, but we’re really tight on senior PHP/Symfony expertise right now – our launch depends on it. My main worry is whether the offshore team can consistently deliver that level of quality and stay in sync with our schedule. Do you have a senior‑senior guarantee and a clear plan if any staff changes?'
        second: 3
      -
        speaker: seller
        text: 'What is your current situation with your developers?'
        second: 3
        voice_ms: 4340
      -
        speaker: persona
        text: 'We’ve got a solid product team, but right now the backend side is stretched thin – the two senior Symfony engineers we have are both juggling the upcoming AI‑driven search feature and a few hotfixes for the launch. It’s a bit of a bottleneck, and we’re looking for a senior‑level developer who can hit the ground running without a long ramp‑up.'
        second: 4
      -
        speaker: seller
        text: 'OK. I can send you our brochure and a price list by email.'
        second: 4
        voice_ms: 4610
      -
        speaker: persona
        text: 'Sounds good, Alex – feel free to send the brochure over. Just to make sure we’re aligned, could you tell me how you handle staff turnover and whether you can guarantee a senior‑senior developer on the team, ideally with a little discount on the first month to help us get off the ground?'
        second: 6
    ended_by: seller
    seconds: 6
    revealed:
      - pain
      - objections
      - 'yes'
    score: 9
    debrief:
      criteria:
        discovery:
          label: 'Needs discovery'
          score: 2
          comment: 'One generic question ("What is your current situation with your developers?") surfaced the senior Symfony bottleneck, but budget, decision process, timeline and the competing offshore offer were never explored.'
        questions:
          label: 'Open questions'
          score: 2
          comment: 'Only two questions in the whole call, one open and one generic; nothing on the frozen budget, the CEO/CFO sign-off, the Q1 2027 horizon or the competitor.'
        listening:
          label: 'Listening and rephrasing'
          score: 2
          comment: 'The seller let Claire talk (20% talk share) but never rephrased and never picked up the two explicit asks she made in the same breath as his brochure line.'
        objections:
          label: 'Handling objections'
          score: 1
          comment: "The quality/communication objection and the turnover/senior-guarantee question were both left unanswered, and the cheaper 'closer' competitor was never surfaced or addressed."
        value:
          label: 'Value proposition'
          score: 1
          comment: 'Pitched on cost alone ("cheaper than agencies in Paris") and offered a brochure and a price list instead of the offer''s real arguments: client interviews and approves each profile, documented handover and organized replacement, French-speaking Madagascar, bilingual Mauritius.'
        closing:
          label: 'Closing / next step'
          score: 0
          comment: "No next step proposed, no date, no meeting booked; the seller ended the call on a brochure promise and ignored Claire's direct questions."
      summary: "A short follow-up call on a proposal that had been silent for three weeks, where the seller opened on a generic cost pitch, asked one useful question, then answered Claire's two direct asks with a brochure and a price list. Nothing was discovered about budget, decision or competition, no objection was handled, and the call ended with no next step. Junior level, and the same pattern flagged in the previous debrief."
      next_step: false
      outcome: 'The deal is stalled exactly where it was three weeks ago: Claire is still waiting for answers on senior-level guarantee, turnover and first-month terms, and no meeting or decision date exists.'
      result: 'Unanswered proposal stays unanswered: brochure promised, no next step'
      objectives:
        -
          objective: 'Identify the real reason for the lack of response'
          status: missed
          evidence: "The seller never asked why the proposal had gone silent; the frozen budget, the CEO's departure and the CFO's hold on external spend were never mentioned or discovered."
        -
          objective: 'Address the prospect’s main objection(s) about offshore development'
          status: missed
          evidence: 'Claire asked twice about quality, schedule sync, turnover and a senior-senior guarantee; the seller replied "I can send you our brochure and a price list by email" and never used the offer''s handover/replacement or profile-approval arguments.'
        -
          objective: 'Obtain a firm date for a decision or next meeting'
          status: missed
          evidence: 'No meeting was booked, no date proposed; the seller ended the call after promising a brochure.'
      goal: missed
      missed:
        -
          section: budget
          what: 'The €50,000/month cap and the freeze until Q1 2027 pending board approval'
          how: '"Before I send anything, what budget envelope have you set for this, and is it already approved for this year?"'
        -
          section: decision
          what: 'Sign-off by the CEO (on maternity leave) and the new CFO, who wants a short pilot before committing'
          how: '"Who else needs to be comfortable before you can sign, and what would a first step look like for your CFO?"'
        -
          section: secret
          what: 'The CEO who championed the offshore move left two weeks ago; the interim CFO froze all new external spend and wants a price review'
          how: '"Has anything changed internally since our CTO call that I should factor in?"'
      best:
        -
          quote: 'What is your current situation with your developers?'
          why: 'The one open question of the call, and it worked: it surfaced the senior Symfony bottleneck, the AI search feature and the launch pressure.'
      worst:
        -
          quote: 'We have very good developers in Madagascar and Mauritius, and we are cheaper than agencies in Paris.'
          why: 'Opens on cost and offshore geography, exactly the two things Claire is wary of, and ignores the proposal already on her desk (dedicated team, RAG project, CTO as a Service).'
          better: '"I''m calling about the proposal we sent three weeks ago. Before anything else, what''s been blocking your side since our CTO call?"'
        -
          quote: 'OK. I can send you our brochure and a price list by email.'
          why: 'A catalogue instead of an answer, and it drops the two questions Claire asked in the same sentence; it also leaves the call with no next step.'
          better: '"On turnover: you see and interview every profile and approve each arrival, and if someone leaves we document, hand over under supervision and organize the replacement. On the first month, I can''t commit alone but I''ll put it to our CTO. Can we take 30 minutes Thursday at 10 to go through it with him?"'
      tips:
        - 'Open every follow-up by naming the proposal and asking what has blocked it since: "What''s happened on your side since our CTO call?" — that is how you find the frozen budget and the CFO hold.'
        - "Answer the objection before moving on: use the offer's real arguments — client interviews and approves each profile, documented handover and organized replacement, French-speaking Madagascar (+2h), bilingual Mauritius — and never promise a discount or a free trial yourself; take the 10% request to the CTO as a commercial lever."
        - 'Never end on "I''ll send a brochure": propose a dated slot yourself ("Thursday 10am, 30 minutes with our CTO") and lock it before hanging up; the price catalogue only goes out paired with a call.'
