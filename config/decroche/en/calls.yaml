        text: 'We have very good developers in Madagascar and Mauritius, and we are cheaper than agencies in Paris. What is your current situation with your developers?'
        second: 21
        voice_ms: 9180
      -
        speaker: persona
        text: 'Straight to it, I like that. We’re fifteen people, and honestly the dev side is stretched – we’re pushing new AI search features and the backend talent just isn’t there in-house. Sorry, but I have to ask: you sent us a proposal a while back, right? I remember something landing in my inbox.'
        second: 34
      -
        speaker: seller
        text: 'Yes, that was probably us. Could you pull up your records and tell me what projects or tickets are currently stuck because of the dev shortage?'
        second: 56
        voice_ms: 8580
      -
        speaker: persona
        text: 'Give me one second, let me have a look at my notes. Right, I’ve got it in front of me now – your proposal from the twentieth of October, after the tech call with our CTO. Nothing’s formally stuck on paper, but in practice the AI document search work is the one everybody’s waiting on, and my sprint planning keeps having to shuffle around it. Honestly, the launch is what’s eating us alive right now.'
        second: 68
      -
        speaker: seller
        text: "Understood, so the AI document search is the priority. I can send you our brochure and a price list by email, and let's set a call for Tuesday at 10am to go through it."
        second: 97
        voice_ms: 10080
      -
        speaker: persona
        text: 'Hold on, Alex – you’re skipping a few steps there. I haven’t even told you what we thought of the proposal, and you’re already booking my Tuesday. Tell me first: what would a team actually look like for us, and what does it cost?'
        second: 111
      -
        speaker: seller
        text: 'Our standard setup is a team of four or five developers plus a lead, and rates start around 25 euros an hour per developer. I can send the brochure and price list today, and we can go through the details on Tuesday at 10am.'
        second: 129
        voice_ms: 13380
      -
        speaker: persona
        text: 'Tuesday at ten I’m in our sprint planning, so that’s a no. And 25 an hour sounds lovely, but the proposal you sent had six people at seven and a half thousand a month for a senior – that’s a different world. Which one am I actually looking at?'
        second: 146
      -
        speaker: seller
        text: "You're right, the senior is around seven and a half thousand a month, that's the accurate figure. I can send you the brochure and price list today, and we can go through the details on Wednesday at 2pm."
        second: 165
        voice_ms: 12120
      -
        speaker: persona
        text: 'Wednesday at two could work, let me just check my calendar. But before we go anywhere near a call – I’ll be blunt with you, our external engineering budget is capped at fifty thousand a month, and it’s frozen until the first quarter of next year anyway, pending the board. Your proposal lands well above that. So what would you do with a budget like ours?'
        second: 181
      -
        speaker: seller
        text: 'We can scale the team down to fit that kind of budget, maybe two or three developers instead of six. I can send you the brochure and price list today, and we can go through the options on Wednesday at 2pm.'
        second: 207
        voice_ms: 12300
      -
        speaker: persona
        text: 'Fair enough, but scaling down to two or three doesn’t really solve my problem – I need senior backend, and I need it not to break the bank. Let me check Wednesday properly, one moment… yes, two o’clock is free on my side. What would we actually be talking about on that call – because I don’t want to lose an hour for another brochure?'
        second: 223
      -
        speaker: seller
