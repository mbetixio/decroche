    lines:
      -
        speaker: seller
        text: 'Hello, this is Alex Morgan from Etixio. Thanks for taking my call. Before anything else, what made you reach out to us this week?'
        second: 2
        voice_ms: 7740
      -
        speaker: persona
        text: "Ah, hello. Well, I have to admit I'm not sure I did reach out — I get a lot of calls, and I don't remember Etixio. Could you remind me what this is about?"
        second: 13
      -
        speaker: seller
        text: 'Of course, no problem at all. We work with companies on their order and ticket tracking, and I was following up on the request that came in from your side. Just so I have it right, when you look at your records today, what do your order files or support tickets actually show?'
        second: 26
        voice_ms: 16560
      -
        speaker: persona
        text: "Let me just check something before we go further — I like to know who I'm actually speaking with. Right, I see it now — there was a form filled in on our site, and a message from your side. I'm the one who screens these before anything reaches our CIO, so I'll be honest with you: I'm listening, but I'm not convinced yet. What exactly does Etixio do, and why should this matter to us?"
        second: 47
      -
        speaker: seller
        text: "Fair enough, and I appreciate the honesty. Concretely, when a customer's order or ticket gets lost in your current setup, what does that cost you — in hours of chasing, or in customers who don't come back?"
        second: 75
        voice_ms: 12300
      -
        speaker: persona
        text: "Hmm, that's a strange angle for us — we're a travel software company, our tickets aren't really the issue. Our real problem is on the product side, not support. So if that's what you're selling, I'm not sure you've got the right lead, to be honest."
        second: 91
      -
        speaker: seller
        text: "Understood, so it's the product side rather than support — that's useful. When you look at your product records today, what do your stock or order figures actually show that tells you something's off?"
        second: 110
        voice_ms: 12000
      -
        speaker: persona
        text: "I'm going to stop you there, because it feels like you're reading from a script that doesn't match us at all. We don't sell stock, we don't have orders in that sense. Let me ask you plainly: what does Etixio actually do?"
        second: 126
      -
        speaker: seller
        text: "That's a fair question, and I'll be direct: we help teams get a clear, live view of their product data so nothing slips through. Since it's the product side that's causing you trouble, who else is involved in deciding how you move forward on this, and what would they need to see?"
        second: 143
        voice_ms: 16800
      -
        speaker: persona
        text: "Alright, I'll give you a little more, since you asked properly. On something like this, our CIO Laura Benoît has the final say, but nothing gets signed before our CTO Marc Dubois has looked at the technical side and given his blessing. So whatever you'd bring, it would have to convince him first. But you still haven't told me what your company really does — and I'd rather hear that than another question."
        second: 164
      -
        speaker: seller
        text: "You're right, and I owe you a straight answer: Etixio gives product teams a live view of their data so nothing slips through. Since Marc is the one who'd need convincing on the technical side, do you have a budget or a deadline in mind for fixing it?"
        second: 194
        voice_ms: 15000
      -
        speaker: persona
        text: "We do have numbers, yes — the AI engine we're planning has about one hundred and fifty thousand euros set aside for external help, and I'd like to keep the monthly spend under thirty thousand. And the deadline is real: it has to be live for Q1 2027. But you keep circling without telling me what Etixio actually does. If you're a software company, just say so."
        second: 213
      -
        speaker: seller
        text: "Understood, and yes, we're a software company — Etixio gives product teams a live view of their data so nothing slips through. Given Marc needs to be convinced on the technical side, here's what I suggest: a thirty-minute video call with our CTO next Tuesday at ten to look at your setup, and a written estimate by Friday. Does that work for you?"
        second: 239
        voice_ms: 20760
      -
        speaker: persona
        text: "Hold on — you've just told me you're a software company, and now suddenly you have a CTO to put on a call. Are you a software editor, or do you build software for others? I don't even know which country your teams are in. Before I put anything in anyone's calendar, I need to understand what kind of outfit you are."
        second: 265
      -
        speaker: seller
        text: "That's a fair challenge, so let me be clear: we're a software editor, our teams are in Lyon and Lisbon, and our CTO would run that call himself. Let's put it in the calendar now — next Tuesday at ten, thirty minutes with him, and a written estimate by Friday."
        second: 288
        voice_ms: 15540
      -
        speaker: persona
        text: "Lyon and Lisbon — that's not what I'd heard. Honestly, I'd been told Etixio was an offshore outfit, with teams in Madagascar, Mauritius, Vietnam. So which is it? Because if you're a French editor with teams in Europe, that's one conversation; if you're offshore, that's a very different one for us."
        second: 308
      -
        speaker: seller
        text: "That's an easy one to clear up: our editor is registered in France, and the delivery teams are in Lyon and Lisbon, not Madagascar or Vietnam. If that works for you, let's lock in next Tuesday at ten for the thirty-minute call with our CTO — can you put it in your calendar now?"
        second: 330
        voice_ms: 16620
      -
        speaker: persona
        text: "Let me have a look at Tuesday before I promise anything. Ten o'clock won't work, I'm afraid — I'm in our architecture committee with Marc Dubois then, of all people. I could do noon, or two in the afternoon. But before I put a call with your CTO in the diary, I'd still like a straight answer on where your developers actually sit, because that changes everything for us on the data side."
        second: 351
    ended_by: seller
    seconds: 379
    revealed:
      - budget
      - decision
    score: 14
    debrief:
      criteria:
        discovery:
          label: 'Needs discovery'
          score: 2
          comment: "The seller never discovered the real situation: he asked about 'order and ticket tracking' and 'stock or order figures' to a travel SaaS with a legacy .NET monolith and a Q1 2027 AI engine, and only got the decision process, budget and deadline because the client volunteered them after being asked bluntly."
        questions:
          label: 'Open questions'
          score: 3
          comment: "Nine questions, seven open, but they are generic and repeated ('what do your order files or support tickets actually show?', 'what do your stock or order figures actually show?') and the budget question ('do you have a budget or a deadline in mind for fixing it?') comes before any value is established."
        listening:
          label: 'Listening and rephrasing'
          score: 2
          comment: "The client says 'we're a travel software company, our tickets aren't really the issue' and 'we don't sell stock, we don't have orders in that sense', yet the seller re-asks about stock and orders and repeats the same non-answer three times instead of building on what he was told."
        objections:
          label: 'Handling objections'
          score: 1
          comment: "The client's real objection — 'if you're offshore, that's a very different one for us' on the data side — is never addressed; the seller answers it by denying the offshore model ('our teams are in Lyon and Lisbon, not Madagascar or Vietnam'), which contradicts the offer and leaves GDPR untouched."
        value:
          label: 'Value proposition'
          score: 1
          comment: "No offer-accurate value was ever stated: the seller claims 'we're a software editor, our teams are in Lyon and Lisbon', while Etixio is an offshore development company (HQ Meudon, ~170 developers in Madagascar, Mauritius, Vietnam) — no dedicated team, no AI integration, no .NET/micro-services, no GDPR contractual framework mentioned."
        closing:
          label: 'Closing / next step'
          score: 3
          comment: "The seller did make a dated ask ('a thirty-minute video call with our CTO next Tuesday at ten... and a written estimate by Friday'), but it was built on the false Lyon-Lisbon story, the client countered with noon or two, and no meeting was booked in his calendar."
      summary: 'A ten-minute gatekeeper call where the seller never answered the one question asked four times — what Etixio actually does — and instead invented a French-editor-with-teams-in-Lyon-and-Lisbon story that contradicts the offer, while the client volunteered the decision process, the €150k budget and the Q1 2027 deadline on his own. The instinct to propose a dated CTO call is there, but it rests on a false premise and nothing was locked in.'
      next_step: false
      outcome: "The gatekeeper is still unconvinced and has not put anything in the CIO's or CTO's calendar; he asked for a straight answer on where the developers sit before any call is booked."
      result: 'Gatekeeper not passed — wrong company story, no meeting booked'
      objectives:
        -
          objective: 'Turn the gatekeeper into an ally who is willing to pass the call or schedule a slot.'
          status: missed
          evidence: "Alexandre says 'I'm listening, but I'm not convinced yet' and ends with 'before I put a call with your CTO in the diary, I'd still like a straight answer on where your developers actually sit' — he is not an ally, he is still screening."
        -
          objective: 'Obtain the decision‑maker’s direct email or calendar link for a follow‑up.'
          status: missed
          evidence: "No email or calendar link was requested or given; the seller only pushed 'can you put it in your calendar now?' and the client replied 'Let me have a look at Tuesday before I promise anything.'"
        -
          objective: 'Leave the gatekeeper with a concise, relevant piece of information (e.g., Etixio’s GDPR‑compliant offshore model).'
          status: missed
          evidence: "The word GDPR never appears in the call, and the seller instead told him the teams are in 'Lyon and Lisbon', the opposite of Etixio's real offshore model."
      goal: missed
      missed:
        -
          section: pain
          what: 'The real pain: no senior AI and micro-services expertise to hit the Q1 2027 launch, with the internal team already stretched on the monolith refactor.'
          how: "'What's blocking you on the AI engine side today — is it capacity, skills, or the monolith refactor taking up your seniors?'"
        -
          section: objections
          what: 'The GDPR and code-ownership concerns about an offshore team, and the doubt about quality without a nearshore presence in Europe.'
          how: "'When you picture an offshore team working on the AI engine, what worries you first — where the data sits, or who owns the code?'"
        -
          section: 'yes'
          what: 'What would make them say yes: a clear GDPR-compliant offshore model, a French client reference, and a short CTO call to outline a concrete pilot.'
          how: "'If I showed you a GDPR framework governed by contract and a French client reference, would a 30-minute call with our CTO be enough to move forward?'"
        -
          section: secret
          what: 'The stalled proof-of-concept with a competitor who cannot supply senior AI talent — the open window.'
          how: "'Have you already started anything on the AI engine with another partner, and if so what's working and what isn't?'"
      best:
        -
          quote: 'Fair enough, and I appreciate the honesty.'
          why: "Welcomes the client's frankness without getting defensive, which keeps the gatekeeper talking."
      worst:
        -
          quote: "That's a fair challenge, so let me be clear: we're a software editor, our teams are in Lyon and Lisbon, and our CTO would run that call himself."
          why: 'Invented and contradicts the offer: Etixio is not a software editor, has no developers in France, and delivers from Madagascar, Mauritius and Vietnam — and it dodges the GDPR question the client actually raised.'
          better: 'Etixio is a French company headquartered in Meudon, with about 170 developers in Madagascar, Mauritius and Vietnam, supervised by tech leads and a CTO. On the data side, GDPR is governed by contract with standard contractual clauses, named access by role, separate environments and anonymized data — and the code and repositories stay yours. If that works, our CTO can walk Marc through it in 30 minutes.'
      tips:
        - "Answer the question you were asked, once, truthfully: 'Etixio is a French company, HQ in Meudon, ~170 developers in Madagascar, Mauritius and Vietnam' — then stop and let him react. He asked four times; the fifth evasion ends the call."
        - "Replace the script with the client's own words: he said 'travel software', '.NET monolith', 'AI engine for Q1 2027' — talk dedicated .NET/micro-services teams and AI integration (RAG, assistants, POC to production), never 'order and ticket tracking'."
        - 'Turn the GDPR objection into your strongest card: standard contractual clauses, named access by role, separate environments, anonymized data, code and repos owned by the client — then ask for the 30-minute CTO call with Marc Dubois, and accept noon or 2pm he already offered.'
      speech:
        voice: true
        talk_share: 43
        seller_words: 435
        persona_words: 575
        questions: 9
        open_questions: 7
        fillers: 4
        filler_words:
          actually: 2
          right: 2
        longest: 66
        wpm: 196
        reply_delay: 0
      speech_comment: "43% talk share is fine, but 196 words per minute is fast and the longest line (66 words) is a scripted non-answer repeated three times; the four fillers ('actually', 'right') land exactly where the client is waiting for a straight answer."
