      -
        speaker: persona
        text: 'Let me pull up my files here, one second. Alright, I have it in front of me. The ticket is four five one two, opened on the tenth, marked critical, and it has been sitting with your support for seventy two hours with no answer. Roughly thirty percent of orders are failing on mobile, customers get a payment authorization error, and the new checkout module that was due on the tenth is still not live. So when you tell me your developers are good and cheap, you understand why that does not land very well this morning.'
