        speaker: seller
        text: 'Hello, this is Alex Morgan from Etixio. Thanks for taking my call. Before anything else, what made you reach out to us this week?'
        second: 2
        voice_ms: 7740
      -
        speaker: persona
        text: "Oh, I think it's the other way round – Julien Goumet sent you my way, didn't he? He mentioned Etixio to me as a possible partner for development capacity. So what's the story on your side?"
        second: 13
      -
        speaker: seller
        text: 'Right, Julien passed your details along. So when you look at your current development capacity, what do your records show concretely – how many projects are waiting, and what does that backlog cost you in time or in lost customers?'
        second: 28
        voice_ms: 13860
      -
        speaker: persona
        text: "Let me have a quick look at where we stand… We've got one big item on the critical path, and it's the AI scoring module for our new e-learning platform. My two internal developers are already stretched thin, and honestly the September launch is what keeps me up at night."
        second: 46
      -
        speaker: seller
        text: 'That sounds like a real risk for the September launch. What do your project files show concretely on that scoring module – how many weeks of work are still open, and what would a slip past September cost you in customers or revenue?'
        second: 67
        voice_ms: 13920
      -
        speaker: persona
        text: "Let me check the project status… Right, the backend and the AI part are the problem – the front-end is covered by a partner we already have. As for the cost, let's just say a semester launch slipping is not something I want to explain to my board. But before we go further, tell me how your teams actually work – I like to understand the mechanics of these things."
        second: 85
      -
        speaker: seller
        text: 'Our teams plug into your existing setup as a dedicated squad, but to size that properly, who else is involved in deciding how you move forward on this, and what would they need to see?'
        second: 112
        voice_ms: 11040
      -
        speaker: persona
        text: "I'm the one who decides technically, but my CFO has the last word on the money – he'll want a short risk and benefit review before signing anything. And I'd like to have this wrapped up within about four weeks, so timing matters."
        second: 127
      -
        speaker: seller
        text: 'Understood, so the CFO needs a short risk and benefit review. Do you have a budget or a deadline in mind for fixing it – a figure you can share, and is the four weeks a hard date?'
        second: 145
        voice_ms: 10740
      -
        speaker: persona
        text: "I'd say around eighty thousand euros a year is what I have in mind, for up to three senior developers, or the equivalent in a time and materials engagement. The CFO wants us to stay under ninety for the next twelve months, so that's the ceiling I'm working with. The four weeks is more of a target than a hard wall, but I'd rather not drag it out."
        second: 159
      -
        speaker: seller
        text: 'That gives me a clear frame: around eighty thousand a year, ceiling at ninety, and a four-week target. Here is what I suggest: a thirty-minute video call with our CTO next Tuesday at ten to look at your setup, and a written estimate by Friday. Does that work for you?'
        second: 185
        voice_ms: 16020
      -
        speaker: persona
        text: "Let me pull up my calendar for Tuesday… I'm free around ten, yes. But before I commit to a call with your CTO, I'd want a couple of things cleared up – I've heard the offshore story before, and I want to know how you actually keep quality and security under control when the developers are not in the room with us."
        second: 205
      -
        speaker: seller
        text: "That's a fair question, and I'd rather answer it properly with our CTO in the room than give you a sales pitch now. Let's keep Tuesday at ten for that thirty-minute video call, and I'll have the written estimate to you by Friday. Put it in your calendar now while we're on the line, and I'll send the invite straight after."
        second: 228
        voice_ms: 19380
      -
        speaker: persona
        text: "Alright, let me put it in… Tuesday at ten, thirty minutes with your CTO. I'll take the invite. But I'll be honest with you – what I really need out of that call is a clear picture on GDPR and who owns the code, because we've got an external privacy audit hanging over us and that one is non-negotiable for me."
        second: 252
      -
        speaker: seller
        text: "Understood, GDPR and code ownership front and centre on Tuesday at ten, and I'll make sure our CTO comes prepared on exactly those two points. Go ahead and block the thirty minutes in your calendar now, and I'll get the invite and the written estimate over to you."
        second: 275
        voice_ms: 15840
      -
        speaker: persona
