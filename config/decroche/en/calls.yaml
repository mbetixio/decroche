      criteria:
        discovery:
          label: 'Needs discovery'
          score: 6
          comment: 'He got the real scope (2 React + 1 backend + 1 QA), the budget ceiling and the decision context out of her, but only after she volunteered them; he never explored the MVP scope, the existing stack or the airline API constraint.'
        questions:
          label: 'Open questions'
          score: 5
          comment: 'Four questions, two open, and the team-composition question was the right one, but they are stacked (features + launch date + decision-makers in one breath, then budget + slot in the same sentence), which lets the client answer only what suits her.'
        listening:
          label: 'Listening and rephrasing'
          score: 5
          comment: "He picks up her words ('so besides two senior React devs...') but never rephrases the real problem she just handed him — the overloaded Java/Spring backend team — and jumps straight back to the calendar."
        objections:
          label: 'Handling objections'
          score: 4
          comment: "The offshore-quality and time-zone objections are answered in one breath with 'dedicated tech leads ensuring seamless communication and quality', a slogan with no proof, and 'full control' is vague; he never digs into what went wrong with the previous provider."
        value:
          label: 'Value proposition'
          score: 5
          comment: "The team composition (2 React + 1 backend + 1 QA) is a fair fit and the 1-3h time difference is accurate, but no governance model, no turnover/handover mechanism, no ballpark figure, and the promised 'case studies and client references' packet is thin next to her 'bring numbers, not slides'."
        closing:
          label: 'Closing / next step'
          score: 7
          comment: "He proposed two concrete slots himself, adapted to her constraint and locked Tuesday 2 pm CET with an invite and an agenda — a real dated next step, even if he never confirmed the CTO's availability or the 30-minute format."
      summary: 'A short, efficient qualification call: the seller got the true need (a 4-person team, not 2 React devs), the €90-120k ceiling and the 3-week decision, and closed a dated CTO video call. But he let her dictate the pace, answered the two classic offshore objections with a slogan, and promised a packet of references where she explicitly asked for numbers.'
      next_step: true
