  -
    seller: manager
    days_ago: 1
    scenario:
      title: 'Pricing request for React developers – Strasbourg industrial client'
      type: rushed
      difficulty: 1
      minutes: 8
      context: 'You have just emailed the price catalogue to a prospect who asked for two React developers. You are now calling them to discuss the request, understand the real need and move towards a deeper technical meeting. The prospect is evaluating several providers and wants a quick number and start date.'
      goal: 'Secure a 30‑minute video call with the CTO to uncover the real project scope and present a tailored solution.'
      objectives:
        - 'Qualify the need before talking price'
        - 'Identify the budget, the decision‑maker and the timeline'
        - 'Get the 30‑minute video call with the CTO'
      material: |-
        Subject: Request for price catalogue

        Hello Etixio team,

        Could you please send me the pricing for two senior React developers (full‑stack) for our upcoming project? We need to start in early January 2027 and would like to know the monthly cost per developer, as well as any onboarding time.

