    debrief:
      criteria:
        discovery:
          label: 'Needs discovery'
          score: 1
          comment: 'The seller never explored Alpine''s situation: he denied the existing engagement ("No, no, this is a new offer, not about that work") and only echoed the fault-log pain after Claire volunteered it, without digging into the sensors, the downtime cost or the CTO vacancy.'
        questions:
          label: 'Open questions'
          score: 2
          comment: 'Seven questions, four open on paper, but they are either self-serving ("what do your records show for your current support tickets and monthly costs?") or a booking push ("how about Tuesday at 10?"), never a question about the pilot, the roadmap or who decides.'
        listening:
          label: 'Listening and rephrasing'
          score: 2
          comment: 'Claire twice hands him the brief ("my team is drowning in fault logs from those CNC sensors, and my CTO chair is going to be empty in a month") and he answers with the same cheap-bodies pitch instead of rephrasing or building on it.'
        objections:
          label: 'Handling objections'
          score: 1
          comment: '"Cheap makes me nervous", "I''ve heard the horror stories" and "who''d actually be touching my data" all go unanswered; no GDPR argument (SCCs, named access by role, separate environments, client-owned code) and no answer on onboarding time.'
        value:
          label: 'Value proposition'
          score: 1
          comment: 'The pitch is "we are the best on the market, really, and we are cheap" and "offshore teams for support and back office" — a catalogue-free but empty promise that ignores the real offer (free AI diagnostic, predictive maintenance, technical audit, CTO-as-a-Service); no invented lead time or price, but nothing accurate either.'
        closing:
          label: 'Closing / next step'
          score: 1
          comment: 'He proposes Tuesday 10, gets a counter-proposal ("I''m free from eleven onwards") and a refusal to book ("I said I''m free from eleven, I didn''t say let''s book it"), then ends the call with no calendar entry, no agenda and no confirmation.'
      summary: 'A follow-up call on an account that is already delivering, turned into a cold "better and cheaper" pitch: the seller denied the existing relationship, asked for internal figures, and never picked up the two gifts Claire handed him (fault logs on the CNC sensors, CTO chair empty in a month). The form is acceptable (29% talk share, 198 wpm), but the content is empty: no AI diagnostic, no audit, no CTO-as-a-Service, no Pierre Léger, no GDPR answer, and no meeting actually booked.'
      next_step: false
      outcome: 'Claire is still open to a real conversation about predictive maintenance but has booked nothing; the deal is stuck at a vague "Tuesday at 11" that exists only in the seller''s head.'
      result: 'Existing account nearly damaged by a generic cheap-offshore pitch, no meeting locked'
      objectives:
        -
          objective: 'Detect a new need beyond the current maintenance contract'
          status: partial
          evidence: 'The need came from the client, not the seller: "my team is drowning in fault logs from those CNC sensors, and my CTO chair is going to be empty in a month"; the seller only echoed it ("our offshore teams can handle fault logs and support work") and never explored the IoT pilot, predictive maintenance or the leadership gap.'
        -
          objective: 'Identify the person(s) who own the new need and who can authorize a project'
          status: missed
          evidence: "Pierre Léger is never mentioned and Claire's role as spec owner is never confirmed; the seller never asked who would decide or fund an AI pilot."
        -
          objective: 'Book a dedicated discovery meeting (video call) within the next two weeks'
          status: missed
          evidence: "No meeting in the client's calendar; Claire explicitly refused (\"I said I'm free from eleven, I didn't say let's book it\") and the seller ended the call without an agenda or a confirmation."
      goal: partial
      missed:
        -
          section: budget
          what: '€80k earmarked for a six-month AI POC plus €30k for a technical audit, total under €100k for the fiscal year'
          how: '"If we went further than maintenance, what envelope could you put on the table this fiscal year — and is it already arbitrated or still to be built?"'
        -
