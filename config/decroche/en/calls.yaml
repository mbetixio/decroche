          what: 'Offshore quality, GDPR/data security, onboarding time of a new offshore team, and speed of AI results'
          how: '"What would make you hesitate about an offshore team on your sensor data — quality, security, ramp-up time?"'
        -
          section: 'yes'
          what: 'A free AI diagnostic and a 30-minute video call with the CTO within the week would unlock the discovery meeting'
          how: '"What if we started with a free AI diagnostic and a 30-minute call with our CTO next week — would that be worth your time?"'
        -
          section: secret
          what: 'A €200k end-to-end predictive-maintenance RFP is coming, with room for Etixio as AI partner plus interim CTO-as-a-Service'
          how: '"Beyond this pilot, is there a broader predictive-maintenance roadmap or a platform project being scoped this year?"'
      best:
        -
          quote: 'We can help with that kind of thing too, our offshore teams can handle fault logs and support work, and we are cheaper than hiring locally.'
          why: 'The only line in the call that connects Etixio to the need Claire just stated (fault logs), and it opens the door to staffing rather than pure replacement.'
      worst:
