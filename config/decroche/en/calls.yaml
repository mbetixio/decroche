      tips:
        - 'Open on the account you already own: reference the dedicated Java team and the TMA, then ask one open question about what has changed — "what''s keeping you busy on the technical side these days?" — instead of pitching a replacement.'
        - 'When Claire says "fault logs" and "CTO chair empty in a month", stop and dig: "how many hours a week does the manual analysis cost you?" then answer with the real offer — free AI diagnostic, AI POC to production, technical audit, CTO-as-a-Service 1 to 4 days a week during a recruitment.'
