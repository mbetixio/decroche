        speaker: persona
        text: 'The twenty eighth is after our launch date, so that is no use to me at all. I do not need a brochure, I have been a client since June. What I need is a senior replacement in place quickly, someone who can actually own this checkout bug, and a plan I can put in front of my CFO on Monday. And while we are on that subject, the last invoice has overtime charges we never approved. Can you look at that?'
