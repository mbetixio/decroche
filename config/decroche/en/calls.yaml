        text: 'Right now we’re looking at roughly a three‑month sprint to get the AI scoring module ready – if we miss that window we’d have to push the launch to the next semester, which would mean losing a chunk of our enrolments and revenue. We’ve set aside about €80 000 for the next year to bring in up to three senior developers or an equivalent time‑and‑materials engagement. Do you typically keep the offshore team in the same time zone for sprint planning, or how do you handle coordination across sites?'
        second: 17
