      title: 'Referral call – Exploring offshore support for SavoirPlus'
      type: discovery
      difficulty: 2
      minutes: 10
      context: 'You are calling a CTO in Bordeaux who was referred by a satisfied Etixio client. You have a 30‑minute discovery slot ready, and you need to leverage the referral while uncovering any hidden needs.'
