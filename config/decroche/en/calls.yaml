    lines:
      -
        speaker: seller
        text: 'Hello, I am calling from Etixio about our offshore teams. We are the best on the market, really, and we are cheap. So, do you want a quote?'
        second: 2
        voice_ms: 8340
      -
        speaker: persona
        text: "Oh, hello! Well, that's quite a pitch first thing on a Saturday morning. I've got my coffee in hand, so I'm listening – but before we talk quotes, what's actually prompting the call? Are you following up on the maintenance work your team's been doing for us?"
        second: 14
      -
        speaker: seller
        text: 'No, no, this is a new offer, not about that work. We are the best on the market, really, and we are cheap. So, do you want a quote?'
        second: 34
        voice_ms: 7860
      -
        speaker: persona
        text: "Right, so you're not the account team I usually deal with, then. Honestly, \"cheap\" makes me a bit nervous – I've been around long enough to know the cheapest option usually costs you double somewhere down the line. What is it you're actually offering, and why do you think it fits us?"
        second: 45
      -
        speaker: seller
        text: 'We offer offshore teams for support and back office, much better than what you have now. Tell me, what do your records show for your current support tickets and monthly costs?'
        second: 66
        voice_ms: 10500
      -
        speaker: persona
        text: "Let me just pull that up while we talk. Look, I'm not going to read my internal numbers out over the phone to someone I've just met – you'll understand. What I can say is we've got an ongoing relationship with your firm already, and the support side is actually running fine. So I'm curious why you'd pitch me a replacement when the incumbent's doing well. What's the angle here?"
        second: 80
      -
        speaker: seller
        text: 'Well, our offshore teams are simply better and cheaper than any incumbent, so you would save money. What do your files show for your monthly costs and ticket volumes, so we can compare?'
        second: 108
        voice_ms: 11100
      -
        speaker: persona
        text: "I'll say this politely – you're the second person in five minutes asking me for my internal figures, and I still don't know your name or what's actually behind this \"better and cheaper.\" That's not how I like to start a partnership. If you want to talk about a real need on my side, I'm happy to – but it won't be about replacing a team that's delivering."
        second: 123
      -
        speaker: seller
        text: "Okay, I understand, so you don't want to share the figures right now. Then let's just set up a proper meeting so I can show you the details, how about Tuesday at 10?"
        second: 149
        voice_ms: 9900
      -
        speaker: persona
        text: "Let me check my calendar before I say yes to anything. Hmm, Tuesday at ten doesn't work – I've got the sensor pilot review running nine to half past ten, and honestly that's the meeting where half my headaches live right now. I'm free from eleven onwards though. But before I book anything, tell me straight: what would you actually bring to that meeting? Because right now I've heard \"better and cheaper\" three times and nothing else."
        second: 162
      -
        speaker: seller
        text: "At the meeting I can show you our offshore teams and the prices, and you will see we are better and cheaper. Tuesday at 11 works, so let's put it in."
        second: 193
        voice_ms: 8940
      -
        speaker: persona
        text: "Wait, slow down – I said I'm free from eleven, I didn't say let's book it. You still haven't told me your name, or what this has to do with anything other than price. Look, I'm not trying to be difficult, but I've got real problems on my plate: my team is drowning in fault logs from those CNC sensors, and my CTO chair is going to be empty in a month. If you can help with that kind of thing, now we're talking. If it's just cheaper bodies, I'll pass."
        second: 205
      -
        speaker: seller
        text: 'We can help with that kind of thing too, our offshore teams can handle fault logs and support work, and we are cheaper than hiring locally. So, shall we say Tuesday at 11 then?'
        second: 238
        voice_ms: 10560
      -
        speaker: persona
        text: "Alright, that's a bit more like it. The fault logs are genuinely eating us alive – every machine that trips means someone's reading through pages of noise by hand, and downtime is creeping up. But handing that to a generic offshore support team makes me twitchy. I've heard the horror stories, and I need to know who'd actually be touching my data. So tell me honestly – is this a real conversation about something like predictive maintenance, or are you just trying to sell me bodies?"
        second: 252
