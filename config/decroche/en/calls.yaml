          why: "A slogan answer to two real objections: no proof of quality, no answer on turnover, and 'full control' means nothing concrete to a buyer who has been burned before."
          better: "'Fair question. On the time gap: Madagascar is +2h from Paris in winter, our leads work overlapping hours and you get a written weekly report plus demos. On quality: code review, automated tests, CI, and if a developer leaves, documented handover and a replacement — that's what I'd have the CTO walk you through on Tuesday.'"
      tips:
