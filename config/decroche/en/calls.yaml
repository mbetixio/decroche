      -
        speaker: persona
        text: "Well, Alex, you folks sent over your price catalogue for the two React developers I asked about — so, thank you for that, it was quick. I'm shopping around a bit, comparing you with a few others, so a chat makes sense. How are you doing today?"
        second: 13
      -
        speaker: seller
        text: "Doing well, thanks. When you look at those two developer profiles in the catalogue, what do your own project figures show — the delivery dates you're committed to and the budget you've set aside for this?"
        second: 32
        voice_ms: 12240
      -
        speaker: persona
        text: "Let me pull up my notes here a second… Right, so we're aiming to kick off in early January 2027, and honestly the budget is the part that keeps me up at night a bit. We've got a ceiling of seventy thousand a month for the whole transformation effort, and I was hoping two senior React folks would land somewhere around forty-five to fifty. Is that realistic on your side?"
        second: 48
      -
        speaker: seller
        text: "That helps, thank you. And when you add up the delivery dates you've committed to and what a slip would cost you, what do your figures show — is that forty-five to fifty a hard ceiling, or is there room if the profiles are stronger?"
        second: 75
        voice_ms: 13920
      -
        speaker: persona
        text: "It's more of a soft target than a wall — if the profiles are genuinely senior and they hit the ground running, I could stretch a bit. But I've got a CTO and a CFO looking over my shoulder on this one, so I can't just wave numbers around. What kind of rate would you actually put on a senior full-stack React profile?"
        second: 93
      -
        speaker: seller
        text: "That's good to know. Who else besides the CTO and CFO would need to sign off on this, and what would they need to see from us to feel comfortable?"
        second: 117
