          quote: 'No, no, this is a new offer, not about that work.'
          why: 'He denies the existing dedicated team and TMA engagement, destroying the trust of a reference account and the easiest opening he had.'
          better: "\"Actually it's a follow-up on that work — the team's been delivering for you since March 2024, and I wanted to check what's changed on your side. I heard you're running IoT pilots on the CNC machines?\""
