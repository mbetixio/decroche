          what: 'Pierre Léger (CEO) holds final approval, Claire drives the specs, decision in four weeks to start before the March 2027 production cycle'
          how: '"On a subject like this, who signs off technically, and who signs off the budget? And what''s your deadline to have something running?"'
        -
