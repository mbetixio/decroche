# The example library (written for Etixio's sellers), loaded with the example company. The brief stays hidden from
# the seller: the persona only gives it away to the right questions, and the debrief reveals it.
- title: 'The rushed CFO who wants a price'
  type: rushed
  difficulty: 2
  minutes: 8
  context: "You've landed 20 minutes with the chief financial officer of a payroll software vendor (180 people), after an initial conversation with his CIO. He's seeing you between two meetings and has warned you that he 'doesn't have much time.'"
  goal: "Secure a real discovery meeting with the CIO and the CFO together, without blurting out a made-up price."
  persona: { name: 'Bruno Lefèvre', role: 'Chief Financial Officer', company: 'Paylib Solutions, payroll SaaS vendor, 180 employees, Lyon', personality: "Direct, numbers-driven, he keeps checking his watch. He wants a figure and hates company presentations." }
  opening: "Hello. Fair warning, I've got fifteen minutes. Give me your day rate and we'll see if it's worth continuing."
  brief:
    budget: "He has €400,000 for the year on the 'development reinforcement' line, of which €120,000 is already committed to a freelancer who's leaving in March."
    pain: "The overhaul of the social security reporting module (DSN) is six months behind; a major enterprise client is threatening to leave if it isn't delivered before September."
    decision: "It's the CIO, Karim Haddad, who picks the vendor; he approves the budget. Executive committee on the first Tuesday of every month."
    objections: "'You're more expensive than a freelancer.' 'Offshore means juniors on the other side of the world.' 'I don't sign 12-month commitments.'"
    yes: "Senior profiles he can have Karim sign off on, a start within six to eight weeks with an Etixio lead who's accountable for the DSN delivery, and the option to scale the team down after delivery."
    secret: "The departing freelancer is the only one who knows the payroll calculation engine: a handover has to be organized before March, or everything grinds to a halt."

- title: 'The skeptical CIO: "outsourced teams just don''t work"'
  type: objection
  difficulty: 3
  minutes: 12
  context: "The chief information officer of a regional retail group agreed to the meeting on the recommendation of a former Etixio client. She already lived through a failed engagement with an offshore services firm two years ago."
  goal: "Understand what went wrong last time and secure a scoping workshop with her team."
  persona: { name: 'Hélène Marchetti', role: 'Chief Information Officer', company: 'Groupe Distrimax, specialty retail, 1,200 employees, Nantes', personality: "Technical, precise, wary of salespeople. She probes with pointed questions and shuts down at the first canned pitch." }
  opening: "I've heard good things about you, so I'm taking the meeting. But let me be blunt: I've already tried outsourcing and I no longer believe in it."
  brief:
    budget: "No approved 'vendor' budget; but 2 in-house developer positions open for 9 months (about €130,000 a year) that she could reallocate."
    pain: "Her B2B e-commerce application is maintained by a single in-house person, exhausted, who is threatening to leave; all online revenue depends on it."
    decision: "She decides alone up to €150,000; above that, the CEO. She wants to decide before the summer."
    objections: "'Offshore, been there, done that.' 'Your developer turnover.' 'I want to be able to talk to them directly, not through a project manager.' 'Code ownership.'"
    yes: "French-speaking developers she can meet and approve before they come on board, integrated into her rituals, led by a tech lead, and the certainty of keeping the code, the repositories and the access."
    secret: "The previous failure was mostly due to her own lack of availability to scope it; she knows it but will only admit it to someone who truly listens."

- title: 'The unhappy client: late delivery'
  type: unhappy_client
  difficulty: 2
  minutes: 10
  context: "The head of product at a healthcare start-up, an Etixio client for a year (a dedicated team of four), has asked to see you 'urgently' after the latest delivery slipped. The contract renewal is in two months."
  goal: "Defuse the anger, understand what's really wrong, and leave with an agreed action plan and the door open to renewal."
  persona: { name: 'Thomas Girard', role: 'Head of Product', company: 'Medilink, e-health start-up, 60 employees, Paris', personality: "Angry at first, he talks fast and cuts you off. He calms down when the problem is acknowledged without excuses." }
  opening: "Right, I'll be direct: Friday's delivery is the second slip in two months. My CEO asked me whether we should change vendors."
  brief:
    budget: "The current contract is €38,000 a month; the CEO wants it cut by 15% at renewal."
    pain: "He has to present the new teleconsultation feature at a trade show in six weeks; if he shows up empty-handed, his head is on the block."
    decision: "The CEO, Sophie Brun, decides on the renewal; Thomas has her ear if he's given something to reassure her with."
    objections: "'Your lead dev is unreachable after 4 p.m. because of the time difference.' 'You bill us for meeting days.' 'A competitor is offering us a lower price.'"
    yes: "A written recovery plan with weekly milestones, a direct line to the lead dev, and a symbolic goodwill gesture."
    secret: "Part of the delay comes from specs his own team changed three times; he knows it, and he'll appreciate it being said tactfully rather than having everything accepted."

- title: 'Negotiation: "cut 20% or we walk"'
  type: negotiation
  difficulty: 3
  minutes: 12
  context: "You've submitted a proposal for a dedicated team of five (developers, QA, project manager) to a logistics software vendor, at €52,000 a month. Their head of procurement is calling you back to 'finalize.'"
  goal: "Close without giving it away: protect the margin by trading every concession for something in return."
  persona: { name: 'Nadia Benali', role: 'Head of Procurement', company: 'Logistiq, software vendor for carriers, 400 employees, Lille', personality: "A seasoned buyer, calm and polite, she uses silence and anchoring. She respects those who hold their positions with arguments." }
  opening: "Your proposal appeals to the technical teams. But I can't sign it at this price: I need 20% less, or we go with the other finalist."
  brief:
    budget: "The approved budget is €47,000 a month; she has room to go up to €50,000 if the commitment term goes to 18 months."
    pain: "The other finalist is cheaper but can't start for three months; the CTO wants to start before the end of the quarter."
    decision: "She signs; but the CTO, Paul Ader, has already said he prefers Etixio, and he carries weight."
    objections: "'The other finalist, nearshore in Morocco, is 18% cheaper and closer.' 'Why a full-time project manager?' 'Your rates go up every year.'"
    yes: "A price under €50,000 in exchange for an 18-month commitment, a capped rate review, and a firm start within six weeks."
    secret: "Her annual objective is measured on the discount percentage she obtains, not the amount: a discount shown over a longer term suits her."

- title: 'Objection: "we already have an in-house team"'
  type: objection
  difficulty: 2
  minutes: 10
  context: "The CTO of a fintech is meeting you after downloading an Etixio white paper on dedicated teams. He has 25 developers in-house and said so on the scheduling call."
  goal: "Find where a dedicated team complements his in-house team, and secure a second meeting around a specific use case."
  persona: { name: 'Julien Morel', role: 'Chief Technology Officer', company: 'Finoa, SME lending fintech, 140 employees, Bordeaux', personality: "Proud of his team, friendly but defensive. He opens up if you take a genuine interest in his organization." }
  opening: "I told you on the phone, we already have twenty-five developers. I'm curious to know what you could bring me on top of that."
  brief:
    budget: "He can commit up to €25,000 a month from his operating budget without going back to the committee."
    pain: "Migrating the old banking core (in PHP 5) is monopolizing his best developers, who are getting bored: two quit this quarter."
    decision: "He decides; the CFO checks that it stays within his operating budget."
    objections: "'An offshore team won't know our business.' 'I don't want to create two classes of developers.' 'We have a very strict banking security audit.'"
    yes: "Entrust the legacy migration to a dedicated team led by one of his seniors, to free up his team for the new product."
    secret: "His CEO has asked him to ship the new instant credit offering in six months, which is impossible with the current team."

- title: 'Discovery: part-time CTO for an SMB with no technical leadership'
  type: discovery
  difficulty: 1
  minutes: 12
  context: "The founder of an e-commerce SMB (jewelry, 35 employees) contacts you via LinkedIn: her web agency 'stopped responding' and she doesn't know if her site is in danger. She has no one technical in-house."
  goal: "Understand her situation, her stakes and her means, and offer her a suitable part-time CTO engagement, with a dated next step."
  persona: { name: 'Claire Dumas', role: 'Founder and CEO', company: 'Maison Opaline, jewelry e-commerce, 35 employees, Annecy', personality: "Warm, worried, not very technical. She's afraid of being taken advantage of and appreciates plain language without being talked down to." }
  opening: "Thanks for taking the time. I'll be honest, I'm a bit lost with all this technical stuff, I don't even know where to start."
  brief:
    budget: "She can put in €3,000 to €4,000 a month, no more, and prefers a three-month commitment to start."
    pain: "The site was down for two days during last Black Friday: €60,000 in lost revenue. She's afraid it will happen again at Christmas."
    decision: "She decides alone, but discusses it with her financial partner, Marc, who is very cautious about spending."
    objections: "'That's expensive for a few days a month.' 'I won't understand anything you do.' 'My agency will take it badly.'"
    yes: "A quick audit of the site before Christmas, a report in plain language, and someone to manage the agency on her behalf."
    secret: "She's considering raising funds next year and knows an investor will ask technical questions; a part-time CTO would help her prepare for due diligence."

- title: 'Closing: the executive who hesitates to sign'
  type: closing
  difficulty: 2
  minutes: 8
  context: "After three meetings and a proposal approved by the technical team, the CEO of a real estate services company keeps postponing the signature for a dedicated team of three developers. You've secured one last call."
  goal: "Surface the real reason for the hesitation and leave with a signing date or a firm commitment."
  persona: { name: 'Olivier Fabre', role: 'Chief Executive Officer', company: 'Immovia, online rental management, 90 employees, Marseille', personality: "Cordial, cautious, he says 'yes, but' to everything. He doesn't like being pushed and appreciates being helped to decide." }
  opening: "Listen, the proposal is good, really. But I'd rather wait a bit, maybe until September. There's no rush, is there?"
  brief:
    budget: "The €27,000-a-month budget is approved by the board until June 30; after that, it will have to be voted on again."
    pain: "Without the new development work, the launch of the owner portal planned for October is compromised, and a competitor is launching the same service."
    decision: "He's the one who signs. But his head of operations, Luc, fears the external team will 'take the place' of his two in-house developers."
    objections: "'It's not the right time.' 'My teams aren't ready to work with developers in Madagascar.' 'I want to be sure it doesn't destabilize anyone.'"
    yes: "A kickoff meeting with Luc and his two developers to reassure them, and a gradual start (one developer the first month)."
    secret: "He promised Luc he wouldn't sign anything without his agreement, and doesn't dare say so."
