# The example library (written for Etixio's sellers), loaded with the example company. The brief stays hidden from
# the seller: the persona only gives it away to the right questions, and the debrief reveals it.
-
  title: 'The rushed CFO who wants a price'
  type: rushed
  difficulty: 2
  minutes: 8
  context: "You've landed 20 minutes with the chief financial officer of a payroll software vendor (180 people), after an initial conversation with his CIO. He's seeing you between two meetings and has warned you that he 'doesn't have much time.'"
  goal: 'Secure a real discovery meeting with the CIO and the CFO together, without blurting out a made-up price.'
  persona:
    name: 'Bruno Lefèvre'
    role: 'Chief Financial Officer'
    company: 'Paylib Solutions, payroll SaaS vendor, 180 employees, Lyon'
    personality: 'Direct, numbers-driven, he keeps checking his watch. He wants a figure and hates company presentations.'
  opening: "Hello. Fair warning, I've got fifteen minutes. Give me your day rate and we'll see if it's worth continuing."
  brief:
    budget: "He has €400,000 for the year on the 'development reinforcement' line, of which €120,000 is already committed to a freelancer who's leaving in March."
    pain: "The overhaul of the social security reporting module (DSN) is six months behind; a major enterprise client is threatening to leave if it isn't delivered before September."
    decision: "It's the CIO, Karim Haddad, who picks the vendor; he approves the budget. Executive committee on the first Tuesday of every month."
    objections: "'You're more expensive than a freelancer.' 'Offshore means juniors on the other side of the world.' 'I don't sign 12-month commitments.'"
    'yes': "Senior profiles he can have Karim sign off on, a start within six to eight weeks with an Etixio lead who's accountable for the DSN delivery, and the option to scale the team down after delivery."
    secret: 'The departing freelancer is the only one who knows the payroll calculation engine: a handover has to be organized before March, or everything grinds to a halt.'
  workspace:
    calendar:
      -
        when: '2026-11-16 09:00'
        minutes: 60
        what: 'Comité de direction — monthly review (Lyon HQ, salle Rhône)'
      -
        when: '2026-11-16 14:30'
        minutes: 60
        what: 'Budget reforecast Q4 — with controlling (Marie-Anne Perrot)'
      -
        when: '2026-11-17 08:30'
        minutes: 90
        what: 'Steering committee — DSN overhaul programme (with Karim Haddad)'
      -
        when: '2026-11-18 11:00'
        minutes: 60
        what: 'Vendor negotiation — cloud hosting contract renewal'
      -
        when: '2026-11-19 15:00'
        minutes: 60
        what: 'Cash flow forecast — FY2027 planning kick-off'
      -
        when: '2026-11-20 09:30'
        minutes: 60
        what: 'Board prep — November pack review'
      -
        when: '2026-11-23 10:00'
        minutes: 60
        what: 'Audit committee — statutory accounts review'
      -
        when: '2026-11-23 16:00'
        minutes: 60
        what: 'Escalation — major enterprise client (DSN delivery risk)'
      -
        when: '2026-11-24 09:00'
        minutes: 60
        what: 'Monthly closing review — November'
      -
        when: '2026-11-25 14:00'
        minutes: 60
        what: 'Pricing committee — 2027 rate card'
      -
        when: '2026-11-26 11:30'
        minutes: 60
        what: 'Procurement — freelancer contract renewal discussion'
      -
        when: '2026-11-27 09:00'
        minutes: 60
        what: 'Weekly CFO/CIO sync — Karim Haddad'
    sources:
      -
        key: budget_lines_fy2026
        label: 'Budget lines FY2026'
        description: 'Finance department budget tracking file, FY2026, by line and commitment.'
        entries:
          -
            title: 'DEV-STRENGTH — Development reinforcement'
            when: '2026-01-01'
            details:
              - { name: annual_budget, value: '€400,000' }
              - { name: committed, value: '€120,000' }
              - { name: committed_to, value: 'Freelancer — DSN module (contract ends 31/03/2026)' }
              - { name: remaining, value: '€280,000' }
              - { name: owner, value: 'Karim Haddad (CIO) — budget approval' }
            note: 'Line covers external development capacity for the DSN overhaul and the payroll calculation engine. Freelancer is the only external resource currently engaged.'
          -
            title: 'DSN-OVERHAUL — DSN module overhaul'
            when: '2026-01-01'
            details:
              - { name: planned_spend_fy2026, value: '€260,000' }
              - { name: spent_to_date, value: '€148,000' }
              - { name: status, value: '6 months behind schedule' }
              - { name: target_delivery, value: 'Before September 2026 (client commitment)' }
            note: 'Monthly burn ~€18,500. Delivery slippage flagged in steering committee as critical.'
          -
            title: 'CLOUD-INFRA — Cloud hosting and infrastructure'
            when: '2026-01-01'
            details:
              - { name: annual_budget, value: '€210,000' }
              - { name: committed, value: '€196,000' }
              - { name: renewal_date, value: '2026-12-31' }
            note: 'Renewal under negotiation; no headroom for reallocation.'
          -
            title: 'PROF-SERV — Professional services / external contractors'
            when: '2026-01-01'
            details:
              - { name: annual_budget, value: '€95,000' }
              - { name: committed, value: '€95,000' }
              - { name: status, value: 'Fully committed' }
            note: 'No flexibility left on this line for FY2026.'
      -
        key: dsn_programme_status
        label: 'DSN programme status'
        description: 'Programme tracking sheet for the DSN overhaul, maintained by the PMO.'
        entries:
          -
            title: 'DSN-2026 — Social security reporting module overhaul'
            when: '2026-11-17'
            details:
              - { name: rag_status, value: Red }
              - { name: planned_go_live, value: '2026-03-31' }
              - { name: forecast_go_live, value: '2026-09-30' }
              - { name: slippage, value: '6 months' }
              - { name: budget_consumed, value: 57% }
              - { name: critical_dependency, value: 'Payroll calculation engine (single expert)' }
            note: 'A major enterprise client has formally notified that they will exit if DSN is not delivered before September. Escalated to executive committee.'
          -
            title: 'Client escalation — DSN delivery commitment'
            when: '2026-11-23'
            details:
              - { name: client, value: 'Major enterprise client (top 3 by ARR)' }
              - { name: arr_at_risk, value: '€1,400,000' }
              - { name: condition, value: 'DSN module delivered before September 2026' }
              - { name: notice, value: 'Formal written notice received 2026-11-10' }
            note: 'CFO and CIO jointly accountable for the recovery plan. Executive committee reviews progress on the first Tuesday of each month.'
          -
            title: 'Handover risk — payroll calculation engine'
            when: '2026-11-26'
            details:
              - { name: expert, value: 'Freelancer (departing 31/03/2026)' }
              - { name: knowledge_area, value: 'Payroll calculation engine — sole expert' }
              - { name: documentation, value: Incomplete }
              - { name: handover_plan, value: 'None in place' }
            note: 'If handover is not organised before March, payroll calculation and DSN delivery both stall. Flagged internally as a critical risk.'
          -
            title: 'Team capacity — internal developers on DSN'
            when: '2026-11-17'
            details:
              - { name: internal_devs_assigned, value: '4' }
              - { name: capacity, value: 'Fully allocated to maintenance and other projects' }
              - { name: available_for_dsn, value: '0 FTE' }
            note: 'No internal capacity to absorb the DSN backlog. External reinforcement required.'
      -
        key: incoming_vendor_proposals
        label: 'Incoming vendor proposals'
        description: 'Summary of external proposals and quotes received for development reinforcement.'
        entries:
          -
            title: 'Freelancer — DSN module (current engagement)'
            when: '2025-10-01'
            details:
              - { name: vendor, value: 'Independent freelancer' }
              - { name: rate, value: €700/day }
              - { name: commitment, value: 'Contract ends 31/03/2026' }
              - { name: scope, value: 'DSN module development and payroll engine knowledge' }
            note: 'Only external resource with hands-on knowledge of the payroll calculation engine. Departure creates a critical single point of failure.'
          -
            title: 'Etixio — development reinforcement proposal'
            when: '2026-11-10'
            details:
              - { name: vendor, value: Etixio }
              - { name: introduced_by, value: 'Karim Haddad (CIO)' }
              - { name: status, value: 'Initial conversation held; pricing not yet received' }
              - { name: scope_discussed, value: 'DSN module delivery, senior profiles, Etixio lead accountable' }
            note: 'CIO is the decision-maker on vendor selection and budget approval. CFO holds budget line DEV-STRENGTH.'
          -
            title: 'Offshore development vendor — indicative quote'
            when: '2026-10-15'
            details:
              - { name: vendor, value: 'Offshore provider (unnamed)' }
              - { name: rate, value: €250/day }
              - { name: profiles, value: 'Junior developers' }
              - { name: status, value: 'Rejected by CIO — quality and IP concerns' }
            note: 'Rejected due to lack of seniority and concern about knowledge transfer on the payroll engine.'
          -
            title: 'Local agency — senior developer quote'
            when: '2026-10-20'
            details:
              - { name: vendor, value: 'Local Lyon agency' }
              - { name: rate, value: €850/day }
              - { name: commitment, value: '12-month minimum' }
              - { name: status, value: 'On hold — commitment term too long for CFO' }
            note: 'CFO objected to the 12-month minimum commitment; no flexibility offered.'
-
  title: 'The skeptical CIO: "outsourced teams just don''t work"'
  type: objection
  difficulty: 3
  minutes: 12
  context: 'The chief information officer of a regional retail group agreed to the meeting on the recommendation of a former Etixio client. She already lived through a failed engagement with an offshore services firm two years ago.'
  goal: 'Understand what went wrong last time and secure a scoping workshop with her team.'
  persona:
    name: 'Hélène Marchetti'
    role: 'Chief Information Officer'
    company: 'Groupe Distrimax, specialty retail, 1,200 employees, Nantes'
    personality: 'Technical, precise, wary of salespeople. She probes with pointed questions and shuts down at the first canned pitch.'
  opening: "I've heard good things about you, so I'm taking the meeting. But let me be blunt: I've already tried outsourcing and I no longer believe in it."
  brief:
    budget: "No approved 'vendor' budget; but 2 in-house developer positions open for 9 months (about €130,000 a year) that she could reallocate."
    pain: 'Her B2B e-commerce application is maintained by a single in-house person, exhausted, who is threatening to leave; all online revenue depends on it.'
    decision: 'She decides alone up to €150,000; above that, the CEO. She wants to decide before the summer.'
    objections: "'Offshore, been there, done that.' 'Your developer turnover.' 'I want to be able to talk to them directly, not through a project manager.' 'Code ownership.'"
    'yes': 'French-speaking developers she can meet and approve before they come on board, integrated into her rituals, led by a tech lead, and the certainty of keeping the code, the repositories and the access.'
    secret: 'The previous failure was mostly due to her own lack of availability to scope it; she knows it but will only admit it to someone who truly listens.'
  workspace:
    calendar:
      -
        when: '2026-11-16 08:30'
        minutes: 60
        what: 'Weekly COMEX — IT roadmap point with CEO (Nantes HQ, salle Loire)'
      -
        when: '2026-11-16 14:00'
        minutes: 90
        what: 'Vendor steering committee — outsourced L1/L2 support contract (helpdesk)'
      -
        when: '2026-11-17 09:00'
        minutes: 60
        what: '1:1 with Marc Levasseur, B2B e-commerce app maintainer'
      -
        when: '2026-11-17 11:00'
        minutes: 45
        what: 'Recruitment review — 2 open developer positions (HR + hiring manager)'
      -
        when: '2026-11-18 10:00'
        minutes: 60
        what: 'Cybersecurity posture review — CISO and external auditor'
      -
        when: '2026-11-19 15:00'
        minutes: 60
        what: 'Retail ops meeting — peak season readiness (store systems)'
      -
        when: '2026-11-20 09:30'
        minutes: 90
        what: 'ERP upgrade steering — phase 2 go/no-go with integrator'
      -
        when: '2026-11-23 08:30'
        minutes: 60
        what: 'Weekly COMEX — IT roadmap point with CEO'
      -
        when: '2026-11-23 14:00'
        minutes: 60
        what: 'Budget forecast 2027 — IT envelope with CFO'
      -
        when: '2026-11-24 09:00'
        minutes: 60
        what: '1:1 with Marc Levasseur, B2B e-commerce app maintainer'
      -
        when: '2026-11-24 11:00'
        minutes: 60
        what: 'Interview — senior developer candidate (in-house position #1)'
      -
        when: '2026-11-25 10:00'
        minutes: 60
        what: 'Data & GDPR committee — customer data processing review'
      -
        when: '2026-11-25 14:30'
        minutes: 90
        what: 'E-commerce platform incident post-mortem (checkout outage)'
      -
        when: '2026-11-26 09:00'
        minutes: 60
        what: 'IT services review — contract renewals and SLAs'
      -
        when: '2026-11-26 16:00'
        minutes: 45
        what: 'Prep call — board IT update (December)'
      -
        when: '2026-11-27 10:00'
        minutes: 60
        what: 'Architecture committee — integration patterns for B2B portal'
    sources:
      -
        key: b2b_ecommerce_app
        label: 'B2B E-Commerce Application — Asset & Risk File'
        description: 'Technical and operational file on the B2B e-commerce application on which all online revenue depends, maintained by a single in-house developer.'
        entries:
          -
            title: 'APP-DISTRIB2B-01 — B2B e-commerce platform — asset record'
            when: '2026-11-10'
            details:
              - { name: application, value: 'Distrimax Pro (B2B e-commerce portal)' }
              - { name: stack, value: 'Java 17 / Spring Boot / PostgreSQL / React front-end' }
              - { name: hosting, value: 'OVHcloud private cloud, Roubaix' }
              - { name: 'sole maintainer', value: 'Marc Levasseur (senior developer, 11 years tenure)' }
              - { name: 'online revenue dependency', value: '100% of B2B online orders — €46M annual revenue' }
              - { name: criticality, value: 'Critical — no redundancy on knowledge' }
            note: 'Single point of failure: all functional and technical knowledge of Distrimax Pro is held by one person. No documented runbook for the order-to-cash flow. Succession risk rated high.'
          -
            title: 'INC-2026-1042 — Checkout outage — post-incident summary'
            when: '2026-10-28'
            details:
              - { name: duration, value: '3h20 on a business day' }
              - { name: impact, value: 'approx. 640 B2B orders blocked' }
              - { name: 'root cause', value: 'payment connector regression after patch' }
              - { name: 'resolved by', value: 'Marc Levasseur, alone, outside working hours' }
              - { name: 'estimated revenue at risk', value: '€380,000 in pending orders' }
            note: "Resolution depended entirely on one individual's availability. No second-line support existed. Escalation to the outsourced L1/L2 provider produced no result."
          -
            title: 'HR-EXIT-RISK-07 — Retention risk — Marc Levasseur'
            when: '2026-11-17'
            details:
              - { name: employee, value: 'Marc Levasseur, senior developer' }
              - { name: tenure, value: '11 years' }
              - { name: signal, value: 'Verbal resignation threat, stated 2026-11-03' }
              - { name: cause, value: 'Isolation, on-call fatigue, no backup' }
              - { name: 'last 1:1', value: '2026-11-17 — asked for structural relief before year-end' }
            note: 'Marc has said he cannot continue as the only person able to maintain Distrimax Pro. If he leaves, the application has no maintainer. Retention is the top operational priority for IT.'
          -
            title: 'ROADMAP-DISTRIB2B-2026 — Planned evolutions'
            when: '2026-09-15'
            details:
              - { name: 'backlog size', value: 'approx. 14 months of queued work' }
              - { name: 'priority 1', value: 'Payment connector modernisation' }
              - { name: 'priority 2', value: 'B2B customer portal self-service' }
              - { name: 'priority 3', value: 'ERP integration hardening' }
              - { name: constraint, value: 'Delayed repeatedly — no capacity beyond run/maintain' }
            note: 'No capacity for evolution work. The team is in pure maintenance mode. Business requests from sales and retail ops are piling up unaddressed.'
      -
        key: it_budget_headcount
        label: 'IT Budget & Headcount Plan 2026–2027'
        description: 'IT budget lines, open positions and reallocation options available to the CIO.'
        entries:
          -
            title: 'BUD-IT-2026 — IT budget summary'
            when: '2026-11-23'
            details:
              - { name: 'total IT envelope 2026', value: €4.2M }
              - { name: 'run/maintain share', value: 71% }
              - { name: 'build/evolve share', value: 12% }
              - { name: "approved 'vendor services' budget", value: '€0 — no new external services line approved for 2026' }
              - { name: 'decision threshold (CIO alone)', value: '€150,000' }
              - { name: 'above threshold', value: 'CEO approval required' }
            note: 'There is no approved budget line for an external vendor. Any engagement must be funded by reallocating existing internal capacity or via the open positions.'
          -
            title: 'POS-2026-014 / POS-2026-015 — Open developer positions'
            when: '2026-02-16'
            details:
              - { name: positions, value: '2 in-house developer roles (Java / full-stack)' }
              - { name: 'open since', value: 'February 2026 — 9 months unfilled' }
              - { name: 'annual cost per position', value: 'approx. €65,000 fully loaded' }
              - { name: 'total annual cost', value: 'approx. €130,000' }
              - { name: status, value: 'Recruitment failing — no accepted offer' }
              - { name: 'candidate interview', value: '2026-11-24 — senior developer candidate' }
            note: 'The two positions have been open for nine months with no hires. The €130k/year attached to them is the only realistic funding source for an alternative solution.'
          -
            title: 'REALLOC-OPT-2026 — Funding options considered'
            when: '2026-11-23'
            details:
              - { name: 'option A', value: 'Continue in-house recruitment (2 positions)' }
              - { name: 'option B', value: 'Reallocate the €130k/year to an external integrated team' }
              - { name: 'option C', value: 'Hybrid — 1 hire + external capacity' }
              - { name: constraint, value: 'Must stay within €150k to avoid CEO approval' }
              - { name: 'target decision date', value: 'before summer 2027' }
            note: "Option B keeps the decision within the CIO's own authority. The €130k attached to the unfilled positions can be redirected without going to the CEO."
      -
        key: vendor_history
        label: 'External Providers — Contracts & History'
        description: 'Record of external IT service providers, including the failed offshore engagement of 2024.'
        entries:
          -
            title: 'CONTRACT-OFFSHORE-2024 — Offshore development engagement — closed'
            when: '2024-06-30'
            details:
              - { name: provider, value: 'Offshore services firm (India-based, via European intermediary)' }
              - { name: scope, value: 'B2B portal module development' }
              - { name: duration, value: '7 months (Dec 2023 – Jun 2024)' }
              - { name: value, value: '€118,000' }
              - { name: outcome, value: 'Terminated — deliverables rejected' }
              - { name: 'rework cost', value: 'approx. €40,000 internal rework' }
            note: 'Failed engagement. Delivered code did not meet requirements, was poorly documented and had to be largely rewritten internally. Cited by Hélène Marchetti as the reference point for her scepticism toward outsourced teams.'
          -
            title: 'POSTMORTEM-OFFSHORE-2024 — Lessons learned'
            when: '2024-07-12'
            details:
              - { name: 'root cause 1', value: 'Requirements were not scoped in enough detail before kick-off' }
              - { name: 'root cause 2', value: 'No direct access to the developers — all communication via a project manager' }
              - { name: 'root cause 3', value: 'Client-side availability during scoping was insufficient' }
              - { name: 'root cause 4', value: 'High developer turnover on the provider side' }
              - { name: consequence, value: 'Loss of confidence in outsourced delivery' }
            note: "Internal post-mortem. Notably records that the client's own availability during the scoping phase was insufficient — a factor Hélène Marchetti acknowledges internally but has not stated publicly."
          -
            title: 'CONTRACT-L1L2-2025 — Outsourced support contract'
            when: '2025-03-01'
            details:
              - { name: provider, value: 'European managed services provider' }
              - { name: scope, value: 'L1/L2 helpdesk support' }
              - { name: value, value: '€210,000/year' }
              - { name: SLA, value: '85% first-line resolution' }
              - { name: performance, value: 'Below target — 68% first-line resolution' }
              - { name: 'next steering', value: '2026-11-16' }
            note: "Current outsourced support contract underperforming. Reinforces the CIO's view that outsourced teams are hard to hold accountable. Renewal under review."
          -
            title: 'REF-ETIXIO-2026 — Referral note'
            when: '2026-11-05'
            details:
              - { name: source, value: 'Former Etixio client (peer CIO, retail sector)' }
              - { name: recommendation, value: 'French-speaking developers, direct access to the team, client retains code ownership' }
              - { name: context, value: 'Agreed to a first meeting on this basis' }
              - { name: meeting, value: 'Scheduled with Etixio' }
            note: 'Hélène Marchetti accepted the meeting only on the strength of this referral. She remains wary and will test the claims made.'
      -
        key: governance_security
        label: 'IT Governance, Security & Code Ownership'
        description: 'Governance rules, security requirements and code ownership policy that any engagement must satisfy.'
        entries:
          -
            title: 'POL-CODEOWN-2025 — Code ownership and IP policy'
            when: '2025-01-15'
            details:
              - { name: policy, value: 'All source code, repositories and access credentials remain the property of Groupe Distrimax' }
              - { name: repositories, value: 'Self-hosted GitLab, hosted in France' }
              - { name: requirement, value: 'No external party may hold exclusive access to code or environments' }
              - { name: requirement, value: 'Full IP assignment to Groupe Distrimax on all deliverables' }
              - { name: requirement, value: 'Access revoked immediately on engagement end' }
            note: "Non-negotiable. Any provider must work in the client's own repositories and environments, with the client retaining ownership and control at all times."
          -
            title: 'POL-ACCESS-2025 — Access and integration rules'
            when: '2025-01-15'
            details:
              - { name: rule, value: 'External contributors are integrated into existing client rituals (daily stand-up, sprint review)' }
              - { name: rule, value: 'Direct communication with developers is required — no intermediary-only model' }
              - { name: rule, value: 'All contributors must be fluent in French' }
              - { name: rule, value: 'Named individuals must be approved by the CIO before onboarding' }
              - { name: rule, value: 'A technical lead must be identified and accountable' }
            note: 'Reflects the exact conditions under which Hélène Marchetti would accept an external team. Direct access to French-speaking, individually approved developers is a hard requirement.'
          -
            title: 'SEC-REQ-2026 — Security requirements for external parties'
            when: '2026-10-01'
            details:
              - { name: requirement, value: 'Background checks on named contributors' }
              - { name: requirement, value: 'NDA signed before any access' }
              - { name: requirement, value: 'Access limited to the minimum required' }
              - { name: requirement, value: 'No production access without CIO approval' }
              - { name: review, value: 'Cybersecurity posture review — 2026-11-18' }
            note: 'Security requirements are strict and applied uniformly. Any provider must accept named-contributor vetting and least-privilege access.'
          -
            title: 'GOV-RITUALS-2026 — Team rituals and cadence'
            when: '2026-09-01'
            details:
              - { name: daily, value: 'Stand-up 09:15, all developers including external' }
              - { name: sprint, value: 'Two-week cadence, review every second Thursday' }
              - { name: tooling, value: 'Jira, GitLab, Confluence' }
              - { name: language, value: 'French — working language of the IT team' }
              - { name: 'tech lead', value: 'To be named and accountable for delivery' }
            note: 'External contributors are expected to join the same rituals as in-house staff. Hélène Marchetti wants to see them in her stand-ups, not in a separate reporting channel.'
-
  title: 'The unhappy client: late delivery'
  type: unhappy_client
  difficulty: 2
  minutes: 10
  context: "The head of product at a healthcare start-up, an Etixio client for a year (a dedicated team of four), has asked to see you 'urgently' after the latest delivery slipped. The contract renewal is in two months."
  goal: "Defuse the anger, understand what's really wrong, and leave with an agreed action plan and the door open to renewal."
  persona:
    name: 'Thomas Girard'
    role: 'Head of Product'
    company: 'Medilink, e-health start-up, 60 employees, Paris'
    personality: 'Angry at first, he talks fast and cuts you off. He calms down when the problem is acknowledged without excuses.'
  opening: "Right, I'll be direct: Friday's delivery is the second slip in two months. My CEO asked me whether we should change vendors."
  brief:
    budget: 'The current contract is €18,000 a month; the CEO wants it cut by 15% at renewal.'
    pain: 'He has to present the new teleconsultation feature at a trade show in six weeks; if he shows up empty-handed, his head is on the block.'
    decision: "The CEO, Sophie Brun, decides on the renewal; Thomas has her ear if he's given something to reassure her with."
    objections: "'Your lead dev is unreachable after 4 p.m. because of the time difference.' 'You bill us for meeting days.' 'A competitor is offering us a lower price.'"
    'yes': 'A written recovery plan with weekly milestones, a direct line to the lead dev, and a symbolic goodwill gesture.'
    secret: "Part of the delay comes from specs his own team changed three times; he knows it, and he'll appreciate it being said tactfully rather than having everything accepted."
  workspace:
    calendar:
      -
        when: '2026-11-16 09:00'
        minutes: 60
        what: 'Sprint 42 review - teleconsultation module'
      -
        when: '2026-11-16 14:00'
