  title: 'Negotiation: "cut 20% or we walk"'
  type: negotiation
  difficulty: 3
  minutes: 12
  context: "You've submitted a proposal for a dedicated team of five (developers, QA, project manager) to a logistics software vendor, at €23,000 a month. Their head of procurement is calling you back to 'finalize.'"
  goal: 'Close without giving it away: protect the margin by trading every concession for something in return.'
  persona:
    name: 'Nadia Benali'
    role: 'Head of Procurement'
    company: 'Logistiq, software vendor for carriers, 400 employees, Lille'
    personality: 'A seasoned buyer, calm and polite, she uses silence and anchoring. She respects those who hold their positions with arguments.'
  opening: "Your proposal appeals to the technical teams. But I can't sign it at this price: I need 20% less, or we go with the other finalist."
  brief:
    budget: 'The approved budget is €20,000 a month; she has room to go up to €22,000 if the commitment term goes to 18 months.'
    pain: "The other finalist is cheaper but can't start for three months; the CTO wants to start before the end of the quarter."
    decision: 'She signs; but the CTO, Paul Ader, has already said he prefers Etixio, and he carries weight.'
    objections: "'The other finalist, nearshore in Morocco, is 18% cheaper and closer.' 'Why a full-time project manager?' 'Your rates go up every year.'"
    'yes': 'A price under €22,000 in exchange for an 18-month commitment, a capped rate review, and a firm start within six weeks.'
    secret: 'Her annual objective is measured on the discount percentage she obtains, not the amount: a discount shown over a longer term suits her.'
