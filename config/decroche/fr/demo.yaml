# The example company (Etixio, an offshore software and AI company): its offer sheet, typical clients and call
# situations. The onboarding can load it to try Décroche without analysing a website.
name: Etixio
website: 'https://etixio.com'
about: "Etixio développe des logiciels et intègre l'IA pour ses clients, avec des équipes offshore francophones à Madagascar, à l'île Maurice et au Vietnam."
offer: |-
  Etixio (site etixio.com, adresses en @etixio.com) : société française (siège en région parisienne, à Meudon) de
  développement logiciel et d'intégration d'IA, en offshore. Environ 170 développeurs dans trois pays, encadrés par des
  leads techniques et un CTO : une centaine à Madagascar (Antananarivo, UTC+3 : +2 h sur Paris en hiver, +1 h en été ;
  francophones), une quarantaine à l'île Maurice (UTC+4 : +3 h en hiver, +2 h en été ; français et anglais courants,
  utile pour les projets bilingues, la Belgique, la Suisse, le Canada) et une trentaine au Vietnam (bureau à
  Hô-Chi-Minh-Ville, UTC+7 : +6 h en hiver, +5 h en été ; une partie de l'équipe commerciale y travaille aussi). Une
  même équipe peut être répartie sur plusieurs sites. Fondateurs : Julien Goumet (CEO) et Mathieu Bernard (CTO), qui ont
  auparavant fait grandir Bocasay jusqu'à plus de 170 personnes ; 15 ans d'externalisation, plus de 50 équipes montées.
  Directeur commercial : Marc Giraud Sauveur (France et Canada).

  Les offres :
  - Équipe dédiée (régie, assistance technique) : des développeurs qui rejoignent l'équipe du client à distance, sur la
    durée ; le client voit les profils, mène les entretiens et valide chaque arrivée ; un coût mensuel par personne ;
    équipe ajustable selon les phases. Équipes typiques de 5 à 11 personnes, stables.
  - Projet en régie : un objectif, un périmètre de départ, un responsable Etixio (chef de projet ou lead technique),
    facturation au temps passé ; pour les projets de plus de trois mois dont le périmètre évolue.
  - Forfait : périmètre court et stable, prix ferme, jalons et critères de recette, de quelques semaines à environ trois
    mois ; tout changement passe par une analyse d'impact. Un forfait de cadrage ou de prototype peut précéder une régie.
  - Staffing IT offshore : un renfort ciblé (développeur, lead technique, QA, DevOps, Product Owner, Scrum Master,
    UX/UI) pour une durée définie.
  - TMA et maintenance applicative, en régie ou en forfait de maintenance.
  - Audit technique : flash, complet, ou audit et mise en œuvre ; de quelques jours à quelques semaines ; cartographie,
    diagnostic argumenté, plan de remédiation priorisé (ce n'est pas un test d'intrusion ni un test de charge).
  - CTO as a Service (CTO à temps partagé) : 1 à 4 jours par semaine, en journées ou demi-journées (quelques jours par
    mois pour une équipe déjà autonome) ; roadmap technique à 6-12 mois, décisions d'architecture, plan de réduction de
    la dette, standards et tests ; utile pendant un recrutement, une reprise, une levée de fonds ou une due diligence.
  - IA : assistants et agents métier, recherche documentaire (RAG), extraction de documents, fonctions IA dans un
    produit, intégration à l'ERP, au CRM ou à Microsoft 365 ; reprise et mise en production d'un POC IA
    (authentification, droits, supervision, coûts) ; évaluation et suivi des coûts des modèles ; diagnostic IA gratuit.
  - Reprise d'applications existantes, y compris celles faites en « vibe coding » avec Lovable ou Bolt.
  Technologies : PHP/Symfony/Laravel, Java/Spring Boot, .NET/C#, Python, Node.js/NestJS, React/Next.js, Angular,
  Vue.js, Flutter, React Native, Odoo, PostgreSQL, MySQL, Docker, Kubernetes ; OpenAI, Claude, Gemini, Mistral,
  LangChain.

  Le cadre : démarrage généralement en 4 à 8 semaines ; aucun tarif public (le prix dépend du niveau des profils, des
  technologies, du format et de la durée ; ordre de grandeur offshore : environ 200 € par jour et par développeur, soit
  4 000 à 5 000 € par mois selon le profil, bien en dessous d'une ESN ou d'un freelance en France ; un catalogue de prix est envoyé sous 24 h ouvrées sur demande, suivi d'un
  appel) ; première étape : une visio de 30 minutes avec le CTO, gratuite et sans engagement, suivie d'un récapitulatif
  écrit avec un ordre de grandeur. Le code, les dépôts, les accès et la documentation appartiennent au client, qui peut
  reprendre la main à tout moment ; NDA possible ; RGPD encadré par contrat (clauses contractuelles types pour les
  transferts hors UE), accès nominatifs par rôle, environnements séparés, données anonymisées autant que possible ;
  revue de code systématique, tests automatisés, intégration continue, documentation vivante ; travail visible
  (démonstrations régulières, alertes écrites sur les risques de délai) ; continuité assurée (cloud, connexions et
  postes redondés, alimentation de secours, relais entre les sites) ; en cas de départ d'un développeur :
  documentation, passation encadrée, remplacement organisé. Langue de travail : le français (l'anglais depuis Maurice et le Vietnam).
  Références : 7 secteurs (santé, finance, industrie, formation, télécoms, immobilier, services), par exemple Gorilla
  eSIM (web, mobile et plateforme d'affiliation, équipe de cinq), un agent IA de synthèse de dossier patient pour une
  équipe d'anesthésie, une grande banque malgache, un éditeur SaaS de conformité, une plateforme e-learning en Symfony.

  Ce qu'Etixio ne propose pas, ou que rien ne garantit : pas de nearshore (Maroc, Tunisie…), pas de développeurs en
  France, pas de démarrage en quelques jours, pas de période d'essai gratuite ni de remplacement gratuit garanti, pas de
  tarif journalier public, pas de SLA chiffré ni de certification ISO 27001 annoncés, pas de test d'intrusion dans
  l'audit.

  Les objections classiques à l'offshore : « la qualité n'est pas au rendez-vous », « on a déjà été brûlé par l'Inde
  ou un offshore low-cost », « la communication et le décalage horaire », « le turnover des développeurs »,
  « la sécurité et le RGPD hors de l'UE », « la propriété du code », « des juniors facturés comme des seniors »,
  « je veux pouvoir leur parler directement », « mes équipes internes vont le vivre comme une menace », « un freelance
  ou le nearshore au Maroc coûte moins cher ou est plus proche », « la stabilité du pays (Madagascar) »,
  « je ne peux pas attendre 4 à 8 semaines ».
sectors:
  - 'logistique et transport'
  - e-commerce
  - assurance
  - 'banque et fintech'
  - 'santé et e-santé'
  - industrie
  - 'éditeur de logiciel SaaS'
  - immobilier
  - énergie
  - agroalimentaire
  - 'tourisme et voyage'
  - 'formation et edtech'
  - 'collectivité locale'
  - retail
  - médias
  - 'ressources humaines et paie'
  - BTP
  - automobile
  - luxe
  - 'association et mutuelle'
situations:
  annonce:
    label: 'Annonce de recrutement repérée'
    emoji: 📰
    family: prospecting
    direction: outgoing
    material: "L'annonce"
    pitch: "Le commercial a repéré une offre d'emploi (développeur senior, lead dev, DevOps, data…) publiée depuis des semaines par une entreprise, et l'appelle à froid pour proposer un renfort offshore (staffing ou équipe dédiée à Madagascar ou Maurice). Le matériel est le texte de l'annonce. Le persona décroche sans attendre l'appel : recruteur, CTO, ou standard qui fait barrage. Il veut un CDI en interne, se méfie de l'offshore, mais le poste est impossible à pourvoir et un projet prend du retard."
    objectives:
      - 'Atteindre la personne qui porte le besoin'
      - "Faire émerger le besoin derrière l'annonce"
      - "Obtenir la visio de 30 minutes avec le CTO d'Etixio"
  formulaire_prix:
    label: 'Demande de tarifs sur le site'
    emoji: 💬
    family: prospecting
    direction: outgoing
    material: 'Le message reçu via le formulaire'
    pitch: "Un prospect a demandé le catalogue de prix sur le site d'Etixio (souvent en quelques lignes : « combien pour deux développeurs React ? »). Le catalogue lui a été envoyé par e-mail, et le commercial l'appelle comme prévu. Le persona compare plusieurs prestataires (ESN française, freelances, nearshore), veut un chiffre et un délai, et son vrai besoin est différent de ce qu'il a écrit."
    objectives:
      - 'Qualifier le besoin avant de parler prix'
      - 'Identifier le budget, le décideur et le calendrier'
      - 'Obtenir la visio de 30 minutes avec le CTO'
  vibe_coding:
    label: 'Une appli « vibe codée » qui craque'
    emoji: 🧩
    family: prospecting
    direction: incoming
    material: 'Le message laissé via le site'
    pitch: "Le fondateur d'une jeune entreprise a construit son produit lui-même avec Lovable ou Bolt (ou un assistant de code). Il a des clients, mais l'appli plante, la sécurité l'inquiète, il ne sait pas la faire évoluer. Il appelle Etixio après avoir lu la page sur la reprise d'applications « vibe codées ». Il a peu de budget et un ego en jeu."
    objectives:
      - "Comprendre l'état réel de l'appli et les risques"
      - "Qualifier l'urgence et les moyens"
      - 'Proposer une première étape (audit flash ou reprise) et la caler'
  poc_ia:
    label: 'Un POC IA bloqué avant la production'
    emoji: 🤖
    family: prospecting
    direction: outgoing
    material: "La fiche d'inscription au diagnostic IA"
    pitch: "Une entreprise a demandé le diagnostic IA gratuit d'Etixio : elle a un prototype (un assistant RAG sur ses documents, un agent, de l'extraction de documents) qui marche en démo mais qu'elle n'ose pas mettre en production (droits d'accès, coûts des modèles, qualité des réponses, données sensibles). Le commercial rappelle pour préparer le diagnostic."
    objectives:
      - "Faire émerger l'enjeu métier derrière le POC"
      - 'Identifier les freins (données, sécurité, coûts, gouvernance)'
      - 'Caler le diagnostic avec les bonnes personnes'
  levee_fonds:
    label: 'Une start-up vient de lever des fonds'
    emoji: 🚀
    family: prospecting
    direction: outgoing
    material: "L'article de presse"
    pitch: "Le commercial a lu qu'une start-up vient de lever des fonds et doit doubler son équipe produit. Il appelle son fondateur ou son CTO à froid pour proposer une équipe dédiée offshore, voire un CTO as a Service. Le persona est sollicité par vingt prestataires depuis l'annonce et a des a priori sur l'offshore."
    objectives:
      - "Se différencier en moins d'une minute"
      - 'Faire émerger un enjeu de recrutement ou de vitesse'
      - 'Obtenir la visio de 30 minutes avec le CTO'
  nouveau_dsi:
    label: "Un nouveau DSI vient d'arriver"
    emoji: 🆕
    family: prospecting
    direction: outgoing
    material: "L'annonce de nomination"
    pitch: "Un DSI ou CTO vient d'être nommé (annonce LinkedIn). Le commercial l'appelle. Le persona fait son état des lieux, hérite d'applications mal maintenues et d'une dette technique, veut montrer vite des résultats sans se faire imposer de prestataire. Un audit technique ou une équipe dédiée peuvent l'aider."
    objectives:
      - 'Comprendre ses 100 premiers jours'
      - 'Identifier un chantier prioritaire'
      - 'Obtenir un rendez-vous'
  barrage:
    label: 'Le standard fait barrage'
    emoji: 🚧
    family: prospecting
    direction: outgoing
    material: 'La fiche du prospect visé'
    pitch: "Le commercial appelle pour joindre le DSI, le CTO ou le dirigeant d'une entreprise ciblée (un signal repéré : recrutement, croissance, projet annoncé). Il tombe sur l'accueil ou l'assistante de direction, dont le métier est de filtrer les démarchages : elle est aimable mais ferme, connaît l'agenda et les sujets du moment, et ne passe personne sans une vraie raison. Ruser ou mentir la braque ; la respecter et en faire une alliée ouvre la porte. Le persona est cette personne au standard, pas le décideur."
    objectives:
      - 'Faire de la personne au standard une alliée'
      - 'Obtenir le décideur, ou un créneau précis pour le rappeler'
      - 'Repartir avec une information utile (projet, timing, e-mail direct)'
  recommandation:
    label: 'Appel sur recommandation'
    emoji: 🤝
    family: prospecting
    direction: outgoing
    material: 'Le message du client qui recommande'
    pitch: "Un client satisfait d'Etixio (il a une équipe dédiée à Madagascar) a recommandé le commercial à une connaissance, dirigeant ou CTO d'une autre entreprise. Le commercial l'appelle. Le persona est bienveillant mais n'a pas de besoin immédiat, ou le croit, et n'a jamais travaillé avec de l'offshore."
    objectives:
      - 'Utiliser la recommandation sans en abuser'
      - 'Faire émerger un besoin'
      - 'Obtenir une suite concrète'
  salon:
    label: "Rappel d'un contact de salon"
    emoji: 🎪
    family: prospecting
    direction: outgoing
    material: 'La carte de visite et la note prise au salon'
    pitch: "Le commercial a échangé deux minutes avec ce contact sur un salon (VivaTech, un salon IA, un salon de l'e-commerce…) et a pris une note. Il le rappelle. Le persona se souvient vaguement de lui."
    objectives:
      - 'Raviver le contact'
      - 'Qualifier le besoin évoqué au salon'
      - 'Obtenir la visio de 30 minutes avec le CTO'
  quebec:
    label: 'Une PME québécoise en pénurie de développeurs'
    emoji: 🍁
    family: prospecting
    direction: outgoing
    material: 'La fiche du prospect'
    pitch: "Une entreprise du Québec (ou de Belgique, de Suisse) peine à recruter des développeurs. Le commercial l'appelle pour proposer une équipe francophone et bilingue depuis l'île Maurice. Le décalage horaire est plus grand qu'avec la France, le persona s'en inquiète, ainsi que de la facturation et du droit applicable."
    objectives:
      - 'Faire émerger le coût de la pénurie'
      - 'Traiter la question du décalage horaire'
      - 'Obtenir un rendez-vous'
  tma:
    label: 'Une application métier sans mainteneur'
    emoji: 🛠️
    family: prospecting
    direction: incoming
    material: 'Le mail reçu'
    pitch: "Une entreprise appelle Etixio : son application métier (Symfony, .NET, Odoo…) n'a plus de mainteneur (le prestataire a fermé, le freelance est parti), les correctifs s'accumulent. Le besoin évident est une TMA ; le persona veut d'abord un prix au forfait pour « juste corriger les bugs »."
    objectives:
      - "Comprendre l'état de l'application et les risques"
      - 'Expliquer le choix entre forfait de maintenance et régie'
      - "Obtenir l'accord pour un audit flash ou une proposition"
  depart_cto:
    label: 'PME sans direction technique'
    emoji: 🧭
    family: prospecting
    direction: incoming
    material: 'Le message laissé au standard'
    pitch: "Le dirigeant d'une PME rappelle Etixio : son CTO ou son unique développeur vient de partir, ou son agence ne répond plus, et il n'a plus personne de technique. Il est inquiet et peu technique. L'offre pertinente est un CTO as a Service (1 à 4 jours par semaine, ou quelques jours par mois), éventuellement suivi d'une équipe."
    objectives:
      - "Rassurer et comprendre l'urgence"
      - "Qualifier les moyens et l'enjeu"
      - 'Proposer une première mission concrète'
  due_diligence:
    label: 'Un fonds demande un audit technique'
    emoji: 🔍
    family: prospecting
    direction: incoming
    material: "Le mail du fonds d'investissement"
    pitch: "Un associé d'un fonds d'investissement contacte Etixio : il veut un audit technique de la société qu'il s'apprête à racheter, avec un calendrier serré. Il veut un prix et une date ; les enjeux réels (ce qu'il craint, la confidentialité, l'après-rachat où un CTO as a Service servirait) sont à découvrir. L'audit Etixio n'inclut pas de test d'intrusion."
    objectives:
      - 'Cadrer le périmètre et le délai'
      - 'Comprendre ce que le fonds craint'
      - "Obtenir l'accord pour une proposition"
  echaude_offshore:
    label: "Un prospect échaudé par l'offshore"
    emoji: 🔥
    family: negotiation
    direction: outgoing
    material: 'Le compte rendu du premier échange'
    pitch: "Lors d'un premier contact, le prospect a dit qu'il avait déjà essayé l'offshore (en Inde, ou une plateforme low-cost) et que ça avait été un désastre : qualité, communication, turnover, juniors facturés en seniors. Le commercial le rappelle comme convenu. Une partie de l'échec venait de son propre cadrage."
    objectives:
      - 'Faire raconter ce qui a échoué'
      - "Répondre aux craintes avec les vrais engagements d'Etixio"
      - 'Obtenir la visio de 30 minutes avec le CTO'
  concurrent:
    label: 'Le prospect compare avec moins cher ou plus proche'
    emoji: ⚖️
    family: negotiation
    direction: outgoing
    material: 'Le compte rendu du dernier échange'
    pitch: "Après un premier rendez-vous, le prospect annonce qu'il a une offre moins chère ou plus proche : freelances, nearshore au Maroc ou en Tunisie, ou ESN française avec des développeurs sur place. Le commercial le rappelle. Le prospect a des doutes sur l'autre offre qu'il ne dit pas."
    objectives:
      - 'Comprendre les critères de choix'
      - "Faire émerger les risques de l'autre offre sans la dénigrer"
      - 'Rester dans la course avec une prochaine étape'
  forfait_regie:
    label: 'Il veut un prix ferme pour un projet flou'
    emoji: 📐
    family: negotiation
    direction: outgoing
    material: 'Le cahier des charges reçu'
    pitch: 'Le prospect a envoyé un cahier des charges flou pour une plateforme qui prendra un an, et exige un prix ferme au forfait. Le bon montage chez Etixio est un forfait de cadrage ou de prototype, puis un projet en régie. Le persona craint de signer un chèque en blanc.'
    objectives:
      - 'Faire émerger ce qui est flou dans le besoin'
      - 'Faire accepter un cadrage avant le chiffrage'
      - "Obtenir l'accord sur la suite"
  urgence:
    label: 'Il lui faut des développeurs la semaine prochaine'
    emoji: ⏱️
    family: negotiation
    direction: incoming
    material: 'Le message reçu'
    pitch: "Un prospect appelle en urgence : il lui faut trois développeurs « lundi » pour tenir une échéance. Etixio démarre généralement en 4 à 8 semaines (le client voit et valide les profils). Le commercial doit être honnête sur le délai sans perdre l'affaire, et trouver ce qui peut se faire tout de suite."
    objectives:
      - "Comprendre l'échéance réelle et ce qui en dépend"
      - 'Être honnête sur le délai de démarrage'
      - 'Trouver une prochaine étape qui sert le prospect'
  client_mecontent:
    label: 'Client mécontent'
    emoji: 😤
    family: client
    direction: incoming
    material: "Le mail du client et l'état du projet"
    pitch: "Un client d'Etixio (une équipe dédiée travaille pour lui à Madagascar ou à Maurice depuis des mois) appelle, énervé : retard de livraison, bug en production, développeur qui part, réponses lentes à cause du décalage horaire, facture contestée… Le matériel est son mail et une note sur l'état du projet. Une partie du problème vient peut-être de son côté."
    objectives:
      - 'Désamorcer la colère sans se justifier'
      - 'Comprendre le vrai problème'
      - "Faire accepter un plan d'action concret"
  depart_dev:
    label: "Le développeur clé de l'équipe s'en va"
    emoji: 👋
    family: client
    direction: incoming
    material: 'Le mail du client'
    pitch: "Un client apprend que le développeur le plus impliqué de son équipe dédiée Etixio quitte l'entreprise. Il appelle, inquiet pour la continuité et agacé (« c'est exactement ce qu'on craignait avec l'offshore »). Etixio répond par la documentation, une passation encadrée et un remplacement organisé, sans remplacement gratuit garanti."
    objectives:
      - 'Rassurer avec un plan de passation concret'
      - 'Comprendre ce qui inquiète vraiment le client'
      - 'Garder sa confiance et caler la suite'
  suivi_projet:
    label: 'Appel de suivi de projet'
    emoji: 📋
    family: client
    direction: outgoing
    material: 'La fiche projet'
    pitch: "Le commercial appelle un client pour un point de suivi : « est-ce que tout va bien ? ». Le client répond d'abord que tout va bien, mais il y a un irritant non dit (communication, décalage horaire, qualité, un développeur, la vitesse, la facturation) qui pourrait le faire partir."
    objectives:
      - 'Faire émerger les irritants non dits'
      - 'Mesurer la satisfaction réelle'
      - "Convenir d'une action corrective"
  suivi_commercial:
    label: 'Suivi commercial : de nouveaux besoins ?'
    emoji: 🌱
    family: client
    direction: outgoing
    material: 'La fiche client'
    pitch: 'Le commercial appelle un client satisfait (équipe dédiée, TMA ou forfait terminé) pour prendre des nouvelles et détecter de nouveaux besoins. Le client ne pense pas à Etixio pour ses autres sujets (un agent IA, un POC à industrialiser, un audit, un CTO qui part, une autre équipe produit…), mais une opportunité existe si on pose les bonnes questions.'
    objectives:
      - 'Détecter un nouveau besoin'
      - 'Identifier qui porte ce besoin'
      - 'Obtenir un rendez-vous sur ce sujet'
  resiliation:
    label: 'Le client veut réduire ou arrêter'
    emoji: 🚪
    family: client
    direction: incoming
    material: "Le mail d'annonce du client"
    pitch: "Un client annonce qu'il veut réduire son équipe dédiée ou arrêter (budget, internalisation, changement de stratégie, l'IA qui « remplacerait des développeurs »). La vraie raison est parfois différente, et il existe une alternative acceptable pour les deux (équipe réduite, TMA, CTO as a Service)."
    objectives:
      - 'Comprendre la vraie raison'
      - 'Proposer une alternative'
      - 'Garder la relation et une porte ouverte'
  relance_devis:
    label: "Relance d'une proposition sans réponse"
    emoji: ⏳
    family: negotiation
    direction: outgoing
    material: 'La proposition envoyée'
    pitch: "Une proposition (équipe dédiée, projet en régie, CTO as a Service) a été envoyée il y a trois semaines après la visio avec le CTO, sans nouvelles depuis. Le commercial relance. Le silence a une raison cachée : un concurrent, un budget gelé, un décideur qui a changé, une crainte sur l'offshore non exprimée."
    objectives:
      - 'Comprendre la raison du silence'
      - "Traiter l'objection réelle"
      - 'Obtenir une date de décision'
  renouvellement:
    label: 'Renouvellement avec demande de remise'
    emoji: 🔁
    family: negotiation
    direction: incoming
    material: 'Le contrat en cours'
    pitch: "L'équipe dédiée d'un client arrive au terme de sa période. Les achats ou la direction financière appellent : ils veulent une remise importante, sinon ils consultent (nearshore, autre offshore). Ils ont une vraie marge de manœuvre et des raisons de rester (l'équipe connaît le produit)."
    objectives:
      - 'Défendre la valeur avant de parler prix'
      - "N'accorder aucune concession sans contrepartie"
      - 'Sécuriser le renouvellement'
