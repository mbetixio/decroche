    lines:
      -
        text: "Bonjour, je vous appelle de la part d'Etixio au sujet de nos équipes offshore."
        speaker: seller
        second: 1
        voice_ms: 4565
      -
        text: "Content de vous entendre ! Nous avons été assez occupés avec ces nouveaux capteurs IoT sur les CNC – voyez-vous beaucoup d'intérêt de la part d'autres fabricants ces temps-ci ?"
        speaker: persona
        second: 1
      -
        text: 'Nous sommes les meilleurs sur le marché, vraiment, et nous sommes bon marché.'
        speaker: seller
        second: 1
        voice_ms: 4520
      -
        text: "C'est bon à savoir – la qualité est vraiment ce qui nous importe sur le terrain. Comment faites-vous pour garantir que le code reste solide lorsque vous travaillez offshore ?"
        speaker: persona
        second: 2
      -
        text: 'Alors, vous voulez un devis ?'
        speaker: seller
        second: 2
        voice_ms: 3080
      -
        text: 'Je suis un peu préoccupé par la qualité et la rapidité avec laquelle une équipe offshore pourrait être opérationnelle, surtout avec notre CTO qui part le mois prochain. Et pourriez-vous faire un diagnostic IA gratuit rapide sur nos données de capteurs pour voir comment cela pourrait aider ?'
        speaker: persona
        second: 4
    ended_by: seller
    seconds: 4
    revealed:
      - objections
      - 'yes'
    score: 12
    debrief:
      criteria:
        discovery:
          label: 'Découverte du besoin'
          score: 1
          comment: "Le vendeur n'a posé aucune question sur la situation d'Alpine Manufacturing : il n'a ni nommé le contrat en cours (équipe dédiée Java/Spring + TMA depuis mars 2024), ni exploré les capteurs IoT sur CNC, ni le départ du CTO, tous deux évoqués spontanément par Claire."
        questions:
          label: 'Questions ouvertes'
          score: 1
          comment: "Une seule question dans tout l'appel, et elle est fermée (« Alors, vous voulez un devis ? ») ; aucune question ouverte sur les enjeux, le calendrier ou les décideurs."
        listening:
          label: 'Écoute et reformulation'
          score: 1
          comment: "Claire ouvre trois portes (capteurs IoT sur CNC, départ du CTO le mois prochain, demande de diagnostic IA gratuit) et le vendeur n'en reprend aucune ; il parle 21 % du temps mais ne rebondit sur rien de ce qu'elle dit."
        objections:
          label: 'Traitement des objections'
          score: 1
          comment: "Deux objections explicites (« Comment faites-vous pour garantir que le code reste solide lorsque vous travaillez offshore ? » et « Je suis un peu préoccupé par la qualité et la rapidité avec laquelle une équipe offshore pourrait être opérationnelle ») restent sans aucune réponse, alors que l'offre fournit les arguments (revue de code systématique, tests automatisés, CI, leads techniques et CTO, francophone à Madagascar, démarrage 4 à 8 semaines)."
        value:
          label: 'Proposition de valeur'
          score: 1
          comment: "« Nous sommes les meilleurs sur le marché, vraiment, et nous sommes bon marché » contredit le positionnement d'Etixio (aucun tarif public, pas de low-cost) et déclenche précisément l'objection offshore low-cost ; aucune offre réelle n'est reliée au besoin exprimé."
        closing:
          label: 'Closing / prochaine étape'
          score: 1
          comment: "Le vendeur termine l'appel sur « Alors, vous voulez un devis ? », question fermée hors séquence (la première étape est une visio de 30 minutes avec le CTO, gratuite), sans date ni verrouillage ; aucune réunion n'a été réservée."
      summary: "Appel de suivi de huit minutes où le client a livré spontanément le besoin (capteurs IoT sur CNC), le vide de direction (départ du CTO) et la demande qui déclenche l'achat (diagnostic IA gratuit), et où le vendeur n'a posé aucune question ouverte, n'a traité aucune objection et a conclu sans prochaine étape. Le niveau est très en dessous de ce qu'exige un suivi de compte existant : la relation et le contrat de maintenance n'ont même pas été nommés."
      next_step: false
      outcome: "Aucune réunion n'a été réservée et aucune date n'a été proposée : le compte reste sur le seul contrat de TMA, avec un besoin IA et un besoin de CTO-as-a-Service identifiés mais non exploités."
      result: "Occasion manquée sur un compte existant : le client a tout donné, le vendeur n'a rien ramassé."
      objectives:
        -
          objective: 'Détecter un nouveau besoin au-delà du contrat de maintenance actuel'
          status: partial
          evidence: "Le besoin est apparu dans la bouche du client (« Nous avons été assez occupés avec ces nouveaux capteurs IoT sur les CNC »), pas grâce au vendeur, qui n'a posé aucune question sur les initiatives en cours."
        -
          objective: 'Identifier la ou les personnes qui portent le nouveau besoin et qui peuvent autoriser un projet'
          status: missed
          evidence: "Le vendeur n'a posé aucune question sur les décideurs ni sur le processus de décision ; le rôle de Pierre Léger (PDG) et le délai de décision de quatre semaines n'ont jamais été abordés."
        -
          objective: 'Réserver une réunion de découverte dédiée (visioconférence) dans les deux semaines à venir'
          status: missed
          evidence: "Aucune réunion n'a été réservée ni proposée : le vendeur a terminé l'appel après « Alors, vous voulez un devis ? », sans date ni créneau."
      goal: partial
      missed:
        -
          section: budget
          what: "80 k€ fléchés pour un POC IA de six mois, 30 k€ pour un audit technique, plafond de 100 k€ sur l'exercice"
          how: '« Sur ce type de pilote, vous avez déjà une enveloppe et un calendrier budgétaire en tête ? »'
        -
          section: pain
          what: "L'analyse manuelle des journaux de pannes allonge les temps d'arrêt, absence de feuille de route pour exploiter les données capteurs, vide de direction technique"
          how: "« Concrètement, aujourd'hui, qui analyse ces journaux de pannes, et combien de temps ça vous coûte par semaine ? »"
