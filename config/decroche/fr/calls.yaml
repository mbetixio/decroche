        second: 37
        voice_ms: 11369
      -
        speaker: persona
        text: 'Dès demain, carrément ? Ça me paraît un peu rapide, on n’a même pas encore cadré le besoin… et puis franchement, l’offshore, on s’est déjà fait avoir une fois, la qualité n’était pas toujours au rendez-vous. C’est quoi votre recette pour que ça se passe mieux cette fois ?'
        second: 37
