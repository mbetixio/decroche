          better: "« C'est le point sur lequel je ne veux aucune approximation. Concrètement : clauses contractuelles types pour les transferts hors UE, accès nominatifs par rôle, environnements séparés, données anonymisées autant que possible, NDA possible — et le code, les dépôts et la documentation vous appartiennent, vous pouvez reprendre la main à tout moment. Qu'est-ce que votre régulateur exige précisément, pour que je vous réponde point par point ? »"
      tips:
        - "Ouvrez en nommant la recommandation : « Julien Goumet, qui a travaillé avec notre équipe à Madagascar, m'a suggéré de vous appeler » — c'est la perche donnée dans le brief et elle n'a jamais été saisie."
        - "Traitez les objections RGPD et propriété du code avec les vrais arguments de l'offre (clauses contractuelles types, accès nominatifs par rôle, environnements séparés, code et dépôts au client, reprise en main à tout moment) et creusez : « qu'est-ce que votre régulateur exige précisément ? » — troisième débrief de suite où ce point plafonne."
        - "Reliez l'offre au besoin chiffré : 3 devs seniors dans ~80 k€/an, module IA pour septembre → proposez l'audit flash (cartographie, diagnostic, plan de remédiation priorisé) et le diagnostic IA gratuit, et nommez une référence edtech réelle (plateforme e-learning en Symfony, Gorilla eSIM) au lieu de « je pourrai vous les partager »."
