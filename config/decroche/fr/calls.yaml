        - 'Comprendre le vrai problème, y compris les aspects techniques, de communication et de facturation.'
        - "Obtenir un accord sur un plan d'action concret (remplacement du développeur, chef de projet dédié, correction de la facture) et planifier une réunion de suivi avec le CTO."
      material: |-
        De : Alexandre Moreau <alex.moreau@maisonelegance.com>
        Envoyé : 2026-11-13 09:15 CET
        Objet : Problèmes critiques avec l'équipe Etixio

        Bonjour,
        Nous devons parler d'urgence de l'équipe dédiée que vous avez mise en place à Madagascar. Depuis la semaine dernière, le nouveau module de paiement que nous attendions pour notre boutique en ligne n'est toujours pas en ligne – nous avons un bug bloquant qui casse les commandes et nous perdons des ventes.
        Pour couronner le tout, un de vos développeurs seniors a annoncé qu'il partait demain, et nous attendons depuis trois jours une réponse à notre ticket concernant le bug. Notre directeur financier conteste également la dernière facture ; le montant facturé pour les heures supplémentaires ne correspond pas aux heures que nous avons enregistrées.
        Nous ne pouvons pas nous permettre d'autres retards ; le lancement est lié à notre collection de fêtes et la campagne marketing commence le 2026-12-01.
        Merci de me rappeler dès que possible avec un plan concret.
        Merci,
        Alexandre Moreau

        ---
        Note interne (équipe commerciale) :
        - Équipe dédiée de 6 développeurs (4 seniors, 2 juniors) basée à Antananarivo, démarrée le 2026-06-15.
        - Projet : refonte du tunnel de paiement e-commerce, livraison prévue le 2026-11-30.
        - Problèmes actuels : bug de production causant des échecs de commande, turnover des développeurs, litige de facturation, retard de réponse dû au décalage horaire.
        - Contrat : déploiement sur 12 mois, tarif mensuel de 22 000 € par développeur, facturation mensuelle.
        - Le client a exprimé son intention d'évaluer des alternatives si la situation n'est pas résolue dans les 2 semaines.
