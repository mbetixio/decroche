      context: "Vous venez de recevoir un e-mail laconique d'un client se plaignant de délais non respectés, d'un bug de production, du départ soudain d'un développeur et d'une facture contestée. Le client, une entreprise de biens de luxe de 2 000 salariés à Lille, vous a appelé pour discuter de la situation. Il est en colère mais souhaite toujours trouver une solution sans mettre immédiatement fin au contrat."
      goal: 'Apaiser la colère du client, identifier les causes profondes et obtenir un accord sur un plan de remédiation concret.'
      objectives:
