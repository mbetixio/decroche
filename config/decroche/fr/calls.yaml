      summary: "Appel de suivi après une TMA réussie : Camille est chaleureuse, elle ouvre elle-même les deux sujets porteurs (assistant IA SmartPlanner, départ du CTO fin décembre) et demande deux fois une visio avec le CTO d'Etixio. Le vendeur répond par un pitch tarifaire répété, promet des démarrages immédiats et une disponibilité 24 h/24, invente des références, ne découvre ni le budget ni le décisionnaire, et raccroche sans fixer de rendez-vous. Niveau : débutant sur cet appel, malgré un contexte client très favorable."
      next_step: false
