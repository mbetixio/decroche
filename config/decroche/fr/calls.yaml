        objections: 'Pierre soulèvera des préoccupations concernant les différences de fuseau horaire (Madagascar vs France), la protection des données/RGPD lorsque le code est offshore, et des expériences négatives passées avec des prestataires offshore à bas coût en matière de qualité et de turnover.'
