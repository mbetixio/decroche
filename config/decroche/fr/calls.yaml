    lines:
      -
        text: "Bonjour, c'est Alex Morgan d'Etixio. Merci de prendre mon appel. Avant toute chose, qu'est-ce qui vous a poussé à nous contacter cette semaine ?"
        speaker: seller
        second: 0
        voice_ms: 7805
      -
        text: "Nous sommes en pleine semaine de planification stratégique pour le DSI, et l'équipe cherche des moyens de renforcer notre capacité de développement, surtout autour du nouveau moteur d'itinéraires basé sur l'IA que nous lançons l'année prochaine. Je suis curieux, comment avez-vous accompagné d'autres entreprises SaaS françaises sur des projets IA sensibles au RGPD ?"
        speaker: persona
        second: 3
      -
        text: "Je vois. Et quand cela se produit aujourd'hui, qu'est-ce que cela vous coûte concrètement, en temps ou en clients ?"
        speaker: seller
        second: 3
        voice_ms: 6230
      -
        text: 'Nous avons réservé environ 150 k€ pour le développement externe du moteur IA, en essayant de maintenir les dépenses mensuelles sous 30 k€, et nous tenons vraiment à rester dans les temps pour un lancement au T1 2027.'
        speaker: persona
        second: 4
      -
        text: "Qui d'autre est impliqué dans la décision d'avancer sur ce sujet, et qu'auraient-ils besoin de voir ?"
        speaker: seller
        second: 4
        voice_ms: 6275
      -
        text: "La décision finale revient à notre DSI, Laura Benoît, mais elle exige une validation technique de notre CTO, Marc Dubois, avant tout contrat. Ils voudront voir un plan de pilote concret, des processus clairs conformes au RGPD, et une preuve d'expertise senior en IA. Avez-vous déjà mené une validation technique avec un CTO sur un projet IA similaire ?"
        speaker: persona
        second: 5
      -
        text: 'Avez-vous un budget ou une échéance en tête pour régler cela ?'
        speaker: seller
        second: 5
        voice_ms: 4565
      -
        text: |-
          Nous avons alloué environ 150 k€ pour le développement IA, en visant à rester sous 30 k€ par mois. 
           Le calendrier interne prévoit une décision d'ici fin février 2027, donc il nous faudrait le pilote prêt bien avant.
        speaker: persona
        second: 6
      -
        text: "Voici ce que je propose : un appel vidéo de trente minutes avec notre CTO mardi prochain à dix heures pour examiner votre configuration, et un devis écrit d'ici vendredi. Est-ce que cela vous convient ?"
        speaker: seller
        second: 6
        voice_ms: 9380
      -
        text: "Cela me convient – je vais coordonner avec Marc Dubois pour mardi à dix heures. Une question rapide : pourriez-vous partager une référence d'un client SaaS français qui a réalisé un déploiement IA similaire conforme au RGPD ?"
        speaker: persona
        second: 7
