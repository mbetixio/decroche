    lines:
      -
        speaker: seller
        text: 'Bonjour Pierre‑Henri, c’est Marc Giraud Sauveur d’Etixio ; je vous appelle suite à la recommandation de Mathieu Girard d’EcoFab pour vous présenter nos équipes offshore et nos audits techniques.'
        second: 4
        voice_ms: 11369
      -
        speaker: persona
        text: 'Ah, Mathieu ! Oui, il m’en a parlé justement la semaine dernière, au déjeuner. Il était plutôt content de vous, faut croire. Alors, qu’est‑ce que vous faites exactement de ce côté‑là ?'
        second: 4
      -
        speaker: seller
        text: 'Nous aidons les entreprises comme la vôtre à renforcer leurs équipes tech : développeurs dédiés ou audits, tout en gardant la maîtrise du code. Quels sont les principaux défis techniques que vous rencontrez aujourd’hui ?'
        second: 29
        voice_ms: 13292
      -
        speaker: persona
        text: 'Écoutez, on ne va pas se mentir, notre ERP interne en Java traîne la patte, et mes cinq développeurs passent leur temps à éteindre des feux plutôt qu’à avancer. Ça commence à peser, surtout qu’on est en pleine préparation budgétaire pour 2027.'
        second: 29
      -
        speaker: seller
        text: 'Je comprends, Pierre‑Henri. Pourriez‑vous me préciser quelles parties de l’ERP vous posent le plus problème ? Et seriez‑vous disponible mardi ou mercredi à 10 h pour une visio de 30 minutes ?'
        second: 59
        voice_ms: 11369
      -
        speaker: persona
        text: 'Oh, la lenteur surtout, sur le suivi de production : des requêtes qui mettent trente secondes, des exports qui plantent en fin de mois. Mes gars bricolent des contournements, mais ça ne tiendra pas longtemps. Pour la visio, voyons voir… laissez‑moi regarder mon agenda.'
        second: 59
      -
        speaker: seller
        text: 'D’accord, je comprends. Prenez le temps de vérifier votre agenda ; quel créneau vous conviendrait le mieux cette semaine pour notre visio de 30 minutes ?'
        second: 88
        voice_ms: 9446
      -
        speaker: persona
        text: 'Je regarde… mardi 10 h, attends, laissez‑moi vérifier. Alors, mardi 10 h je suis en atelier veille technologique, ça ne le fera pas. Par contre mercredi 11 h je suis libre, ça vous irait ?'
        second: 88
      -
        speaker: seller
        text: 'Parfait, mercredi à 11 h, c’est noté. Je vous envoie le lien de la visio ainsi qu’un bref aperçu de nos solutions d’audit ERP. À très bientôt, Pierre‑Henri.'
        second: 111
        voice_ms: 10985
      -
        speaker: persona
        text: 'Attendez, je note ça de mon côté. Mercredi 11 h, c’est bon pour moi. Mais dites‑moi, votre CTO sera là ? Parce que si je vous dis oui, c’est surtout pour qu’il me parle concrètement de la gouvernance, du RGPD et de la propriété du code.'
        second: 111
      -
        speaker: seller
        text: 'Oui, notre CTO sera présent, il pourra détailler la gouvernance, le respect du RGPD et confirmer que le code vous appartient intégralement. Je vous envoie tout ça d’ici demain.'
        second: 141
        voice_ms: 11754
      -
        speaker: persona
        text: 'Ah, ça, c’est exactement ce que je voulais entendre. Parce que franchement, l’offshore, j’y suis curieux, mais la perte de contrôle me fait un peu tiquer. Bon, très bien, mercredi 11 h, je bloque.'
        second: 141
      -
        speaker: seller
        text: 'Parfait, je bloque mercredi 11 h, je vous envoie le lien de la visio, le briefing et le guide RGPD ; si vous avez besoin d’un document supplémentaire, dites‑le moi.'
        second: 166
        voice_ms: 11369
      -
        speaker: persona
        text: 'Je regarde une dernière fois pour être sûr de ne pas vous raconter de bêtises… mardi 10 h j’ai un atelier, mais mercredi 11 h, c’est bien libre. Noté, alors. Un point quand même : vous pensez pouvoir me dire à quoi ressemble un premier ordre de grandeur côté coûts ?'
        second: 166
      -
        speaker: seller
        text: 'Nous vous proposerons un premier chiffrage détaillé, basé sur votre volume et vos besoins, d’ici la visio ; ainsi, mercredi 11 h, nous pourrons affiner le budget ensemble.'
        second: 198
        voice_ms: 10215
      -
        speaker: persona
        text: 'Entendu, ça me va. Bon, j’ai un bateau qui m’attend ce week‑end, donc je file. Mercredi 11 h, je bloque, et j’attends le lien. À mercredi, Marc, et merci pour l’appel.'
        second: 198
      -
        speaker: seller
        text: 'Parfait, je vous envoie tout de suite le lien et les documents ; profitez bien de votre week‑end, et à mercredi 11 h. Merci, au revoir, Pierre‑Henri.'
        second: 221
        voice_ms: 10600
      -
        speaker: persona
        text: 'Merci à vous, à mercredi !'
        second: 221
