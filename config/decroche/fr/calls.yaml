    lines:
      -
        text: "Bonjour, c'est Alex d'Etixio, nous constituons des équipes de développement dédiées. Vous avez une minute ?"
        speaker: seller
        second: 0
        voice_ms: 5915
      -
        text: "Bien sûr, Alex, j'ai quelques minutes entre la planification du sprint et la préparation de mon équipage pour la voile ce week-end – qu'est-ce qui vous préoccupe ?"
        speaker: persona
        second: 1
      -
        text: 'Nous avons de très bons développeurs à Madagascar et à Maurice, et nous sommes moins chers que les agences à Paris.'
        speaker: seller
        second: 1
        voice_ms: 6500
      -
        text: "J'apprécie l'argument du coût, mais nous sommes vraiment à court d'expertise senior PHP/Symfony en ce moment – notre lancement en dépend. Ma principale inquiétude est de savoir si l'équipe offshore peut fournir ce niveau de qualité de manière constante et rester synchronisée avec notre planning. Avez-vous une garantie senior et un plan clair en cas de changement de personnel ?"
        speaker: persona
        second: 3
      -
        text: 'Quelle est votre situation actuelle avec vos développeurs ?'
        speaker: seller
        second: 3
        voice_ms: 4340
      -
        text: "Nous avons une équipe produit solide, mais en ce moment le backend est sous tension – nos deux ingénieurs Symfony seniors jonglent entre la prochaine fonctionnalité de recherche basée sur l'IA et quelques correctifs urgents pour le lancement. C'est un peu un goulot d'étranglement, et nous cherchons un développeur senior qui peut être opérationnel immédiatement sans longue période d'adaptation."
        speaker: persona
        second: 4
      -
        text: 'OK. Je peux vous envoyer notre brochure et une liste de prix par email.'
        speaker: seller
        second: 4
        voice_ms: 4610
      -
        text: "Très bien, Alex – n'hésitez pas à m'envoyer la brochure. Juste pour s'assurer qu'on est alignés, pourriez-vous me dire comment vous gérez le turnover et si vous pouvez garantir un développeur senior dans l'équipe, idéalement avec une petite remise sur le premier mois pour nous aider à démarrer ?"
        speaker: persona
        second: 6
    ended_by: seller
    seconds: 6
    revealed:
      - pain
      - objections
      - 'yes'
    score: 15
    debrief:
      criteria:
        discovery:
          label: 'Découverte du besoin'
          score: 3
          comment: "Le goulot d'étranglement backend et le besoin de senior PHP/Symfony sortent uniquement parce que Claire les donne d'elle-même, le vendeur n'explore ni le silence de trois semaines, ni le budget, ni le décideur, ni l'échéance."
        questions:
          label: 'Questions ouvertes'
          score: 3
          comment: "Deux questions seulement, dont une seule ouverte (« Quelle est votre situation actuelle avec vos développeurs ? »), et elle n'est pas suivie d'une deuxième question pour creuser."
        listening:
          label: 'Écoute et reformulation'
          score: 2
          comment: "Aucune reformulation : ni le « goulot d'étranglement », ni la question explicite de Claire sur le turnover et la garantie senior ne sont repris, et l'ouverture « Vous avez une minute ? » ferme l'échange au lieu de l'ouvrir."
        objections:
          label: 'Traitement des objections'
          score: 2
          comment: "L'inquiétude qualité/communication offshore et la crainte de dérive des coûts en régie ne sont pas traitées : le vendeur répond par le prix et renvoie à une brochure, deuxième occurrence du même schéma après le débrief du 2026-11-11."
        value:
          label: 'Proposition de valeur'
          score: 2
          comment: "« Nous sommes moins chers que les agences à Paris » est un argument prix hors offre (aucun tarif public, le prix dépend du niveau des profils) et rien ne relie l'offre au besoin senior PHP/Symfony : ni entretiens et validation des profils par le client, ni passation encadrée en cas de départ, ni références."
        closing:
          label: 'Closing / prochaine étape'
          score: 1
          comment: "Aucune prochaine étape datée ni verrouillée : le vendeur propose un email de brochure et de liste de prix, et c'est lui qui met fin à l'appel, alors que la cliente tendait une perche explicite."
