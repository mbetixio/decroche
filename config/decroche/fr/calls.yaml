    lines:
      -
        text: "Bonjour, c'est Alex Morgan d'Etixio. Merci de prendre mon appel. Avant toute chose, qu'est-ce qui vous a poussé à nous contacter cette semaine ?"
        speaker: seller
        second: 13
        voice_ms: 7805
      -
        text: "Bien sûr, Alex. Nous cherchons à ajouter deux développeurs React full-stack seniors pour une nouvelle interface que nous devons déployer début de l'année prochaine, donc j'ai demandé à Etixio un catalogue de prix pour voir comment vous vous comparez à quelques autres options que nous évaluons. Cela fait partie d'un effort plus large sur notre feuille de route de transformation digitale – j'espère aligner la bonne équipe avant la fin de l'année. D'ailleurs, j'étais en balade à vélo ce week-end, donc je suis de bonne humeur pour discuter !"
        speaker: persona
        second: 14
      -
        text: "Je vois. Et quand cela se produit aujourd'hui, qu'est-ce que cela vous coûte concrètement, en temps ou en clients ?"
        speaker: seller
        second: 15
        voice_ms: 6230
      -
        text: "Pour être honnête, le principal coût pour nous est le temps que nous passons sur la sélection – chaque semaine de retard repousse notre date de démarrage en janvier et réduit la fenêtre dont nous disposons pour respecter l'échéance de conformité. C'est pourquoi j'espère un tarif mensuel clair qui rentre dans une fourchette d'environ 45-50 k€ pour les deux développeurs React seniors, et une période d'intégration qui ne traîne pas trop. Pourriez-vous me dire à quelle vitesse vous pourriez intégrer les développeurs et à quoi ressemble le calendrier type de montée en puissance ?"
        speaker: persona
        second: 16
      -
        text: "Qui d'autre est impliqué dans la décision d'avancer sur ce sujet, et qu'auraient-ils besoin de voir ?"
        speaker: seller
        second: 16
        voice_ms: 6275
      -
        text: "Le feu vert final viendra de notre CTO, François Dupont, après un rapide coup d'œil. Il en parlera aussi à notre directrice financière, Isabelle Laurent, pour s'assurer que les chiffres sont cohérents. Ils auront besoin de voir une ventilation solide des coûts, le calendrier d'intégration et une preuve que l'équipe peut livrer à temps – surtout que nous avons cette démo de conformité prévue à la mi-février."
        speaker: persona
        second: 18
      -
        text: 'Avez-vous un budget ou une échéance en tête pour régler cela ?'
        speaker: seller
        second: 19
        voice_ms: 4565
      -
        text: "Nous avons alloué environ 70 000 € par mois pour l'ensemble de l'effort de transformation digitale, et pour les deux développeurs React seniors, nous visons à rester dans la fourchette de 45-50 k€ par mois. L'échéance clé est d'avoir la nouvelle interface de maintenance prédictive prête pour une démo à la mi-février 2027, donc nous avons besoin que l'équipe soit pleinement opérationnelle bien avant."
        speaker: persona
        second: 20
      -
        text: "Voici ce que je propose : un appel vidéo de trente minutes avec notre CTO mardi prochain à dix heures pour examiner votre configuration, et un devis écrit d'ici vendredi. Cela vous convient-il ?"
        speaker: seller
        second: 23
        voice_ms: 9380
      -
        text: "Cela me convient, mardi à dix heures c'est bien. Je m'assurerai que François soit disponible et nous serons prêts à discuter de la composition de l'équipe complète, des garanties RGPD et à voir une référence industrielle. Au plaisir."
        speaker: persona
        second: 25
    ended_by: seller
    seconds: 29
