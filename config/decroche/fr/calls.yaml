          comment: "Quatre questions ouvertes sur cinq, dont une très bonne sur la décision (« Qui d'autre est impliqué dans la décision d'avancer sur ce sujet, et qu'auraient-ils besoin de voir ? »), mais la relance « Et quand cela se produit aujourd'hui, qu'est-ce que cela vous coûte concrètement ? » porte sur un incident que le client n'a jamais décrit, et la question budget est fermée et redondante."
        listening:
          label: 'Écoute et reformulation'
          score: 3
          comment: "Trois questions directes du client restent sans réponse (« comment avez-vous accompagné d'autres entreprises SaaS françaises sur des projets IA sensibles au RGPD ? », « Avez-vous déjà mené une validation technique avec un CTO sur un projet IA similaire ? », « pourriez-vous partager une référence d'un client SaaS français… ? »), et le « Je vois » n'accuse réception de rien : le vendeur enchaîne sa question sans reformuler ce qui vient d'être dit."
