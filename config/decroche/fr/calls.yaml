    lines:
      -
        speaker: seller
        text: 'Bonjour Laurent, je suis Alex Morgan de chez Etixio. Je vous appelle suite à votre demande de devis pour deux développeurs React afin de préciser ensemble vos besoins et envisager la suite.'
        second: 3
        voice_ms: 12908
      -
        speaker: persona
        text: 'Ah, Etixio, bonjour ! J’ai bien reçu votre catalogue, merci. Écoutez, je vais être franc, on compare plusieurs pistes en ce moment, donc j’aimerais aller droit au but. Deux développeurs React, six mois, début octobre — vous pouvez me donner un ordre de grandeur du coût mensuel et le délai pour mettre l’équipe en place ?'
        second: 3
      -
        speaker: seller
        text: 'Bien sûr Laurent, avant de vous donner un chiffre précis, pouvez‑vous me dire quels sont les objectifs clés de ce projet et quels critères vous privilégiez entre coût, réactivité et proximité technique ?'
        second: 38
        voice_ms: 12908
      -
        speaker: persona
        text: 'Alors, l’objectif c’est d’accélérer notre roadmap produit côté front — on a une plateforme de streaming vidéo qui rame un peu, et un nouveau service qui doit sortir en janvier 2027. Donc le critère numéro un, c’est vraiment la qualité technique, parce qu’on a déjà été échaudés. Le coût compte, évidemment, mais je ne veux pas refaire l’erreur de prendre du low-cost.'
        second: 38
      -
        speaker: seller
        text: 'Parfait, Laurent. Pour garantir cette qualité, quelles compétences spécifiques ou expériences supplémentaires (tests, performance, streaming) attendez‑vous de ces développeurs ?'
        second: 75
        voice_ms: 7908
      -
        speaker: persona
        text: 'C’est surtout des gens solides sur React, Redux et Next.js, avec une vraie fibre performance — parce que nos lenteurs, elles sont côté front justement, sur du chargement vidéo. Nos développeurs internes sont débordés, ils n’arrivent pas à tout absorber. Vous avez des profils qui ont déjà bossé sur du streaming ou de la vidéo ?'
        second: 75
      -
        speaker: seller
        text: 'Oui, nous avons des profils ayant optimisé le front pour des plateformes vidéo. Avant d’entrer dans les détails, quel budget mensuel avez‑vous envisagé et qui décide en dernier de ce choix ?'
        second: 104
        voice_ms: 12908
      -
        speaker: persona
        text: 'Alors, la décision technique, c’est notre CTO, Sophie Morel, qui donne le feu vert. Mais le budget final, c’est le Directeur Général, Marc Dupré, qui le valide. Et il faut que ce soit bouclé d’ici le 30 novembre, donc on n’a pas des mois devant nous. Côté budget, on est sur une enveloppe globale de 45 000 euros pour les six mois.'
        second: 104
      -
        speaker: seller
        text: 'Je comprends, Laurent. Avec votre budget, on peut aligner deux profils senior : environ 8 000 €/mois, soit 48 000 € sur 6 mois, et on peut les démarrer dès début octobre. Pour affiner les profils et valider les modalités, je vous propose une visio de 30 minutes avec notre CTO — mercredi 20 novembre à 10 h ? Vous vérifiez votre agenda et me confirmez ?'
        second: 141
        voice_ms: 20985
      -
        speaker: persona
        text: 'Attendez, 8 000 euros par mois pour deux, ça fait 48 000 sur six mois, et mon enveloppe est à 45 000. Là on est au‑dessus. Et puis franchement, deux profils senior à ce tarif, c’est cohérent avec la qualité, mais je veux être sûr de ne pas payer des seniors qui n’en sont pas. Laissez‑moi vérifier mon agenda pour le 20.'
        second: 141
      -
        speaker: seller
        text: 'Je comprends, Laurent. Nous pouvons ajuster à 7 500 €/mois pour deux profils senior, tout en conservant la même expertise. Le 20 novembre à 10 h vous convient‑il ?'
        second: 186
        voice_ms: 9831
      -
        speaker: persona
        text: 'Là on est pile dans mon enveloppe, 7 500 sur six mois, ça me va. Deux secondes, je regarde mon agenda pour le 20. Ah, le 20 à 10 h je suis pris, j’ai un point avec le juridique. Vous n’auriez pas 11 h ce même jour ? Ça me laisserait juste le temps de finir.'
        second: 186
      -
        speaker: seller
        text: 'Parfait, Laurent, 11 h le 20 novembre, c’est noté ; je vous envoie immédiatement le lien de la visio avec notre CTO. À très vite !'
        second: 218
        voice_ms: 9062
      -
        speaker: persona
        text: 'Attendez, laissez‑moi vérifier que je suis bien libre à 11 h avant qu’on note quoi que ce soit.'
        second: 218
      -
        speaker: seller
        text: 'Très bien, prenez le temps de vérifier votre agenda ; dès que vous confirmez, je vous envoie le lien de la visio. Je reste à votre disposition, merci et à très vite.'
        second: 235
        voice_ms: 12523
      -
        speaker: persona
        text: 'C’est bon, 11 h je suis libre le 20. Donc on cale la visio de 30 minutes avec votre CTO à 11 h — mais attention, je veux qu’on y parle bien des profils et du suivi, hein. Et il me faudra un devis détaillé derrière.'
        second: 235
      -
        speaker: seller
        text: 'Parfait, c’est noté : visio de 30 minutes avec notre CTO le 20 novembre à 11 h. Je vous envoie le lien et le devis détaillé d’ici la fin de journée. Merci, à très bientôt !'
        second: 266
        voice_ms: 12908
      -
        speaker: persona
        text: 'Parfait, je note le 20 à 11 h. J’attends le lien et le devis, alors. Merci, à bientôt !'
        second: 266
