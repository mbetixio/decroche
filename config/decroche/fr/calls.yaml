    lines:
      -
        speaker: seller
        text: "Bonjour, c'est Alex d'Etixio, nous créons des équipes de développement dédiées. Vous avez une minute ?"
        second: 2
        voice_ms: 6120
      -
        speaker: persona
        text: "Une minute, oui, mais je vais être direct : le module de paiement n'est toujours pas en ligne, on a un bug qui casse les commandes et on perd des ventes chaque heure. J'ai envoyé un mail hier, j'attends encore une réponse sur le ticket ouvert depuis trois jours. Qu'est-ce que vous me proposez, concrètement ?"
        second: 11
      -
        speaker: seller
        text: 'Nous avons de très bons développeurs à Madagascar et à Maurice, et nous sommes moins chers que les agences à Paris. Quelle est votre situation actuelle avec vos développeurs ?'
        second: 34
        voice_ms: 10500
      -
        speaker: persona
        text: "Écoutez, le discours commercial, très peu pour moi ce matin. Je travaille avec votre équipe depuis juin, six développeurs à Antananarivo, et là un de vos seniors annonce son départ pour demain. Donc oui, je connais vos développeurs. Ce que je veux savoir, c'est ce que vous faites pour le bug et pour ce départ."
        second: 48
      -
        speaker: seller
        text: "D'accord. Concrètement, qu'est-ce que montrent vos derniers tickets ouverts sur le module de paiement, et combien de commandes sont bloquées dans vos chiffres ?"
        second: 71
        voice_ms: 9600
      -
        speaker: persona
        text: "Attendez, je regarde mes tickets. Alors, ticket critique ouvert depuis le 10, aucune réponse depuis le 12. Cent trente-sept commandes ont échoué le week-end dernier, cent pour cent des paiements par carte. Et le module qui devait être en préproduction le 6 n'y est toujours pas, trois jours de retard. Donc quand vous me parlez de bons développeurs, moi je regarde ces chiffres."
        second: 84
      -
        speaker: seller
        text: 'Je note: cent trente-sept commandes bloquées, ticket sans réponse depuis le 12, et un senior qui part demain. Je peux vous proposer un point avec notre responsable technique jeudi à 14h pour faire le bilan du bug et du remplacement, ça vous va ?'
        second: 112
        voice_ms: 14700
      -
        speaker: persona
        text: "Jeudi quatorze heures, laissez-moi vérifier. Un instant. Jeudi quatorze heures, non, j'ai un déjeuner de travail qui se prolonge, je ne serai pas dispo avant quinze heures. Mais avant de fixer quoi que ce soit, dites-moi qui vient : un commercial, ou quelqu'un qui peut vraiment engager une solution technique et un remplacement ?"
        second: 131
      -
        speaker: seller
        text: "Jeudi quinze heures alors, et ce sera notre responsable technique, pas un commercial, il pourra engager le remplacement et le plan sur le bug. En attendant, pouvez-vous m'envoyer les cent trente-sept commandes échouées avec leurs horodatages, et le nom du senior qui part, pour qu'on arrive avec une solution et pas un discours ?"
        second: 155
        voice_ms: 19740
      -
        speaker: persona
        text: "Pour les commandes, je peux faire passer l'export par mon équipe, oui. Le senior qui part, c'est Rakoto, il était sur la partie paiement justement, donc vous comprenez pourquoi je ne dors pas beaucoup en ce moment. Et il n'y a pas que le bug : la facture de ce mois-ci, mon directeur financier l'a contestée, les heures supplémentaires facturées ne correspondent pas à ce qu'on a enregistré. Il faut aussi qu'on parle de ça jeudi."
        second: 179
      -
        speaker: seller
        text: "D'accord, donc jeudi quinze heures avec notre responsable technique, et on ajoutera le point sur la facture et les heures supplémentaires contestées. Envoyez-moi l'export des cent trente-sept commandes et le nom de Rakoto d'ici jeudi, et je prépare le dossier avec la facturation. Je vous confirme le créneau par e-mail aujourd'hui."
        second: 210
        voice_ms: 19920
      -
        speaker: persona
        text: "Entendu pour jeudi quinze heures. Mais je vous préviens tout de suite : la confiance est vraiment entamée, après ce bug on se demande si l'offshore tient la qualité qu'on nous avait promise. Et le décalage horaire, ça fait trois jours qu'on attend une réponse, c'est intenable quand on a un lancement de collection de fêtes sur les bras. Vous comptez mettre quelqu'un qui parle français et qui répond vite sur notre projet ?"
        second: 235
      -
        speaker: seller
        text: "Oui, quelqu'un qui parle français et qui répond vite, c'est le minimum, et c'est ce qu'on va mettre en place. Je vous confirme donc jeudi quinze heures avec notre responsable technique, et d'ici là envoyez-moi l'export des cent trente-sept commandes et le nom de Rakoto."
        second: 266
        voice_ms: 16200
      -
        speaker: persona
        text: "Très bien, je vous envoie ça. Et jeudi, venez avec du concret, parce que la direction générale pousse pour qu'on regarde ailleurs si ça ne s'arrange pas. Un partenaire au Portugal, plus proche, on y réfléchit déjà. Donc à vous de me montrer que ça vaut la peine de continuer."
        second: 286
      -
        speaker: seller
        text: "Compris, jeudi quinze heures, et on arrive avec un plan de remplacement pour Rakoto et un point chiffré sur la facture. En attendant, envoyez-moi l'export des cent trente-sept commandes et le détail des heures supplémentaires contestées, comme ça le responsable technique vient avec du concret et pas un discours."
        second: 307
        voice_ms: 18780
      -
        speaker: persona
        text: "Entendu. Mais je veux être clair sur un point : ce n'est pas le responsable technique qui décidera, chez nous la décision finale revient à Sophie Lambert, notre directrice financière, après un avis de notre CTO. Et ils veulent trancher tout changement contractuel d'ici le vingt-quatre novembre, donc on n'a pas des semaines devant nous. Je vous envoie l'export et le détail des heures dans la matinée."
        second: 330
