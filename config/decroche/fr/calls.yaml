        text: 'Nous pouvons immédiatement mobiliser nos experts IA : un data‑scientist senior et un développeur full‑stack, à 200 €/jour chacun, pour créer votre assistant de planification dès la semaine prochaine.'
        second: 123
        voice_ms: 10985
      -
        speaker: persona
        text: 'Attendez, vous me parlez de démarrer la semaine prochaine, mais nous on est encore en pleine réflexion sur le périmètre, et puis il y a un os : mon CTO part fin décembre, donc il faut aussi quelqu’un pour prendre le relais stratégiquement. Vous faites du CTO à temps partagé, ou c’est juste du développement ?'
        second: 123
      -
