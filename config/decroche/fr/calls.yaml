    lines:
      -
        speaker: seller
        text: "Bonjour, je vous appelle de la part d'Etixio au sujet de nos équipes offshore. Nous sommes les meilleurs sur le marché, vraiment, et nous sommes bon marché. Alors, vous voulez un devis ?"
        second: 2
        voice_ms: 11160
      -
        speaker: persona
        text: "Bonjour ! Ah, c'est vous qui nous suivez côté Etixio – on travaille ensemble depuis mars 2024, je crois, avec l'équipe Java sur l'intégration ERP. Bon, \"les meilleurs et les moins chers\", je me méfie toujours un peu de cette combinaison, ça me rappelle un fournisseur qu'on avait pris pour de la tôlerie, on a passé six mois à rattraper... Bref. Un devis pour quoi, au juste ? Parce que de mon côté, ce n'est pas vraiment un devis dont j'aurais besoin en ce moment."
        second: 17
      -
        speaker: seller
        text: 'Pour être concret, vous pouvez me dire ce que montrent vos fichiers côté commandes, tickets et stock en ce moment ? Et sinon, on peut se caler un point précis jeudi à 10h pour en parler.'
        second: 50
        voice_ms: 11160
      -
        speaker: persona
        text: "Attendez, je regarde vite fait... Je vais voir mes tickets et mes journaux de pannes, mais côté commandes et stock, ce n'est pas moi, ça c'est l'affaire de Pierre. Laissez-moi une seconde. Voilà, j'ai sous les yeux nos tickets et les journaux de pannes. Pour faire court : on a un vrai souci récurrent sur les CNC, la CNC-04 nous a fait un arrêt de quatre heures et demie cette semaine, et mon équipe passe six heures par semaine à éplucher les journaux à la main. Ça, c'est mon vrai sujet du moment, pas les stocks. Jeudi à 10h, alors... laissez-moi vérifier. Ah, jeudi 10h je suis en revue budgétaire, ça va durer jusqu'à 11h. Par contre à 11h je suis libre. Mais dites-moi d'abord : qu'est-ce que vous auriez à me proposer sur ce sujet-là, concrètement ? Parce qu'un point juste pour parler, je veux bien, mais j'aimerais savoir vers quoi on va."
        second: 65
      -
        speaker: seller
        text: "Jeudi 11h, c'est parfait, on se cale comme ça. Pour être concret, nos équipes offshore peuvent reprendre l'analyse de vos journaux de pannes, comme ça votre équipe ne passe plus six heures par semaine dessus. Vous voulez un devis pour ça ?"
        second: 124
        voice_ms: 14340
      -
        speaker: persona
        text: "Attendez, jeudi 11h je vous ai dit que j'étais libre, mais je n'ai pas encore dit oui – on en reparle dans une seconde. Sur le fond : reprendre l'analyse de nos journaux, honnêtement, ce n'est pas juste une histoire de main-d'œuvre en plus. Ce qu'on veut, c'est arrêter de subir les pannes, pas juste les lire plus vite. Et puis il y a un autre sujet : notre CTO part dans un mois, et là on se retrouve un peu orphelins côté direction technique. Donc ma vraie question, c'est : vous êtes capables de nous aider sur du prédictif, avec les données de nos capteurs, ou vous nous vendez juste des bras ?"
        second: 142
      -
        speaker: seller
        text: 'On est capables, oui, on a des gens qui font du prédictif, et en plus on est vraiment moins chers que le marché. Mais pour être concret, il faudrait que je voie vos données capteurs : vous avez combien de capteurs sur la CNC-04, et sur quelle période vous avez des relevés ?'
        second: 184
        voice_ms: 16440
      -
        speaker: persona
        text: "Alors là, vous me posez une colle – le nombre exact de capteurs, je ne l'ai pas en tête, il faudrait que je demande à l'équipe. Le pilote est en cours depuis quelques mois, on a des relevés, mais c'est encore un peu le bazar, on tâtonne. Et franchement, \"moins chers que le marché\", c'est le genre de phrase qui me fait dresser l'oreille, pas dans le bon sens. On a déjà donné avec un prestataire low-cost, on a payé deux fois. Ce qui m'intéresse, moi, c'est que ça marche, et que ce soit sécurisé – on a des données de production, il y a le RGPD là-dedans. Vous êtes basés où, exactement ?"
        second: 205
      -
        speaker: seller
        text: "On est basés à Casablanca, au Maroc, et on travaille déjà avec des clients en Europe, donc le RGPD on connaît. Pour être concret sur vos capteurs, justement, il faudrait que je voie les relevés du pilote, même en bazar, pour vous dire ce qu'on peut en tirer en prédictif. Est-ce que je peux passer jeudi à 11h avec un de nos data engineers pour regarder ça ensemble ?"
        second: 247
        voice_ms: 22020
      -
        speaker: persona
        text: "Ah, Casablanca... Écoutez, je ne vais pas vous mentir, ça me refroidit un peu. Pas sur les gens, hein, mais les données hors Union européenne, c'est un vrai sujet chez nous, on a des exigences côté client. Il faudrait des garanties claires, des clauses, des accès nominatifs – enfin, vous voyez le genre. Cela dit, je ne demande qu'à être convaincue, on n'est pas fermés. Mais jeudi à 11h, je ne peux pas vous recevoir physiquement, je suis à l'atelier le matin et j'enchaîne. Vous êtes en visio, non ? Parce que moi, ce que je veux, c'est surtout comprendre comment vous attaquez le prédictif, pas encore montrer nos données à la cantonade."
        second: 274
      -
        speaker: seller
        text: 'Oui, on peut tout à fait faire ça en visio jeudi à 11h, et sur le RGPD on vous fournira les clauses et les accès nominatifs sans problème. Pour être concret, vous pouvez déjà me dire ce que vos relevés du pilote contiennent comme types de mesures, même en bazar ?'
        second: 319
        voice_ms: 15780
      -
        speaker: persona
