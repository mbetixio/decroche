  manager:
    name: 'Alex Morgan'
    profile: 'Responsable commercial depuis trois ans, je vends des équipes de développement dédiées et des audits techniques aux PME.'
  junior:
    name: 'Jordan Lee'
    email: jordan.lee@decroche.test
    profile: 'Commercial junior depuis six mois, je rappelle surtout les demandes entrantes.'
calls:
