        secret: 'Manufacturing Solutions doit livrer une démo conforme de la nouvelle interface de maintenance prédictive avant le 15 février 2027 pour satisfaire un audit de la nouvelle directive européenne sur les machines. Ce délai serré les oblige à chercher un partenaire capable de monter en puissance rapidement et éventuellement de rester pour un support continu au-delà du déploiement initial.'
        setup: "Pierre vient de recevoir le catalogue de prix d'Etixio après avoir demandé un devis pour deux développeurs React. Il compare Etixio avec une société informatique française, un groupe de freelances et un prestataire near-shore au Portugal. Il est d'humeur amicale et prêt à discuter des chiffres, mais il n'est toujours pas sûr de la forme exacte de la solution dont il a besoin."
