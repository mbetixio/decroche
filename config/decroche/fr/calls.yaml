    debrief:
      criteria:
        discovery:
          label: 'Découverte du besoin'
          score: 6
          comment: "Le vendeur a posé une bonne question d'ouverture (« Quelle est votre situation actuelle avec vos développeurs ? ») et une excellente question budget (« est-ce que dans vos dossiers de dépenses externes, il y a une date de réexamen ou un budget déjà fléché… »), mais c'est le client qui a livré spontanément le pain, le décideur, le départ du CEO et le plafond gelé, sans que le vendeur creuse."
        questions:
          label: 'Questions ouvertes'
          score: 7
          comment: 'Six questions dont cinq ouvertes, une à la fois, et la question sur le budget/réexamen est précise et fait sortir le plafond de 50 k€ et le gel T1 2027 ; mais la question « combien de tickets ouverts traînent sur la recherche IA depuis plus de trois mois ? » arrive trop tôt et fait réagir le client (« vous voulez mes chiffres internes après trois minutes de conversation ? »).'
        listening:
          label: 'Écoute et reformulation'
          score: 6
          comment: "Le vendeur rebondit correctement (« Très clair, deux seniors Symfony sur la recherche IA ») et reprend l'information du client, mais il laisse passer sans réagir des éléments majeurs livrés par Claire (départ du CEO, gel des dépenses, inquiétude du financier sur le dérapage des coûts IA)."
        objections:
          label: 'Traitement des objections'
          score: 2
          comment: "Aucune des objections n'est traitée : ni la qualité/communication offshore (le client relève lui-même « \"moins cher que Paris\", c'est votre argument de vente ? »), ni le dérapage des coûts IA (« l'IA en régie, ça peut vite filer, et c'est exactement ce qui inquiète le financier »), ni le plafond (« si votre chiffrage dépasse le plafond, ça ne passera jamais ») ; le vendeur n'utilise aucun argument réel de l'offre (profils validés par le client, leads techniques, CTO, propriété du code, RGPD/CCT, passation encadrée)."
        value:
          label: 'Proposition de valeur'
          score: 3
          comment: "La proposition de valeur se réduit à un argument prix (« nous sommes moins chers que les agences à Paris ») et à un envoi de brochure/liste de prix, sans relier l'offre au besoin exprimé (deux seniors Symfony sur la recherche IA) ni mobiliser les vrais arguments Etixio ; le format pilote 4-6 semaines est plausible mais présenté sans périmètre ni critères de recette."
        closing:
          label: 'Closing / prochaine étape'
          score: 4
          comment: "Le vendeur propose lui-même une date (« on se cale un point vidéo mardi à 14h »), acceptée par le client, mais aucune réunion n'est posée au calendrier (meetings_booked vide), pas d'invitation, pas d'ordre du jour, et le client prévient que le directeur financier ne sera probablement pas là ; l'appel se termine sans verrouillage."
      summary: "Relance téléphonique d'une proposition restée sans réponse : le vendeur obtient beaucoup d'informations (pain, décideur, budget gelé, départ du CEO) mais surtout parce que Claire les livre d'elle-même, sans creuser ni traiter les objections offshore et coûts IA. Il repart avec une intention de visio mardi 14h, non verrouillée au calendrier. Niveau junior : bon réflexe de questionnement, proposition de valeur et traitement des objections encore très faibles."
      next_step: false
      outcome: "Une visio est évoquée pour mardi 14h mais rien n'est posé au calendrier, le directeur financier n'est pas confirmé et le budget est gelé jusqu'au T1 2027 : l'affaire reste au point mort, sans engagement."
