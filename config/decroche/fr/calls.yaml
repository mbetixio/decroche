        second: 67
        voice_ms: 10985
      -
        speaker: persona
        text: 'Mouais, éprouvée , c’est ce qu’on m’avait dit la dernière fois aussi… Vous avez des exemples concrets d’agents IA que vous avez menés jusqu’en production ? Parce que là, pour nous, c’est un vrai sujet, on part de zéro côté IA.'
        second: 67
      -
        speaker: seller
        text: 'Nous avons déjà déployé un chatbot de support client en production pour une fintech, ainsi qu’un moteur de recommandation produit pour un e‑commerce, le tout avec nos CTO offshore à 200 €/jour.'
        second: 95
        voice_ms: 12523
      -
        speaker: persona
        text: 'Ça, c’est plus parlant ! Et justement, vous avez déjà fait des choses sur des dossiers patients ou de la recherche documentaire ? Nous, on a un vrai besoin d’assistant de planification, et personne en interne pour porter ça.'
        second: 95
