    lines:
      -
        speaker: seller
        text: "Bonjour Sophie, je suis Jordan Lee d'Etixio. Je vous appelle car nous aidons des PME comme Boutikify à réduire leurs coûts de développement offshore tout en gardant le contrôle du code."
        second: 4
        voice_ms: 12523
      -
        speaker: persona
        text: 'Bonjour. Écoutez, on reçoit pas mal d’appels de ce genre en ce moment. Vous avez un nom de famille à me donner, et vous appelez pour quel sujet précisément ?'
        second: 4
      -
        speaker: seller
        text: 'Je m’appelle Thomas Martin et je souhaite parler à M. Julien Lemaire, votre DSI, au sujet d’une réduction de 30 % sur vos besoins en développement full‑stack.'
        second: 29
        voice_ms: 10600
      -
        speaker: persona
        text: 'Thomas Martin, d’accord. Vous savez, le directeur est très pris en ce moment, et je ne veux pas lui faire perdre du temps avec un appel qui n’aboutit à rien. Vous avez déjà travaillé avec des PME e‑commerce de notre taille ?'
        second: 29
      -
        speaker: seller
        text: 'Oui, nous avons déjà accompagné plusieurs e‑commerces similaires ; pourriez‑vous me mettre directement en relation avec M. Lemaire, s’il vous plaît ?'
        second: 56
        voice_ms: 8292
      -
        speaker: persona
        text: 'Là, tout de suite, non : il est en rendez-vous. Et honnêtement, il y a eu plusieurs appels d’externalisation ces dernières semaines, pas toujours très agréables. Concrètement, vous proposez quoi pour nous ?'
        second: 56
      -
        speaker: seller
        text: 'Nous proposons une équipe senior offshore à 200 €/jour, code 100 % propriétaire, avec un CTO dédié ; pourriez‑vous me donner son créneau ?'
        second: 78
        voice_ms: 8292
      -
        speaker: persona
        text: 'Deux cents euros par jour… ça change des devis qu’on a reçus, on nous a proposé six cent cinquante euros la journée par une ESN française, et c’est au‑dessus de ce qu’on peut mettre. Mais justement, on a déjà été échaudés par de l’offshore : comment je sais que vos profils tiennent la route, et qu’ils ne partent pas au bout de six mois ?'
        second: 78
      -
        speaker: seller
        text: 'Je comprends vos réticences, mais sans parler directement à M. Lemaire, je ne pourrai pas détailler comment nous garantissons la qualité et la stabilité de nos équipes. Pouvez‑vous le mettre en ligne ?'
        second: 111
        voice_ms: 12908
      -
        speaker: persona
        text: 'Je comprends votre logique, mais je ne passe pas le DSI en direct comme ça, sans savoir ce que vous avez derrière. Il est débordé : entre le Black Friday et son recrutement, son planning de novembre est plein. Vous ne pouvez pas plutôt me donner deux ou trois éléments concrets, à moi ?'
        second: 111
      -
        speaker: seller
        text: 'Voici trois points concrets : nos développeurs senior ont 5‑7 ans d’expérience, ils travaillent sous la supervision d’un CTO Etixio, et le code reste 100 % propriétaire, livrable immédiatement.'
        second: 145
        voice_ms: 10600
      -
        speaker: persona
        text: 'C’est mieux. Reste que le décalage horaire, c’est souvent ce qui pose problème dans ces montages… et puis on a vraiment besoin que ça avance vite : notre site ralentit à chaque pic de vente, et on doit être prêts avant le Black Friday 2026. Vous démarrez en combien de temps, concrètement ?'
        second: 145
      -
        speaker: seller
        text: 'Je comprends l’urgence : on peut commencer sous deux semaines. Pourriez‑vous bloquer mercredi 20 novembre à 15 h pour un appel de 30 minutes avec M. Lemaire ?'
        second: 177
        voice_ms: 8292
      -
        speaker: persona
        text: 'Attendez, je vérifie son planning. Le 20 novembre, c’est un vendredi, et le DSI ne reçoit que les lundis et mercredis après 15 heures. Par contre, le mercredi 18 à 15 heures, ça peut le faire : je vois qu’il a la place. Mais avant de poser quoi que ce soit, qu’est‑ce que vous lui présentez exactement pendant ces 30 minutes ?'
        second: 177
      -
        speaker: seller
        text: 'Très bien, je vous envoie immédiatement un aperçu détaillé de notre proposition par email, afin que M. Lemaire puisse le consulter avant de fixer un créneau. Merci, bonne journée.'
        second: 209
        voice_ms: 11369
      -
        speaker: persona
        text: 'Non, ne raccrochez pas si vite. Un mail, d’accord, mais ce que je veux savoir c’est ce qui se passe pendant ces 30 minutes, sinon je ne bloque rien du tout. Vous parliez d’un CTO, de références… c’est lui qui présenterait ?'
        second: 209
