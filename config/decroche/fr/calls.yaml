    lines:
      -
        speaker: seller
        text: "Bonjour, c'est Alex Morgan d'Etixio. Merci de prendre mon appel. Avant toute chose, qu'est-ce qui vous a poussé à nous contacter cette semaine ?"
        second: 2
        voice_ms: 8640
      -
        speaker: persona
        text: "Bonjour Alex, merci de m'appeler. Eh bien, j'ai reçu votre catalogue de prix après ma demande de devis, et je suis en pleine comparaison de prestataires pour un projet de modernisation. Vous êtes sur la liste courte, disons."
        second: 14
      -
        speaker: seller
        text: "Je vois, merci pour la transparence. Concrètement, dans vos dossiers ou vos fichiers en ce moment, qu'est-ce que vous comparez exactement : les prix, les délais, les références, ou autre chose ?"
        second: 31
        voice_ms: 11640
      -
        speaker: persona
        text: "Laissez-moi jeter un œil à mon comparatif, j'ai ça sous les yeux... Alors, je compare un peu tout à la fois : une société informatique française, un groupe de freelances, un prestataire near-shore au Portugal, et vous. Les prix, mais aussi la capacité à démarrer vite, parce que le temps, c'est ce qui me manque le plus."
        second: 46
      -
        speaker: seller
        text: "Quand vous dites que le temps vous manque, concrètement, qu'est-ce que ça vous coûte aujourd'hui, en heures ou en clients ? Et sur votre comparatif, quel est le délai de démarrage que vous visez, dans vos fichiers ?"
        second: 70
        voice_ms: 12900
      -
        speaker: persona
        text: "Disons que derrière cette demande de deux développeurs React, il y a un vrai sujet : notre ERP tourne encore sur du Java Spring, et il faut lui greffer une nouvelle interface React avec de la maintenance prédictive pilotée par l'IA. Et il y a une échéance de conformité qui ne bouge pas, donc chaque semaine compte. Idéalement, je voudrais que ça démarre début janvier."
        second: 87
      -
        speaker: seller
        text: "D'accord, donc deux développeurs React avec une interface sur votre ERP Java Spring et de la maintenance prédictive, pour un démarrage début janvier : qui d'autre est impliqué dans la décision, et qu'auraient-ils besoin de voir pour valider ?"
        second: 114
        voice_ms: 14520
      -
        speaker: persona
        text: "La décision finale, c'est François Dupont, notre CTO, qui la prend, après un passage rapide chez notre directrice financière, Isabelle Laurent. Et il faut que ce soit bouclé avant fin janvier, pour une signature début février. Donc si vous voulez convaincre quelqu'un, c'est François."
        second: 133
      -
        speaker: seller
        text: 'Et avez-vous un budget ou une échéance en tête pour boucler ce choix, de votre côté ?'
        second: 154
        voice_ms: 5100
      -
        speaker: persona
        text: "Oui, on a une enveloppe globale de soixante-dix mille euros par mois pour toute la transformation digitale. Pour les deux développeurs, j'espérais rester entre quarante-cinq et cinquante mille par mois, franchement en dessous de la moyenne du marché. C'est là-dessus que vous serez jugé, entre autres."
        second: 162
      -
        speaker: seller
        text: "Voici ce que je propose : un appel vidéo de trente minutes avec notre CTO mardi prochain à dix heures pour examiner votre configuration, et un devis écrit d'ici vendredi, cela vous convient-il ?"
        second: 185
        voice_ms: 11640
      -
        speaker: persona
        text: "Attendez, mardi prochain... on est samedi, donc mardi dix-sept. Laissez-moi vérifier mon agenda, je ne voudrais pas vous dire oui pour rien. Alors ça tombe bien, dix heures mardi, je suis libre. Va pour la visio de trente minutes avec votre CTO. Par contre, avant que je m'engage, deux ou trois choses me trottent dans la tête : la composition complète de l'équipe, parce que deux développeurs seuls ne suffiront pas, il me faudra aussi un peu de QA et de DevOps. Et surtout, comment vous gérez le RGPD quand le code part à l'étranger ?"
        second: 200
      -
        speaker: seller
        text: "Parfait pour mardi dix-sept à dix heures, je vous envoie l'invitation tout de suite, pouvez-vous la mettre dans votre agenda maintenant ? Pour l'équipe et le RGPD, on en parle justement avec le CTO pendant la visio, avec un devis révisé sous quarante-huit heures après."
        second: 238
        voice_ms: 16140
      -
        speaker: persona
        text: "Bonne idée, je bloque ça tout de suite dans mon agenda. Voilà, mardi dix-sept à dix heures, c'est noté. Et pour le devis révisé sous quarante-huit heures après la visio, ça me va très bien."
        second: 258
      -
        speaker: seller
        text: "Parfait, donc c'est bien noté pour mardi dix-sept à dix heures, et je vous envoie l'invitation tout de suite. Merci pour votre temps, Pierre, et à mardi."
        second: 273
        voice_ms: 9180
      -
        speaker: persona
        text: "Parfait, merci Alex. Écoutez, j'ai une sortie vélo qui m'attend ce matin, alors je file. À mardi, et bonne journée."
        second: 286
