    lines:
      -
        speaker: seller
        text: "Bonjour, c'est Alex d'Etixio, nous constituons des équipes de développement dédiées. Vous avez une minute ?"
        second: 2
        voice_ms: 6420
      -
        speaker: persona
        text: 'Ah, Etixio ! Oui, on a eu un échange vidéo avec votre CTO il y a quelques semaines, et votre proposition est arrivée dans la foulée. Une minute, oui, allez-y – je suis samedi matin, donc plutôt détendue.'
        second: 12
      -
        speaker: seller
        text: 'Nous avons de très bons développeurs à Madagascar et à Maurice, et nous sommes moins chers que les agences à Paris. Quelle est votre situation actuelle avec vos développeurs ?'
        second: 28
        voice_ms: 10500
      -
        speaker: persona
        text: "Alors là, vous tombez bien, parce que c'est justement le point sensible. On doit accélérer sur nos nouvelles fonctionnalités de recherche immobilière avec de l'IA, et côté backend senior on est un peu à poil – mon équipe interne est déjà débordée. Mais avouez que vous attaquez fort : \"moins cher que Paris\", c'est votre argument de vente ?"
        second: 42
      -
        speaker: seller
        text: "C'est un point d'entrée, mais ce qui compte c'est le coût total d'une équipe qui livre. Concrètement, dans vos dossiers, combien de tickets ouverts traînent sur la recherche IA depuis plus de trois mois ?"
        second: 67
        voice_ms: 12240
      -
        speaker: persona
        text: "Oh, vous voulez mes chiffres internes après trois minutes de conversation ? Joli culot, j'aime bien. Mais je vais vous répondre honnêtement : sur la recherche, on n'a pas des tickets qui traînent, on a surtout un manque de bras pour les prendre, justement. Deux seniors Symfony, ça changerait la donne."
        second: 83
      -
        speaker: seller
        text: "Très clair, deux seniors Symfony sur la recherche IA, c'est exactement le profil qu'on place. Je peux vous envoyer notre brochure et une liste de prix par email, et on se cale un point vidéo mardi à 14h pour regarder vos maquettes et le périmètre."
        second: 106
        voice_ms: 14820
      -
        speaker: persona
        text: "Là, mardi 14 heures, laissez-moi vérifier mon agenda, parce que je ne veux pas vous dire oui à la légère. Mardi 14 heures, c'est libre, ça marche pour moi. Mais avant qu'on se lance dans la vidéo, il faut que je vous dise un truc : chez nous, en ce moment, rien ne se signe sans un pilote court et sans l'aval de deux personnes. Vous êtes prêt à ce genre de discussion ?"
        second: 125
      -
        speaker: seller
        text: "Oui, un pilote court, c'est justement comme ça qu'on démarre d'habitude : deux seniors Symfony sur un lot précis de la recherche IA, quatre à six semaines, avec des points hebdomadaires. Pour préparer le point de mardi 14h, dites-moi juste combien de lots ou d'écrans de recherche vous avez déjà cadrés dans vos specs, et qui sont les deux personnes dont l'aval est nécessaire."
        second: 152
        voice_ms: 22620
      -
        speaker: persona
        text: "Les deux personnes, c'est notre directrice financière par intérim et notre CEO – enfin, elle est en congé maternité en ce moment, donc disons surtout le directeur financier, qui veut voir un pilote avant de s'engager plus loin. Et pour vos lots, je ne vais pas vous sortir un chiffre au hasard un samedi matin : c'est justement le genre de chose qu'on regarde ensemble mardi."
        second: 180
      -
        speaker: seller
        text: "Très bien, on gardera le chiffre pour mardi 14h alors, avec le directeur financier dans la boucle si possible. En attendant, je vous envoie la brochure et une liste de prix par email aujourd'hui, et vous me direz d'ici là si le pilote de quatre à six semaines vous paraît le bon format."
        second: 207
        voice_ms: 17160
      -
        speaker: persona
        text: "Attention, ne comptez pas trop sur la présence du directeur financier mardi – il est plutôt du genre à vouloir d'abord une révision des prix avant de s'asseoir à une table. Et franchement, il faut que je vous le dise : il y a deux semaines, le CEO qui portait le sujet offshore est parti, donc tout ce qui touche aux nouvelles dépenses externes est un peu en pause. Ça ne m'empêche pas d'avancer, mais je préfère que vous le sachiez."
        second: 229
      -
        speaker: seller
        text: "Merci de me le dire, c'est important de le savoir avant mardi. Du coup, est-ce que dans vos dossiers de dépenses externes, il y a une date de réexamen ou un budget déjà fléché pour la recherche IA, ou est-ce que tout est gelé jusqu'à nouvel ordre ?"
        second: 260
        voice_ms: 14880
      -
        speaker: persona
        text: "Alors, pour être franche : on a un plafond autour de cinquante mille euros par mois pour l'ingénierie externe, mais il est gelé jusqu'au début du premier trimestre 2027, le temps que le conseil d'administration valide. Donc oui, \"gelé\", c'est le mot. Ceci dit, un pilote court bien cadré, ça peut se défendre comme une exception – c'est là que vous avez une carte à jouer."
        second: 279
      -
        speaker: seller
        text: "Un pilote court, c'est justement l'exception qu'on peut défendre ensemble devant votre directeur financier, avec un périmètre et un prix fixes. On garde donc mardi 14h, et je vous envoie la brochure et une liste de prix par email aujourd'hui, avec une option pilote quatre à six semaines chiffrée pour ce plafond."
        second: 306
        voice_ms: 18780
      -
        speaker: persona
        text: "Ça me va, mardi 14 heures. Mais je vous préviens tout de suite : si votre chiffrage dépasse le plafond, ça ne passera jamais, même en pilote. Envoyez-moi aussi une estimation du temps passé, parce que l'IA en régie, ça peut vite filer, et c'est exactement ce qui inquiète le financier."
        second: 329
