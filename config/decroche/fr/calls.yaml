    lines:
      -
        speaker: seller
        text: "Bonjour, c'est Alex Morgan d'Etixio. Merci de prendre mon appel. Avant toute chose, qu'est-ce qui vous a poussé à nous contacter cette semaine ?"
        second: 2
        voice_ms: 8640
      -
        speaker: persona
        text: "En fait, c'est surtout le timing qui me pousse : je supervise le déploiement de notre nouvelle plateforme d'apprentissage pour le semestre d'automne, et mon équipe interne est trop juste pour livrer à temps le module de notation basé sur l'IA. Donc je regarde un peu ce qui existe côté renfort. Et vous, Alex, vous êtes plutôt du côté commercial ou technique chez Etixio ?"
        second: 14
      -
        speaker: seller
        text: "Je suis côté commercial, mais je travaille main dans la main avec notre équipe technique. Quand vous dites que votre équipe est trop juste pour livrer à temps, concrètement, qu'est-ce que vos plannings ou vos tickets internes montrent aujourd'hui sur ce module de notation ?"
        second: 41
        voice_ms: 16440
      -
        speaker: persona
        text: "Laissez-moi regarder, deux secondes… Donc sur le module de notation, on a deux développeurs en interne, et la charge backend plus l'IA, c'est clairement trop : la date de septembre ne tient pas si on reste comme ça. Le reste de la plateforme avance, c'est vraiment ce module-là qui coince. Vous faites de l'IA souvent, ou c'est un sujet récent chez vous ?"
        second: 62
      -
        speaker: seller
        text: "L'IA, c'est un sujet sur lequel on travaille régulièrement, donc on peut vous aider sur ce module. Et quand ce décalage de septembre arrive, qu'est-ce que cela vous coûte concrètement, en étudiants ou en image ?"
        second: 88
        voice_ms: 12660
      -
        speaker: persona
        text: "Concrètement, on annonce la plateforme pour la rentrée, donc les étudiants et les formateurs comptent dessus : si la notation intelligente n'est pas là, on ouvre avec un module incomplet et on prend un coup sur notre crédibilité, alors qu'on est justement en train de nous positionner sur l'IA pédagogique. Et puis il y a l'audit de confidentialité en cours côté régulateur, donc tout ce qu'on met en place doit être carré sur le RGPD. C'est pour ça que je suis prudent avant de faire appel à de l'offshore."
        second: 105
      -
        speaker: seller
        text: "Je comprends, et le RGPD est un point sur lequel on est très stricts, donc on vous fournira la documentation nécessaire. Qui d'autre, en interne ou côté régulateur, est impliqué dans la décision de la manière dont vous avancez sur ce module, et de quoi auraient-ils besoin pour valider un prestataire ?"
        second: 141
        voice_ms: 18120
      -
        speaker: persona
        text: "Alors moi je décide en dernier ressort, mais mon directeur financier doit donner son aval, donc il lui faut une vision claire des risques et du coût. Le régulateur, lui, n'est pas dans la décision, mais son audit rend la conformité non négociable. Vous avez des références dans le monde de la formation ou de l'edtech ?"
        second: 164
      -
        speaker: seller
        text: 'Oui, on a des références en edtech, je pourrai vous les partager. Avez-vous un budget ou une échéance en tête pour résoudre cela, et de quoi votre directeur financier aurait-il besoin côté chiffres ?'
        second: 188
        voice_ms: 11940
      -
        speaker: persona
        text: "Côté chiffres, disons que j'ai une enveloppe d'environ quatre-vingt mille euros par an pour jusqu'à trois développeurs seniors, et le directeur financier veut rester sous les quatre-vingt-dix mille sur les douze prochains mois. Donc tout ce qui est au-delà, ça ne passera pas. Vous facturez comment, concrètement ?"
        second: 204
      -
        speaker: seller
        text: "Nous facturons au forfait projet ou en régie selon ce qui vous arrange, et je vous mettrai tout ça par écrit. Voici ce que je propose : un appel vidéo de trente minutes avec notre CTO mardi prochain à dix heures pour examiner votre configuration, et une estimation écrite d'ici vendredi. Cela vous convient-il ?"
        second: 227
        voice_ms: 18660
      -
        speaker: persona
        text: "Attendez, deux points avant de dire oui. Vous parliez d'un audit technique et d'une grille tarifaire : c'est ce qui m'aiderait vraiment à décider, parce que je veux comprendre comment vous travaillez avant de m'engager sur un créneau. Et sur le RGPD comme sur la propriété du code, j'ai besoin d'être rassuré noir sur blanc, surtout avec l'audit en cours. Alors mardi dix heures, ça ne va pas tomber, j'ai déjà un point avec notre partenaire UI/UX à Maurice sur les maquettes. Mais à onze heures je suis libre, si ça vous va. Vous me confirmez que l'audit flash et la grille tarifaire arrivent bien, et on cale la visio avec votre CTO."
        second: 250
      -
        speaker: seller
        text: "Oui, l'audit flash et la grille tarifaire vous arriveront avant la visio, et on cale donc mardi à onze heures avec notre CTO. Pouvez-vous poser le créneau dans votre agenda maintenant, pendant que je bloque le nôtre de mon côté ? Parfait, je vous envoie la confirmation et l'estimation écrite d'ici vendredi, merci et bonne journée."
        second: 295
        voice_ms: 19920
      -
        speaker: persona
        text: "Je vérifie mon agenda… mardi à onze heures c'est bon, je pose le créneau tout de suite. Et je compte donc sur l'audit flash et la grille tarifaire avant la visio. Merci Alex, bonne journée à vous aussi. C'est posé : mardi 17 à onze heures, trente minutes avec votre CTO. Je note aussi que l'audit flash et la grille tarifaire me parviennent avant, et l'estimation écrite d'ici vendredi. Merci Alex, à mardi."
        second: 320
