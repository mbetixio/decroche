    lines:
      -
        speaker: seller
        text: "Bonjour, c'est Alex Morgan d'Etixio. Merci de prendre mon appel. Avant toute chose, qu'est-ce qui vous a poussé à nous contacter cette semaine ?"
        second: 2
        voice_ms: 8640
      -
        speaker: persona
        text: "Bonjour. Alors là, petite précision : c'est vous qui m'appelez, je n'ai rien sollicité de mon côté. Vous avez peut-être une entrée inbound qui vient d'ailleurs. Qu'est-ce qui vous fait croire qu'on vous a contactés ?"
        second: 14
      -
        speaker: seller
        text: "Vous avez raison, autant pour moi, c'est bien moi qui vous appelle. En fait, on a vu que des équipes comme la vôtre perdent du temps à ressaisir des commandes entre deux outils, et je voulais vérifier si c'est quelque chose que vous vivez aussi. Concrètement, quand vous regardez vos derniers fichiers de commandes ou vos tickets, qu'est-ce que ça montre ?"
        second: 31
        voice_ms: 21360
      -
        speaker: persona
        text: "Honnêtement, la saisie entre deux outils, ce n'est pas franchement notre sujet en ce moment. Là, on est en pleine semaine de planification stratégique, donc je suis un peu partout sauf sur ce genre de détail. Vous travaillez sur quoi exactement chez Etixio ?"
        second: 57
      -
        speaker: seller
        text: "Chez Etixio, on aide les équipes à connecter leurs outils pour éviter les doubles saisies, mais je comprends que ce n'est pas votre priorité cette semaine. Du coup, qu'est-ce qui figure en haut de votre liste pendant cette planification stratégique ?"
        second: 77
        voice_ms: 15000
      -
        speaker: persona
        text: "Ce qui est en haut de la liste, c'est surtout de tenir nos échéances produit sans exploser les coûts. On a pas mal de chantiers techniques en parallèle et une équipe interne déjà bien chargée. Mais avant d'aller plus loin, vous faites quoi précisément, vous ? Du développement, de l'intégration ?"
        second: 96
      -
        speaker: seller
        text: "On fait de l'intégration et de la connexion d'outils, concrètement on branche vos systèmes pour que les données circulent sans ressaisie. Et quand vous dites tenir vos échéances sans exploser les coûts, qu'est-ce que vos derniers suivis de chantiers ou vos chiffres montrent là-dessus ?"
        second: 118
        voice_ms: 17160
      -
        speaker: persona
        text: "Attendez, je vous arrête tout de suite. Vous me parlez de connexion d'outils, mais il me semblait qu'Etixio, c'est plutôt du développement offshore et de l'intégration d'IA. Vous êtes sûr d'être sur le bon créneau ? Parce que là, ça ne colle pas avec ce que j'ai en tête."
        second: 140
      -
        speaker: seller
        text: "Je comprends la confusion, on fait effectivement du développement et de l'IA, et la connexion d'outils fait partie de ce qu'on met en place. Mais restons sur votre sujet : quand vous dites tenir vos échéances sans exploser les coûts, qu'est-ce que vos derniers suivis de chantiers ou vos chiffres montrent concrètement ?"
        second: 161
        voice_ms: 19200
      -
        speaker: persona
        text: "Là, je ne vais pas vous ouvrir nos suivis de chantiers comme ça au téléphone, un samedi matin. Ce que je peux vous dire, c'est qu'on a une migration technique en cours et un projet d'IA à préparer, et que la vraie difficulté, c'est de trouver des profils seniors sur ces sujets. Vous, sur l'IA et les microservices, qu'est-ce que vous savez vraiment faire ?"
        second: 185
      -
        speaker: seller
        text: "Sur l'IA et les microservices, on a des profils seniors qui ont déjà livré ce type de migration, et je peux vous le prouver plutôt que vous le raconter. Est-ce que mardi à dix heures un appel vidéo de trente minutes avec notre CTO vous irait pour regarder votre migration en cours ?"
        second: 211
        voice_ms: 16920
      -
        speaker: persona
        text: "C'est vrai que le sujet des profils seniors en IA, on le sent bien chez nous, l'équipe interne est déjà saturée par le refactoring du monolithe. Mais avant de bloquer un créneau, je veux comprendre deux ou trois choses. Vos équipes, elles sont basées où exactement ?"
        second: 232
      -
        speaker: seller
        text: "Nos équipes sont basées en Europe de l'Est et au Maghreb, avec des profils seniors qui ont déjà mené ce type de refactoring de monolithe. Est-ce que mardi à dix heures un appel vidéo de trente minutes avec notre CTO vous irait pour regarder votre migration en cours ?"
        second: 252
        voice_ms: 16020
      -
        speaker: persona
        text: "Hmm, Europe de l'Est et Maghreb... ce n'est pas tout à fait l'image que j'avais d'Etixio, moi j'avais plutôt en tête Madagascar, Maurice, ce genre de choses. Vous êtes sûr de la localisation ? Parce que c'est un point qui compte pour nous, la conformité et la proximité, ça se joue là-dessus."
        second: 272
      -
        speaker: seller
        text: "Je comprends, et je préfère être précis plutôt que de vous laisser un doute : nos équipes sont bien en Europe de l'Est et au Maghreb, et on peut vous fournir les détails de conformité par écrit. Est-ce que mardi à dix heures un appel vidéo de trente minutes avec notre CTO vous irait pour clarifier ce point et regarder votre migration ?"
        second: 294
        voice_ms: 20220
      -
        speaker: persona
