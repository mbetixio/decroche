          comment: "Le vendeur fait sortir le budget (150 k€, plafond 30 k€/mois), l'échéance (T1 2027, décision fin février 2027) et les décideurs (Laura Benoît, Marc Dubois), mais uniquement parce qu'Alexandre les donne de lui-même, et il ne découvre ni l'existant (POC en cours chez un concurrent), ni la douleur réelle (manque d'expertise senior IA/microservices, équipe interne saturée)."
        questions:
