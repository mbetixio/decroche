    lines:
      -
        text: "Bonjour, c'est Alex d'Etixio, nous créons des équipes de développement dédiées. Vous avez une minute ?"
        speaker: seller
        second: 0
        voice_ms: 5915
      -
        text: "Écoutez, le module de paiement est toujours en panne, les commandes échouent, un de vos développeurs seniors part demain, et nous attendons depuis trois jours une réponse au ticket concernant le bug. En plus, la dernière facture montre des heures supplémentaires que nous n'avons jamais approuvées. Quel plan concret avez-vous pour régler ça tout de suite ?"
        speaker: persona
        second: 1
      -
        text: 'Nous avons de très bons développeurs à Madagascar et à Maurice, et nous sommes moins chers que les agences à Paris.'
        speaker: seller
        second: 1
        voice_ms: 6500
      -
        text: "Nous avons mis de côté 150 000 € pour l'équipe dédiée sur les trois prochains mois, et j'exige une réduction de 10 000 € sur la facture contestée, plus aucune facturation d'heures supplémentaires à l'avenir. Pouvez-vous vous engager à mettre un remplaçant senior sur le projet dès demain et à affecter un chef de projet francophone qui nous donnera des nouvelles quotidiennes ?"
        speaker: persona
        second: 5
      -
        text: 'Quelle est votre situation actuelle avec vos développeurs ?'
        speaker: seller
        second: 5
        voice_ms: 4340
      -
        text: "Actuellement, nous avons une équipe de six personnes à Antananarivo – quatre seniors et deux juniors – qui travaille sur la refonte du tunnel de paiement. Depuis la semaine dernière, un bug critique fait planter les commandes, et nous attendons depuis trois jours une réponse. Pour couronner le tout, un des développeurs seniors a annoncé qu'il partait demain, donc nous perdons une expertise clé au moment où nous en avons le plus besoin. Le décalage horaire ralentit tout, et avec le lancement de la collection de fêtes le 1er décembre, nous ne pouvons plus nous permettre de retards. Pouvez-vous mettre en place un remplaçant senior dès demain et nous donner un chef de projet francophone qui fournira des points quotidiens ?"
        speaker: persona
        second: 7
      -
        text: 'OK. Je peux vous envoyer notre brochure et une liste de prix par e-mail.'
        speaker: seller
        second: 7
        voice_ms: 4610
      -
        text: "Une brochure et une liste de prix ne nous aideront pas maintenant – nous avons besoin d'un plan d'action concret. Quand pouvez-vous intégrer un nouveau développeur senior, et qui sera le chef de projet francophone responsable des points quotidiens ? Gardez à l'esprit que notre directeur financier, Sophie Lambert, prendra une décision finale d'ici le 24 novembre, donc nous devons résoudre cela immédiatement."
        speaker: persona
        second: 8
    ended_by: seller
    seconds: 8
