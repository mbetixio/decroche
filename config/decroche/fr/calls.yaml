          why: "Pitch prix d'entrée non relié au besoin, qui déclenche la défiance du client (« \"moins cher que Paris\", c'est votre argument de vente ? ») et n'utilise aucun argument réel de l'offre."
          better: "« Vous m'avez dit manquer de seniors backend sur la recherche IA : chez Etixio, vous voyez les profils, vous les interviewez et vous validez chaque arrivée, encadrés par des leads techniques et un CTO — et le code comme les dépôts restent chez vous. C'est ce qui a rassuré des équipes comme Gorilla eSIM. »"
