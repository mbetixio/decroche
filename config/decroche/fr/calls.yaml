          comment: "Le créneau de mercredi 11 h est verbalisé et accepté, mais c'est le client qui a proposé l'heure après avoir consulté son agenda, et aucune invitation n'a été envoyée (meetings_booked vide) : la prochaine étape n'est pas verrouillée."
