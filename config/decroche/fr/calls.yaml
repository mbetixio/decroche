          score: 0
          comment: "Aucune prochaine étape : pas de date, pas de créneau, pas de réunion réservée, et c'est le vendeur qui raccroche le premier alors que le client venait de donner le nom du décideur et la date du 24 novembre."
      summary: "Appel de réclamation traité comme une prospection à froid : le vendeur se présente, vante le coût de l'offshore, propose une brochure, et laisse le client formuler seul ses exigences (remplaçant senior, chef de projet francophone, remise de 10 000 €) sans y répondre. Le client a tout donné — budget, décideur, date de décision, échéance de lancement — et repart sans plan ni rendez-vous. Niveau très faible, en dessous des trois appels précédents."
      next_step: false
      outcome: "Le client, toujours en colère et sans réponse sur le remplaçant, la facture et le chef de projet, repart avec la perspective d'une brochure par e-mail et une décision interne au 24 novembre qu'Etixio n'a pas cherché à cadrer."
      result: 'Réclamation urgente transformée en envoi de brochure, zéro engagement, zéro rendez-vous'
      objectives:
        -
          objective: "Apaiser la colère sans faire d'excuses, en reconnaissant l'impact sur leur activité."
          status: missed
          evidence: "Le vendeur n'a jamais reconnu l'impact : aucune mention des commandes qui échouent, des ventes perdues ni du lancement du 1er décembre ; il enchaîne sur « nous sommes moins chers que les agences à Paris »."
        -
          objective: 'Comprendre le vrai problème, y compris les aspects techniques, de communication et de facturation.'
          status: partial
          evidence: "Le client expose lui-même le bug bloquant, le départ du senior, les trois jours sans réponse et les heures supplémentaires non approuvées, mais le vendeur ne creuse aucun des trois aspects et n'obtient aucune information supplémentaire."
        -
          objective: "Obtenir un accord sur un plan d'action concret (remplacement du développeur, chef de projet dédié, correction de la facture) et planifier une réunion de suivi avec le CTO."
          status: missed
          evidence: "Le vendeur propose « notre brochure et une liste de prix par e-mail », ne s'engage sur rien et ne fixe aucune réunion ; le client doit lui-même rappeler que Sophie Lambert décide le 24 novembre."
      goal: partial
      missed:
        -
          section: secret
          what: "L'évaluation en cours d'un partenaire near-shore au Portugal, moins cher et plus proche, et la pression du COMEX à la réduction des coûts"
          how: "« À part nous, qui regardez-vous en ce moment pour ce type de projet, et qu'est-ce qui ferait pencher la balance ? »"
        -
          section: objections
          what: "Le fond de l'objection de confiance (« nous avons perdu confiance dans la qualité offshore après ce bug ») et celle du décalage horaire, jamais traitées"
          how: "« Qu'est-ce qui vous a le plus inquiété dans la façon dont ce bug a été géré : la détection, la vitesse de réponse ou la transparence ? »"
      best:
        -
          quote: 'Quelle est votre situation actuelle avec vos développeurs ?'
          why: "Seule question ouverte de l'appel, elle laisse le client dérouler son contexte et fait sortir l'équipe de six, les quatre seniors, le bug et l'échéance du 1er décembre."
      worst:
        -
          quote: 'OK. Je peux vous envoyer notre brochure et une liste de prix par e-mail.'
          why: "Réponse hors sujet à une réclamation : le client a demandé deux fois un plan concret, et il rejettera explicitement la brochure juste après ; c'est aussi un catalogue non demandé, alors qu'aucun tarif public n'existe."
          better: '« Je note trois choses : le bug bloquant, le départ du senior et la facture. Voici ce que je peux engager tout de suite : une passation encadrée avec documentation et remplacement organisé, un lead technique identifié côté Etixio, et une visio de 30 minutes avec notre CTO pour cadrer le plan et le chiffrage — je vous propose demain 9 h ou 14 h. »'
        -
          quote: 'Nous avons de très bons développeurs à Madagascar et à Maurice, et nous sommes moins chers que les agences à Paris.'
          why: "Argument prix et autosatisfaction face à un client qui perd des ventes et vient de dire qu'il a perdu confiance dans la qualité offshore ; la compétitivité affichée n'est étayée par rien et ne répond à aucune des trois objections."
          better: "« Vous perdez des commandes, c'est le sujet. Sur ce type d'incident, notre process est : revue de code systématique, tests automatisés, intégration continue, alertes écrites sur les risques de délai, et un lead technique responsable devant vous. Je vous propose qu'on regarde ensemble ce qui a manqué sur ce bug. »"
      tips:
        - "Ouvrez sur le dossier, pas sur votre pitch : « J'ai lu votre mail de ce matin, je prends le bug de paiement et le départ du développeur comme prioritaires » — et reconnaissez l'impact (commandes perdues, lancement du 1er décembre) avant toute autre chose."
        - "Traitez chaque objection au moment où elle tombe, avec un argument réel de l'offre : départ d'un développeur = documentation, passation encadrée et remplacement organisé ; décalage horaire = relais entre les sites (Maurice, Vietnam) et points réguliers ; facture = décision commerciale à valider, sans promettre de gratuité ni de remise que vous ne pouvez pas accorder."
        - "Ne raccrochez plus jamais sans date : c'est la troisième fois. Ici, la sortie naturelle était la visio de 30 minutes gratuite avec le CTO, proposée avec deux créneaux précis et verrouillée avant le 24 novembre, date de décision de Sophie Lambert."
