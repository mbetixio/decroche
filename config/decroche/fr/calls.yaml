        - "Préparer le pilote comme une exception budgétaire défendable : chiffrer un lot court sous le plafond de 50 k€/mois, avec prix ferme et critères de recette, et proposer d'inclure le directeur financier dans un point dédié — c'est lui qui bloque, pas Claire."
