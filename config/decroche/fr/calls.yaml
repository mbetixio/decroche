        text: 'Bonjour Camille, c’est Alex Morgan d’Etixio, je reviens vers vous après votre TMA réussie pour vous présenter nos équipes IA et CTO offshore qui pourraient accélérer votre projet SmartPlanner.'
        second: 6
        voice_ms: 11754
      -
        speaker: persona
        text: 'Ah, Etixio ! Quel plaisir de vous entendre, on a vraiment été contents du travail sur la facturation, l’équipe a été au top jusqu’au bout. Là je suis en plein brainstorming sur notre assistant IA, justement, alors vous tombez plutôt bien. Vous avez quoi en tête concrètement ?'
        second: 6
