        text: 'Nous avons justement un CTO offshore à mi‑temps, 200 €/jour, qui peut prendre la relève dès que votre CTO part, et lancer le développement de SmartPlanner immédiatement.'
        second: 156
        voice_ms: 10600
      -
        speaker: persona
        text: 'Là, ça commence à m’intéresser sérieusement. Mais je vais être franche : le décalage horaire avec Madagascar, ça me fait un peu peur pour le quotidien, on a besoin de réactivité sur ce genre de sujet. Comment vous gérez ça concrètement ?'
