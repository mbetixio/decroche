        - Début souhaité : début octobre 2026.
        - Nous comparons plusieurs prestataires (ESN française, freelances, near‑shore) et aimerions connaître le coût mensuel moyen ainsi que le délai de mise en place d’une équipe dédiée.

        Merci de nous transmettre votre catalogue de prix et, idéalement, de programmer un échange téléphonique de 15 min pour discuter plus en détail.

        Cordialement,
        Laurent
        Responsable Produit, MédiasCo
