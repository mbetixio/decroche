      material: |-
        Proposition Etixio – 2026‑11‑07
        Client : AssurTech, 120 salariés, Strasbourg (secteur assurance)
        Objet : Accompagnement technique offshore

        1️⃣ Équipe dédiée – 7 développeurs full‑stack (Symfony / React) – 4 800 € / mois / personne
           - Profil senior + 2 mid‑level, 2 juniors (francophones, Madagascar)
           - Gestion de projet assurée par notre Lead Technique (Paris)
           - Possibilité d’ajustement (± 2 personnes) chaque trimestre

        2️⃣ Projet en régie – Modernisation du moteur de calcul tarifaire (Java / Spring) – 215 € / jour / développeur
