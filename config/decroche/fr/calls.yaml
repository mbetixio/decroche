        setup: "Alexandre sait qu'Etixio propose des services de développement offshore et a entendu parler de leurs capacités en IA, mais il se méfie des appels commerciaux qui n'apportent pas de valeur concrète. Il jongle actuellement avec un agenda chargé en raison de la semaine de planification stratégique du DSI."
