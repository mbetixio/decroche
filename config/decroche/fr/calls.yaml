    lines:
      -
        text: "Bonjour, c'est Alex Morgan d'Etixio. Merci de prendre mon appel. Avant toute chose, qu'est-ce qui vous a poussé à nous contacter cette semaine ?"
        speaker: seller
        second: 9
        voice_ms: 7805
      -
        text: "Nous avons en fait été recommandés par Julien Goumet – il a mentionné que vous aviez fait du solide travail sur une plateforme bancaire et pensait que vous pourriez être un bon match pour nous. Nous sommes en train de déployer une nouvelle plateforme d'apprentissage en ligne pour le semestre d'automne et avons besoin d'accélérer le backend, en particulier un module de notation d'évaluation basé sur l'IA que notre équipe de deux personnes ne peut pas préparer à temps. Comment structurez-vous généralement une équipe pour gérer un backend ciblé et urgent ?"
        speaker: persona
        second: 13
      -
        text: "Je vois. Et quand cela se produit aujourd'hui, qu'est-ce que cela vous coûte concrètement, en temps ou en clients ?"
        speaker: seller
        second: 15
        voice_ms: 6230
      -
        text: "Actuellement, nous envisageons environ un sprint de trois mois pour préparer le module de notation IA – si nous manquons cette fenêtre, nous devrons reporter le lancement au semestre suivant, ce qui signifierait perdre une partie de nos inscriptions et de nos revenus. Nous avons mis de côté environ 80 000 € pour l'année prochaine afin de faire appel à jusqu'à trois développeurs seniors ou une prestation équivalente en régie. Gardez-vous généralement l'équipe offshore dans le même fuseau horaire pour la planification des sprints, ou comment gérez-vous la coordination entre les sites ?"
        speaker: persona
        second: 17
      -
        text: "Qui d'autre est impliqué dans la décision de la manière dont vous avancez sur ce sujet, et de quoi auraient-ils besoin ?"
        speaker: seller
        second: 19
        voice_ms: 6275
      -
        text: "La seule autre personne que je dois convaincre est notre directeur financier – il examinera l'aspect financier et l'évaluation des risques, donc je devrai présenter une ventilation claire des coûts, un plan d'atténuation pour toute préoccupation liée au RGPD ou à la sécurité, et des preuves que la propriété du code restera à 100 % chez nous. Quel type de documentation ou d'audit fournissez-vous habituellement pour donner ce genre d'assurance ?"
        speaker: persona
        second: 23
      -
        text: 'Avez-vous un budget ou une échéance en tête pour résoudre cela ?'
        speaker: seller
        second: 23
        voice_ms: 4565
      -
        text: 'Nous avons alloué environ 80 000 € pour les douze prochains mois afin de faire appel à des talents backend seniors ou une prestation équivalente en régie, et le directeur financier veut garder les dépenses sous 90 k€. Idéalement, nous aimerions verrouiller le bon partenaire dans les quatre prochaines semaines pour pouvoir atteindre le lancement de septembre sans retarder le semestre. Avez-vous un délai typique pour un audit technique et un plan de remédiation ?'
        speaker: persona
        second: 24
      -
        text: "Voici ce que je propose : un appel vidéo de trente minutes avec notre CTO mardi prochain à dix heures pour examiner votre configuration, et une estimation écrite d'ici vendredi. Cela vous convient-il ?"
        speaker: seller
        second: 24
        voice_ms: 9380
      -
        text: "Cela me convient – je serai prêt pour l'appel vidéo mardi prochain à dix heures, et je surveillerai l'estimation vendredi. Je m'assurerai que notre directeur financier ait les documents à l'avance. À bientôt."
        speaker: persona
        second: 25
