        value:
          label: 'Proposition de valeur'
          score: 3
          comment: "La valeur est restée générique (« renforcer leurs équipes tech : développeurs dédiés ou audits ») sans lien avec l'ERP lent ni avec l'audit flash, et surtout deux promesses hors offre : un « premier chiffrage détaillé d'ici la visio » (l'offre ne prévoit qu'un catalogue de prix sous 24 h ouvrées sur demande, puis un ordre de grandeur après la visio CTO) et un « guide RGPD » qui n'existe pas dans l'offre."
        closing:
