        setup: "Pierre vient de recevoir le catalogue de prix d'Etixio après avoir demandé un devis pour deux développeurs React. Il compare Etixio avec une société informatique française, un groupe de freelances et un prestataire near-shore au Portugal. Il est d'humeur amicale et prêt à discuter des chiffres, mais il n'est toujours pas sûr de la forme exacte de la solution dont il a besoin."
