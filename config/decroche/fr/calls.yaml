# L'équipe d'exemple et ses appels débriefés, chargés par `app:install --demo` : l'accueil, la progression, la vue
# équipe et les statistiques MCP ont de quoi s'afficher dès le départ. Les dates comptent à rebours depuis l'installation
# (days_ago), les répliques depuis le début de l'appel (second). Les débriefs sont stockés tels que le coach les a écrits.
# "manager" est le manager créé par l'installation (adresse et mot de passe donnés à l'installation), les autres des commerciaux.
