  -
    seller: manager
    days_ago: 6
    scenario:
      title: 'Appel de recommandation – Exploration du support offshore pour SavoirPlus'
      type: discovery
      difficulty: 2
      minutes: 10
      context: "Vous appelez un CTO à Bordeaux qui vous a été recommandé par un client satisfait d'Etixio. Vous avez un créneau de découverte de 30 minutes prêt, et vous devez tirer parti de la recommandation tout en découvrant d'éventuels besoins cachés."
      goal: "Identifier un besoin concret de développement offshore ou d'audit et obtenir une réunion de suivi."
      objectives:
        - 'Mentionner la recommandation sans trop insister sur la connexion'
        - "Découvrir le véritable goulot d'étranglement du développement du client et son intérêt pour l'intégration de l'IA"
        - "Convenir d'une prochaine étape concrète (par exemple, planifier une découverte technique de 30 minutes avec leur CTO et recevoir une estimation tarifaire indicative)"
      material: |-
        Bonjour Marc,

        J'espère que vous allez bien. Je voulais vous remercier à nouveau pour le travail fantastique que votre équipe à Madagascar a réalisé sur notre plateforme bancaire – la qualité du code et les délais étaient exactement ce dont nous avions besoin.

        J'ai discuté avec mon ancien collègue Camille Legrand, CTO chez SavoirPlus, une entreprise de taille moyenne dans le secteur de l'edtech à Bordeaux. Ils cherchent à augmenter leur capacité de développement pour une prochaine version produit et je pensais que vous pourriez être un bon match.

        Si vous avez besoin de plus de détails ou d'une brève présentation, faites-le moi savoir.

        Cordialement,

        Julien Goumet
        PDG, Etixio
      persona:
        name: 'Camille Legrand'
        role: 'Directeur technique'
        company: 'SavoirPlus, Formation & EdTech, 120 employés, Bordeaux'
        personality: "Camille est amical et curieux, demandant toujours « comment ça marche ? ». Il adore bricoler des bibliothèques open source et mentionne souvent ses sorties en voilier sur la Garonne le week-end. Il accorde de l'importance à la sécurité des données, à une documentation claire et à des budgets prévisibles."
        gender: m
        tone: curious
