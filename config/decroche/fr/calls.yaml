        pain: 'SoftCloud ne dispose d’aucune expertise IA interne et son CTO part à la fin du trimestre, ce qui crée un double besoin : expertise IA pour le POC SmartPlanner et un accompagnement stratégique (CTO à temps partagé) pendant la transition.'
