    seller: manager
    days_ago: 19
    scenario:
      title: 'Appel de suivi pour détecter de nouvelles opportunités'
      type: discovery
      difficulty: 1
      minutes: 8
      context: "Vous êtes le responsable commercial qui a livré avec succès une équipe de développement dédiée et assure la maintenance applicative continue pour un petit client industriel. Vous l'appelez pour voir si de nouveaux besoins ont émergé et pour explorer comment Etixio peut aider davantage."
      goal: "Obtenir une réunion vidéo de 30 minutes avec les décideurs du client pour discuter d'un éventuel proof-of-concept IA ou d'un audit technique."
      objectives:
        - 'Détecter un nouveau besoin au-delà du contrat de maintenance actuel'
        - 'Identifier la ou les personnes qui portent le nouveau besoin et qui peuvent autoriser un projet'
        - 'Réserver une réunion de découverte dédiée (visioconférence) dans les deux semaines à venir'
      material: |-
        Client : Alpine Manufacturing
        Secteur : Conception et assemblage d'équipements industriels
        Taille : 40 employés
        Localisation : Annecy, France
        Engagement actuel d'Etixio : Équipe dédiée (5 développeurs seniors Java/Spring) pour l'intégration ERP, maintenance applicative continue (TMA) – contrat débuté en mars 2024, renouvelé en juillet 2025.
        Dernier résultat de projet : Livraison dans les délais, aucun défaut majeur, retours internes positifs.
        Contacts clés : Claire Dupont (CTO, f), Pierre Léger (PDG, h).
        Initiatives récentes : Pilote de capteurs IoT sur machines CNC, journaux de dépannage manuels en croissance.
        Intérêt potentiel : Maintenance prédictive basée sur l'IA, audit technique de l'architecture actuelle, CTO-as-a-Service pendant la transition de direction.
      persona:
        name: 'Claire Dupont'
        role: 'Directrice technique'
        company: 'Alpine Manufacturing, équipements industriels, 40 employés, Annecy'
        personality: "Claire est chaleureuse, bavarde et adore raconter des histoires sur l'atelier, en particulier ses week-ends de ski dans les Alpes. Elle parle avec enthousiasme, intégrant souvent des anecdotes personnelles dans les conversations professionnelles, et valorise la transparence et les partenariats à long terme."
        gender: f
        tone: warm
      opening: "Bonjour, c'est Claire d'Alpine Manufacturing – comment allez-vous aujourd'hui ?"
      brief:
        budget: "Ils ont earmarked 80 k€ pour un proof-of-concept IA de six mois et sont prêts à allouer 30 k€ supplémentaires pour un court audit technique, mais la dépense totale doit rester sous 100 k€ pour l'exercice fiscal."
        pain: "L'équipe d'ingénierie est submergée par l'analyse manuelle des journaux de pannes, ce qui allonge les temps d'arrêt. Ils manquent également d'une feuille de route claire pour transformer les données des capteurs en informations prédictives, et le prochain départ du CTO crée un vide dans la direction technique."
        decision: "L'approbation finale reviendra au PDG, Pierre Léger, mais Claire (la CTO) pilote les spécifications techniques. Le délai de décision est de quatre semaines, dicté par la nécessité de démarrer le pilote IA avant le prochain cycle de production en mars 2027."
        objections: "Claire s'inquiétera de la qualité offshore, de la sécurité des données (RGPD) et du temps nécessaire pour intégrer une nouvelle équipe offshore. Elle remettra également en question la capacité d'Etixio à livrer des résultats IA assez rapidement compte tenu du calendrier serré."
        'yes': "Si Etixio propose un diagnostic IA gratuit et peut planifier un appel vidéo de 30 minutes avec le CTO (Marc Giraud Sauveur) dans la semaine à venir, Claire acceptera une réunion de découverte pour préciser le proof-of-concept et l'audit."
        secret: "Alpine Manufacturing est sur le point de lancer un appel d'offres compétitif pour une plateforme de maintenance prédictive de bout en bout de 200 k€. Si Etixio peut se positionner comme un partenaire stratégique pour la composante IA et fournir un CTO-as-a-Service intérimaire, ils pourraient se voir attribuer l'ensemble du contrat."
        setup: "Vous savez qu'Etixio a livré une équipe dédiée pour leur intégration ERP et gère désormais leur maintenance applicative. Ils développent actuellement des pilotes de capteurs IoT sur leurs machines CNC et évaluent des moyens de réduire le dépannage manuel. Leur poste de CTO sera vacant dans un mois, et ils recherchent un support technique à court terme."
      situation:
