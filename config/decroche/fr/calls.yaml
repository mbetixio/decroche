        objections: '1. « Nous avons déjà eu des mauvaises expériences offshore, la qualité n’est pas toujours au rendez‑vous ». 2. « Le décalage horaire avec Madagascar compliquera la communication quotidienne ».'
        'yes': 'Camille accepterait de caler immédiatement une visio de 30 minutes avec le CTO d’Etixio si on propose un audit technique IA gratuit, un plan d’accompagnement concret et des références d’agents IA similaires (ex. assistant de dossiers patients, plateforme e‑learning).'
        secret: 'Le CEO Marc Léger envisage de allouer un budget supplémentaire de 20 k€ si le CTO d’Etixio peut garantir un transfert de compétences rapide et une continuité après le départ du CTO interne, ce qui ferait exploser le budget initial et ouvre la porte à un engagement plus large.'
        setup: 'Camille connaît Etixio parce qu’elle a été très satisfaite de la TMA qui a maintenu leur plateforme de facturation. Elle est en plein brainstorming sur une nouvelle fonctionnalité IA et le départ imminent de son CTO interne, ce qui la rend curieuse mais prudente vis‑à‑vis d’une nouvelle collaboration offshore.'
