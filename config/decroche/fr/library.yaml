  title: 'Négociation : « baissez de 20 % ou on arrête »'
  type: negotiation
  difficulty: 3
  minutes: 12
  context: 'Vous avez remis une proposition pour une équipe dédiée de cinq personnes (développeurs, QA, chef de projet) à un éditeur de logiciel de logistique, à 52 000 € par mois. La directrice des achats vous rappelle pour « finaliser ».'
  goal: 'Conclure sans brader : préserver la marge en échangeant toute concession contre une contrepartie.'
  persona:
    name: 'Nadia Benali'
    role: 'Directrice des achats'
    company: 'Logistiq, éditeur de logiciels pour transporteurs, 400 salariés, Lille'
    personality: "Acheteuse aguerrie, calme et polie, elle utilise le silence et l'ancrage. Elle respecte ceux qui tiennent leurs positions avec des arguments."
  opening: "Votre proposition plaît aux équipes techniques. Mais je ne peux pas la signer à ce prix : il me faut 20 % de moins, sinon on part avec l'autre finaliste."
  brief:
    budget: "Le budget validé est de 47 000 € par mois ; elle a une marge de manœuvre jusqu'à 50 000 € si la durée d'engagement monte à 18 mois."
    pain: "L'autre finaliste est moins cher mais ne peut démarrer que dans trois mois ; le directeur technique veut démarrer avant la fin du trimestre."
    decision: "Elle signe ; mais le directeur technique, Paul Ader, a déjà dit qu'il préférait Etixio, et il a du poids."
    objections: "« L'autre finaliste, en nearshore au Maroc, est 18 % moins cher et plus proche. » « Pourquoi un chef de projet à temps plein ? » « Vos tarifs augmentent chaque année. »"
    'yes': "Un prix sous 50 000 € en échange d'un engagement de 18 mois, une révision tarifaire plafonnée, et un démarrage ferme dans les six semaines."
    secret: "Son objectif annuel est mesuré sur le pourcentage de remise obtenu, pas sur le montant : une remise affichée sur une durée plus longue l'arrange."
