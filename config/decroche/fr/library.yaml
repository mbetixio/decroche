              - { name: symptôme, value: 'Avertissement de sécurité affiché aux visiteurs' }
              - { name: statut, value: "Résolu par l'agence après relance" }
            note: "Les clientes voyaient « site non sécurisé » avant d'acheter. J'ai dû relancer deux fois l'agence pour qu'elle s'en occupe."
          -
            title: "DEM-2026-0118 — Demande d'export des commandes"
