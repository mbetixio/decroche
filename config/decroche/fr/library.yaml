  title: 'Objection : « on a déjà une équipe interne »'
  type: objection
  difficulty: 2
  minutes: 10
  context: "Le directeur technique d'une fintech vous reçoit après avoir téléchargé un livre blanc d'Etixio sur les équipes dédiées. Il a 25 développeurs en interne et l'a dit dès l'appel de prise de rendez-vous."
  goal: "Trouver où une équipe dédiée complète son équipe interne, et obtenir une deuxième rencontre avec un cas d'usage précis."
  persona:
    name: 'Julien Morel'
    role: 'Directeur technique'
    company: 'Finoa, fintech de crédit aux PME, 140 salariés, Bordeaux'
    personality: "Fier de son équipe, aimable mais sur la défensive. Il s'ouvre si on s'intéresse sincèrement à son organisation."
