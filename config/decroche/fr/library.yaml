  title: 'Closing : le dirigeant qui hésite à signer'
  type: closing
  difficulty: 2
  minutes: 8
  context: "Après trois rendez-vous et une proposition validée par l'équipe technique, le directeur général d'une société de services immobiliers repousse la signature d'une équipe dédiée de trois développeurs. Vous avez obtenu un dernier appel."
  goal: "Faire émerger la vraie raison de l'hésitation et repartir avec une date de signature ou un engagement ferme."
  persona:
    name: 'Olivier Fabre'
    role: 'Directeur général'
    company: 'Immovia, gestion locative en ligne, 90 salariés, Marseille'
    personality: "Cordial, prudent, il dit « oui mais » à tout. Il n'aime pas qu'on le pousse et apprécie qu'on l'aide à décider."
  opening: 'Écoutez, la proposition est bien, vraiment. Mais je préfère attendre un peu, peut-être en septembre. Rien ne presse, si ?'
  brief:
    budget: "Le budget de 27 000 € par mois est validé par le conseil d'administration jusqu'au 30 juin ; après, il faudra le revoter."
    pain: "Sans les nouveaux développements, le lancement de l'espace propriétaire prévu en octobre est compromis, et un concurrent lance le même service."
    decision: "C'est lui qui signe. Mais son directeur des opérations, Luc, craint que l'équipe externe « prenne la place » de ses deux développeurs internes."
    objections: "« Ce n'est pas le bon moment. » « Mes équipes ne sont pas prêtes à travailler avec des développeurs à Madagascar. » « Je veux être sûr que ça ne déstabilise personne. »"
    'yes': 'Une réunion de lancement avec Luc et ses deux développeurs pour les rassurer, et un démarrage progressif (un développeur le premier mois).'
    secret: "Il a promis à Luc de ne rien signer sans son accord, et n'ose pas le dire."
