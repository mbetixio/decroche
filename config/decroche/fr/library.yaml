        minutes: 60
        what: 'Appel cabinet juridique — contrat freelance (préavis, PI)'
      -
        when: '2026-11-18 15:00'
        minutes: 60
        what: 'Point trésorerie avec la banque'
      -
        when: '2026-11-19 11:00'
        minutes: 60
        what: 'Comité risque client — dossier grand compte menaçant'
      -
        when: '2026-11-20 14:00'
        minutes: 60
        what: 'Clôture mensuelle — validation provisions'
      -
        when: '2026-11-23 09:30'
