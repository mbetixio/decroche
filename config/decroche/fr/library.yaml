            title: 'INC-2026-0342 — Site inaccessible pendant le Black Friday'
            when: '2026-11-27'
            details:
              - { name: gravité, value: Critique }
              - { name: durée, value: '2 jours (27 et 28 novembre 2026)' }
              - { name: 'CA perdu estimé', value: '60 000 €' }
              - { name: cause, value: 'Base de données saturée, aucune alerte de supervision' }
              - { name: statut, value: 'Clos — sans correctif de fond' }
            note: "Le site est resté inaccessible du vendredi matin au samedi après-midi. Nous avons perdu le pic de ventes. L'agence a redémarré le serveur mais n'a jamais expliqué pourquoi c'est arrivé."
          -
            title: 'INC-2026-0351 — Paiements refusés par intermittence'
            when: '2026-12-05'
            details:
              - { name: gravité, value: Élevée }
              - { name: durée, value: '3 heures' }
              - { name: 'paniers perdus', value: '18 paniers abandonnés' }
              - { name: cause, value: 'Inconnue — non élucidée' }
              - { name: statut, value: "En attente de l'agence" }
            note: "Trois clientes ont écrit qu'elles n'arrivaient pas à payer. C'est revenu tout seul. L'agence dit qu'elle n'a rien trouvé dans les logs."
          -
            title: 'INC-2026-0360 — Certificat de sécurité expiré'
            when: '2026-12-11'
