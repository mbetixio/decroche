    pain: "La migration de l'ancien cœur bancaire (en PHP 5) monopolise ses meilleurs développeurs, qui s'ennuient : deux ont démissionné ce trimestre."
    decision: 'Il décide ; le directeur financier vérifie que ça reste dans son budget opérationnel.'
    objections: '« Une équipe offshore ne connaîtra pas notre métier. » « Je ne veux pas créer deux classes de développeurs. » « On a un audit de sécurité bancaire très strict. »'
    'yes': 'Confier la migration du legacy à une équipe dédiée encadrée par un de ses seniors, pour libérer son équipe sur le nouveau produit.'
    secret: "Son CEO lui a demandé de livrer la nouvelle offre de crédit instantané en six mois, ce qui est impossible avec l'équipe actuelle."
