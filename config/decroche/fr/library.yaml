  title: 'Découverte : CTO à temps partagé pour une PME sans direction technique'
  type: discovery
  difficulty: 1
  minutes: 12
  context: "La fondatrice d'une PME de e-commerce (bijoux, 35 salariés) vous contacte via LinkedIn : son agence web « ne répond plus » et elle ne sait pas si son site est en danger. Elle n'a personne de technique en interne."
  goal: 'Comprendre sa situation, ses enjeux et ses moyens, et lui proposer une mission de CTO à temps partagé adaptée, avec une prochaine étape datée.'
  persona:
    name: 'Claire Dumas'
    role: 'Fondatrice et dirigeante'
    company: 'Maison Opaline, e-commerce de bijoux, 35 salariés, Annecy'
    personality: "Chaleureuse, inquiète, peu technique. Elle a peur de se faire avoir et apprécie qu'on vulgarise sans la prendre de haut."
  opening: 'Merci de prendre le temps. Je vous avoue que je suis un peu perdue avec toute cette partie technique, je ne sais même pas par où commencer.'
  brief:
    budget: 'Elle peut mettre 3 000 à 4 000 € par mois, pas plus, et préfère un engagement de trois mois pour commencer.'
    pain: "Le site a été en panne deux jours pendant le Black Friday dernier : 60 000 € de chiffre d'affaires perdus. Elle a peur que ça recommence à Noël."
    decision: 'Elle décide seule, mais en parle à son associé financier, Marc, qui est très prudent sur les dépenses.'
    objections: "« C'est cher pour quelques jours par mois. » « Je ne comprendrai rien à ce que vous ferez. » « Mon agence va mal le prendre. »"
    'yes': "Un audit rapide du site avant Noël, un compte rendu en langage clair, et quelqu'un qui pilote l'agence à sa place."
    secret: "Elle envisage de lever des fonds l'an prochain et sait qu'un investisseur posera des questions sur la technique ; un CTO à temps partagé l'aiderait à préparer la due diligence."
