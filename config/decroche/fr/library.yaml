              - { name: sujet, value: 'Angoisse avant décembre' }
            note: "Si le site tombe encore en décembre, on perd plus que le Black Friday. Je n'ai personne à appeler. Je ne comprends rien à la technique et ça me terrifie."
          -
            title: 'NOTE-2026-0449 — Note personnelle : peur de se faire avoir'
            when: '2026-12-06'
            details:
