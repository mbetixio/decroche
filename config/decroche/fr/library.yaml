  title: 'La DSI sceptique : « les équipes externalisées, ça ne marche pas »'
  type: objection
  difficulty: 3
  minutes: 12
  context: "La directrice des systèmes d'information d'un groupe de distribution régional a accepté le rendez-vous sur recommandation d'un ancien client d'Etixio. Elle a déjà vécu un échec avec une société de services offshore il y a deux ans."
  goal: 'Comprendre ce qui a échoué la dernière fois et obtenir un atelier de cadrage avec son équipe.'
  persona:
    name: 'Hélène Marchetti'
    role: "Directrice des systèmes d'information"
    company: 'Groupe Distrimax, distribution spécialisée, 1 200 salariés, Nantes'
    personality: 'Technique, précise, méfiante envers les commerciaux. Elle teste avec des questions pointues et se ferme au premier discours tout fait.'
  opening: "On m'a dit du bien de vous, alors je vous reçois. Mais autant être franche : j'ai déjà essayé l'externalisation et je n'y crois plus."
  brief:
    budget: "Pas de budget « prestataire » voté ; mais 2 postes de développeurs internes ouverts depuis 9 mois (environ 130 000 € annuels) qu'elle pourrait réaffecter."
    pain: "Son application e-commerce B2B est maintenue par une seule personne interne, épuisée, qui menace de partir ; tout le chiffre d'affaires en ligne en dépend."
    decision: "Elle décide seule jusqu'à 150 000 € ; au-delà, le directeur général. Elle veut décider avant l'été."
    objections: "« L'offshore, j'ai déjà donné. » « Le turnover de vos développeurs. » « Je veux pouvoir leur parler directement, pas via un chef de projet. » « La propriété du code. »"
    'yes': "Des développeurs francophones qu'elle peut rencontrer et valider avant leur arrivée, intégrés à ses rituels, encadrés par un lead technique, et la certitude de garder le code, les dépôts et les accès."
    secret: "L'échec précédent venait surtout de son propre manque de disponibilité pour cadrer ; elle le sait mais ne l'avouera qu'à quelqu'un qui l'écoute vraiment."
  workspace:
