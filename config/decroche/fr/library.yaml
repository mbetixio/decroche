            note: "Marc accepte d'étudier une solution, mais pas plus de 4 000 € par mois et pas d'engagement long. Il veut voir un premier résultat avant de s'engager."
          -
            title: "NOTE-2026-0455 — Note personnelle : l'agence et la relation"
            when: '2026-12-10'
            details:
