              - { name: sujet, value: 'Méfiance sur les prestataires' }
            note: "J'ai déjà signé des devis que je ne comprenais pas. Je ne veux plus qu'on m'explique en jargon pour me faire accepter n'importe quoi. Je veux qu'on me parle simplement."
          -
            title: 'CR-2026-12-09 — Réunion avec Marc sur les dépenses'
            when: '2026-12-09'
            details:
