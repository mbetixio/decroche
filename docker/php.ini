; Practicall in production.
memory_limit = 256M
; Analysing a website or writing a situation takes up to two minutes.
max_execution_time = 300
; The persona's replies are streamed: nothing may hold them back.
output_buffering = 0
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
