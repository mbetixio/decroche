; Sparring en production.
date.timezone = Europe/Paris
memory_limit = 256M
; L'analyse d'un site et l'écriture d'une situation prennent jusqu'à deux minutes.
max_execution_time = 300
; Les réponses du persona partent en flux : rien ne doit les retenir.
output_buffering = 0
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
